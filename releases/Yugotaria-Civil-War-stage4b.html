  function gotText(got) {
    const parts = [];
    const a = Object.entries(got.ammo).map(([c, n]) => `${CONFIG.ammo[c].name} ${n}`);
    if (a.length) parts.push('набої: ' + a.join(', '));
    if (got.fuel) parts.push(`пальне ${Engine.fmt(got.fuel)} л`);
    if (got.men) parts.push(`поповнення ${got.men} ос.`);
    const w = Object.entries(got.weapons).map(([m, n]) => `${m} ×${n}`);
    if (w.length) parts.push('зброя: ' + w.join(', '));
    return parts.join('; ');
  }

  // ---------------------------------------------------- ручні дії
  function costCheck(state, u, what) {
    const cost = Engine.mpMax(u) * LG().actionShare;
    if (u.mp < cost - 1e-9) return `${what} займає ${LG().actionShare * 100}% години (залишилось ${Engine.fmt(u.mp)} ОР).`;
    if (u.attackedTurn === state.time.turn) return 'Підрозділ уже вів бій цієї години.';
    return null;
  }
  function spend(u) { u.mp = Math.max(0, u.mp - Engine.mpMax(u) * LG().actionShare); u.movedThisPhase = true; }

  function storesNear(state, u) {
    const grid = g(state);
    return facilities(state).filter(f => isStore(f) && (f.owner === u.faction || Politics.sharesSupply(state, f.owner, u.faction)) && !f.destroyed && grid.dist(f.idx, u.idx) <= 1);
  }

  function resupplyReason(state, u) {
    if (!u) return 'Підрозділ не знайдено.';
    if (u.embarked != null) return 'Спершу висадіть підрозділ.';
    if (!storesNear(state, u).length) return 'Поруч немає свого складу (потрібно бути в гексі складу або поруч).';
    return costCheck(state, u, 'Поповнення');
  }
  function resupply(state, unitId) {
    const u = Engine.unitById(state, unitId);
    const err = Engine.checkCommandable(state, u) || resupplyReason(state, u);
    if (err) return { ok: false, reason: err };
    const st = storesNear(state, u)[0];
    const got = resupplyFrom(state, u, st.stock, 1, { replacements: 0 });
    spend(u);
    const t = gotText(got) || 'нічого не знадобилося або на складі порожньо';
    Engine.log(state, `${u.name}: поповнення на «${st.name}» — ${t}.`, 'order', u.faction);
    return { ok: true, text: t };
  }

  // Вантаж техніки (кг)
  function cargoKg(u) { const c = Loot.ensureCargo(u); return stockKg({ ammo: c.ammo, weapons: c.weapons, goods: c.goods || {} }); }
  function cargoCapKg(u) { return LG().vehicleCargoKg[u.type] || 0; }

  // Звідки можна вантажити: будь-який свій об’єкт у гексі (склад, завод, родовище, НПЗ, шпиталь)
  function sourcesAt(state, u) {
    return facilities(state).filter(f => f.idx === u.idx && !f.destroyed && (f.owner === u.faction || (isStore(f) && Politics.sharesSupply(state, f.owner, u.faction))) && stockKg(f.stock) > 0);
  }
  function loadReason(state, u) {
    if (!u || !u.vehicle) return 'Завантажувати запаси може лише техніка.';
    if (!sourcesAt(state, u).length) return 'Машина має стояти в гексі свого об’єкта із запасами (склад, завод, родовище, НПЗ).';
    return costCheck(state, u, 'Завантаження');
  }
  // preset: ammo | fuel | med | mix
  function loadFromStore(state, unitId, preset) {
    const u = Engine.unitById(state, unitId);
    const err = Engine.checkCommandable(state, u) || loadReason(state, u);
    if (err) return { ok: false, reason: err };
    const st = sourcesAt(state, u).find(f => preset === 'crude' ? (f.stock.goods.crude || 0) > 0 : true) || sourcesAt(state, u)[0];
    const c = Loot.ensureCargo(u); if (!c.goods) c.goods = {};
    let room = cargoCapKg(u) - cargoKg(u);
    const moved = { ammo: {}, goods: {} };
    const take = (kind, key, kgEach, limitKg) => {
      let have = st.stock[kind][key] || 0;
      if (preset === 'mix') have = Math.floor(have * LG().mixShare);
      if (have <= 0 || room <= 0) return;
      const n = Math.min(have, Math.floor(Math.min(room, limitKg) / kgEach));
      if (n <= 0) return;
      st.stock[kind][key] -= n; room -= n * kgEach;
      const dst = kind === 'ammo' ? c.ammo : c.goods;
      dst[key] = (dst[key] || 0) + n; moved[kind][key] = (moved[kind][key] || 0) + n;
    };
    const ammoKeys = Object.keys(st.stock.ammo).filter(k => st.stock.ammo[k] > 0);
    if (preset === 'ammo' || preset === 'mix') {
      const share = preset === 'mix' ? 0.6 : 1;
      const per = room * share / Math.max(1, ammoKeys.length);
      for (const k of ammoKeys) take('ammo', k, CONFIG.ammo[k].kg, per);
    }
    if (preset === 'fuel' || preset === 'mix') take('goods', 'fuel', CONFIG.goods.fuel.kg, preset === 'mix' ? room * 0.7 : room);
    if (preset === 'med' || preset === 'mix') take('goods', 'med', CONFIG.goods.med.kg, room);
    if (preset === 'crude') take('goods', 'crude', CONFIG.goods.crude.kg, room);
    if (preset === 'eng' || preset === 'mix') take('goods', 'eng', CONFIG.goods.eng.kg, preset === 'mix' ? room * 0.3 : room);
    if (preset === 'parts') take('goods', 'parts', CONFIG.goods.parts.kg, room);
    if (preset === 'all') {
      for (const k of Object.keys(st.stock.ammo)) take('ammo', k, CONFIG.ammo[k].kg, room);
      for (const k of Object.keys(st.stock.goods)) take('goods', k, CONFIG.goods[k].kg, room);
      for (const m of Object.keys(st.stock.weapons)) {
        const n = Math.min(st.stock.weapons[m] || 0, Math.floor(room / CONFIG.weaponKg));
        if (n > 0) { st.stock.weapons[m] -= n; room -= n * CONFIG.weaponKg; c.weapons[m] = (c.weapons[m] || 0) + n; moved.weapons = moved.weapons || {}; moved.weapons[m] = (moved.weapons[m] || 0) + n; }
      }
    }
    if (!sumObj(moved.ammo) && !sumObj(moved.goods) && !sumObj(moved.weapons)) return { ok: false, reason: 'На об’єкті немає потрібних запасів або машина повна.' };
    spend(u);
    const t = describeStock(moved);
    Engine.log(state, `${u.name}: завантажено на «${st.name}» — ${t}. Вантаж ${Math.round(cargoKg(u))}/${cargoCapKg(u)} кг.`, 'order', u.faction);
    return { ok: true, text: t };
  }

  function describeStock(st) {
    const parts = [];
    for (const [c, n] of Object.entries(st.ammo || {})) if (n > 0) parts.push(`${CONFIG.ammo[c].name} ${n}`);
    for (const [m, n] of Object.entries(st.weapons || {})) if (n > 0) parts.push(`${m} ×${n}`);
    for (const [k, n] of Object.entries(st.goods || {})) if (n > 0) parts.push(`${CONFIG.goods[k].name} ${Engine.fmt(r1(n))} ${CONFIG.goods[k].unit}`);
    return parts.join(', ') || 'нічого';
  }

  // Видати з вантажу машини підрозділам у тому ж гексі
  function issueReason(state, v) {
    if (!v || !v.vehicle) return 'Видавати запаси може лише техніка з вантажем.';
    const c = Loot.ensureCargo(v);
    if (!sumObj(c.ammo) && !(c.goods && sumObj(c.goods))) return 'Вантаж порожній.';
    if (!state.units.some(u => u !== v && u.faction === v.faction && u.idx === v.idx && u.embarked == null)) return 'У гексі немає своїх підрозділів.';
    return costCheck(state, v, 'Видача запасів');
  }
  function issueFromCargo(state, vehicleId) {
    const v = Engine.unitById(state, vehicleId);
    const err = Engine.checkCommandable(state, v) || issueReason(state, v);
    if (err) return { ok: false, reason: err };
    const c = Loot.ensureCargo(v); if (!c.goods) c.goods = {};
    const stock = { ammo: c.ammo, weapons: {}, goods: c.goods };
    const lines = [];
    for (const u of state.units.filter(x => x.faction === v.faction && x.idx === v.idx && x !== v)) {
      const got = resupplyFrom(state, u, stock, 1, {});
      const t = gotText(got);
      if (t) lines.push(`${u.name}: ${t}`);
    }
    // і собі пальне
    const own = resupplyFrom(state, v, stock, 1, {});
    if (gotText(own)) lines.push(`${v.name}: ${gotText(own)}`);
    spend(v);
    Engine.log(state, `${v.name}: видано запаси з вантажу — ${lines.join('; ') || 'нікому нічого не знадобилося'}.`, 'order', v.faction);
    return { ok: true, text: lines.join('; ') };
  }

  // Розвантажити вантаж на склад у гексі (або створити польовий склад)
  function unloadReason(state, v) {
    if (!v || !v.vehicle) return 'Розвантажувати може лише техніка.';
    const c = Loot.ensureCargo(v);
    if (!sumObj(c.ammo) && !sumObj(c.weapons) && !(c.goods && sumObj(c.goods))) return 'Вантаж порожній.';
    return costCheck(state, v, 'Розвантаження');
  }
  function unloadToStore(state, vehicleId) {
    const v = Engine.unitById(state, vehicleId);
    const err = Engine.checkCommandable(state, v) || unloadReason(state, v);
    if (err) return { ok: false, reason: err };
    let st = facilityAt(state, v.idx).find(f => f.owner === v.faction && (isStore(f) || f.type === 'hospital' || f.type === 'refinery'));
    let created = false;
    if (!st) { st = makeFacility(state, 'fieldDepot', v.idx, v.faction, `Польовий склад ${g(state).label(v.idx)}`); created = true; }
    const c = Loot.ensureCargo(v);
    const moved = { ammo: Object.assign({}, c.ammo), weapons: Object.assign({}, c.weapons), goods: Object.assign({}, c.goods || {}) };
    if (st.type === 'hospital') { addObj(st.stock.goods, { med: (c.goods || {}).med || 0 }); if (c.goods) c.goods.med = 0; }
    else if (st.type === 'refinery') { addObj(st.stock.goods, { crude: (c.goods || {}).crude || 0 }); if (c.goods) c.goods.crude = 0; }
    else { addObj(st.stock.ammo, c.ammo); addObj(st.stock.weapons, c.weapons); addObj(st.stock.goods, c.goods); v.cargo = { weapons: {}, ammo: {}, goods: {} }; }
    spend(v);
    Engine.log(state, `${v.name}: розвантажено на «${st.name}»${created ? ' (створено польовий склад)' : ''} — ${describeStock(moved)}.`, 'order', v.faction);
    return { ok: true, created };
  }

  // Знищити власний склад, щоб не дістався противнику
  function destroyReason(state, u, f) {
    if (!u || !f) return 'Немає об’єкта.';
    if (f.owner !== u.faction) return 'Можна знищити лише власний об’єкт.';
    if (f.idx !== u.idx) return 'Підрозділ має бути в гексі об’єкта.';
    return costCheck(state, u, 'Знищення');
  }
  function destroyFacility(state, unitId, facilityId) {
    const u = Engine.unitById(state, unitId), f = byId(state, facilityId);
    const err = Engine.checkCommandable(state, u) || destroyReason(state, u, f);
    if (err) return { ok: false, reason: err };
    f.stock = emptyStock();
    if (isStore(f)) f.destroyed = true; else { f.condition = 0; f.offline = 999; }
    spend(u);
    Engine.log(state, `${u.name}: «${f.name}» знищено разом із запасами, щоб не дістався противнику.`, 'warn', u.faction, null);
    return { ok: true };
  }

  // ---------------------------------------------------- медицина
  function medevacsNear(state, u) {
    const grid = g(state);
    return state.units.filter(x => x.type === 'medevac' && x.faction === u.faction && x.personnel.fit > 0 && grid.dist(x.idx, u.idx) <= 1);
  }
  function pickupReason(state, mv) {
    if (!mv || mv.type !== 'medevac') return 'Лише евакуаційна медична група.';
    const room = MD().medevacCapacity - (mv.carriedWounded || 0);
    if (room <= 0) return `Група вже несе ${mv.carriedWounded} поранених (максимум ${MD().medevacCapacity}).`;
    if (!state.units.some(u => u !== mv && u.faction === mv.faction && u.idx === mv.idx && u.personnel.wounded > 0)) return 'У гексі немає своїх поранених.';
    return costCheck(state, mv, 'Евакуація');
  }
  function pickupWounded(state, mvId) {
    const mv = Engine.unitById(state, mvId);
    const err = Engine.checkCommandable(state, mv) || pickupReason(state, mv);
    if (err) return { ok: false, reason: err };
    let room = MD().medevacCapacity - (mv.carriedWounded || 0);
    const parts = [];
    for (const u of state.units.filter(x => x !== mv && x.faction === mv.faction && x.idx === mv.idx && x.personnel.wounded > 0)) {
      const n = Math.min(room, u.personnel.wounded);
      if (n <= 0) break;
      u.personnel.wounded -= n; u.personnel.evacuated = (u.personnel.evacuated || 0) + n;
      mv.carriedWounded = (mv.carriedWounded || 0) + n; room -= n;
      parts.push(`${u.name} — ${n}`);
    }
    spend(mv);
    Engine.log(state, `${mv.name}: забрано поранених (${parts.join(', ')}). Несе ${mv.carriedWounded}/${MD().medevacCapacity}.`, 'order', mv.faction);
    return { ok: true };
  }

  function hospitalsOf(state, f) { return facilities(state).filter(x => x.type === 'hospital' && x.owner === f && !x.destroyed && x.condition > 0); }
  function hospitalRoom(h) { return Math.max(0, FT().hospital.beds - h.patients); }

  // ---------------------------------------------------- кінець години
  function endOfHour(state) {
    ensureEconomy(state);
    const report = [[], [], []];
    // 1. Захоплення об’єктів (контроль гекса вже оновлено)
    for (const f of facilities(state)) {
      if (f.destroyed) continue;
      const c = state.map.control[f.idx];
      if (c >= 0 && c !== f.owner) {
        const was = f.owner;
        f.owner = c;
        if (!isStore(f) && f.type !== 'hospital') { f.condition = Math.max(0, f.condition - EC().capturedDamage); f.offline = EC().capturedOfflineHours; }
        if (f.type === 'hospital' && f.patients > 0) {
          state.prisoners.push({ holder: c, origin: was, count: f.patients, unit: f.name, day: state.time.day, hour: state.time.hour });
          Engine.log(state, `«${f.name}»: ${f.patients} поранених потрапили в полон.`, 'warn', c, [c, was]);
          f.patients = 0;
        }
        if (!f.knownBy.includes(c)) f.knownBy.push(c);
        Engine.log(state, `«${f.name}» захоплено: ${Engine.fname(c)}. Запаси переходять переможцю${!isStore(f) && f.type !== 'hospital' ? `; стан ${f.condition}%, простій ${f.offline} год` : ''}.`, 'event', c, [c, was]);
      }
    }
    for (let fac = 0; fac < 3; fac++) {
      const eco = state.economy[fac];
      const net = network(state, fac);
      const inNet = x => net.comp[x.idx] >= 0 && net.storeComps.has(net.comp[x.idx]);
      const income = { settlements: 0 }, expense = { production: 0 };
      // 2. Доходи й мобілізаційний ресурс
      for (const s of state.map.settlements) if (s.control === fac) {
        income.settlements += Math.round((EC().income[s.kind] || 0) * Politics.incomeMult(state, s));
        eco.manAcc += (EC().manpowerPerHour[s.kind] || 0) * Politics.manpowerMult(state, s);
      }
      eco.money += income.settlements;
      const wholeMen = Math.floor(eco.manAcc); eco.manAcc -= wholeMen; eco.manpower += wholeMen;
      // 3. Виробництво
      const produced = [];
      for (const f of facilities(state).filter(x => x.owner === fac && !x.destroyed)) {
        const def = FT()[f.type];
        if (f.offline > 0) { f.offline--; continue; }
        if (!def.cost && f.type !== 'refinery') continue;
        if (state.map.control[f.idx] !== fac || f.condition <= 0) continue;
        const sid = state.map.settlement[f.idx];
        const town = sid >= 0 ? state.map.settlements[sid] : null;
        if (town && town.unrest === 'strike') { produced.push(`${f.name}: страйк — робота зупинена`); continue; }
        const k = f.condition / 100 * (town && town.damage ? 1 - town.damage.industry / 200 : 1);
        const cost = def.cost || 0;
        if (eco.money < cost) { produced.push(`${f.name}: простій — бракує коштів`); continue; }
        if (f.type === 'refinery') {
          const crude = Math.min(f.stock.goods.crude || 0, Math.floor(def.crudeIn * k));
          if (crude <= 0) { produced.push(`${f.name}: простій — немає сирої нафти`); continue; }
          f.stock.goods.crude -= crude;
          const fuel = Math.floor(crude * def.fuelOut / def.crudeIn);
          f.stock.goods.fuel = (f.stock.goods.fuel || 0) + fuel;
          eco.money -= cost; expense.production += cost;
          produced.push(`${f.name}: ${crude} л нафти → ${fuel} л пального`);
          continue;
        }
        if (def.out.ammo) addObj(f.stock.ammo, def.out.ammo, k);
        if (def.out.weapons) addObj(f.stock.weapons, def.out.weapons, k);
        if (def.out.goods) addObj(f.stock.goods, def.out.goods, k);
        eco.money -= cost; expense.production += cost;
        produced.push(`${f.name}: ${describeStock({ ammo: def.out.ammo ? scale(def.out.ammo, k) : {}, weapons: def.out.weapons ? scale(def.out.weapons, k) : {}, goods: def.out.goods ? scale(def.out.goods, k) : {} })}`);
      }
      // 4. Тилова мережа: підприємства → склади, нафта → НПЗ
      const refineries = net.own.filter(x => x.type === 'refinery');
      for (const f of net.own) {
        if (!inNet(f) || isStore(f) || f.type === 'hospital') continue;
        const dst = net.stores.find(st => net.comp[st.idx] === net.comp[f.idx]);
        if (f.type === 'oil_field') {
          const ref = refineries.find(r => net.comp[r.idx] === net.comp[f.idx]);
          if (ref && f.stock.goods.crude) { ref.stock.goods.crude = (ref.stock.goods.crude || 0) + f.stock.goods.crude; f.stock.goods.crude = 0; }
          continue;
        }
        if (!dst) continue;
        const keepCrude = f.type === 'refinery' ? (f.stock.goods.crude || 0) : 0;
        addObj(dst.stock.ammo, f.stock.ammo); addObj(dst.stock.weapons, f.stock.weapons);
        const goods = Object.assign({}, f.stock.goods); delete goods.crude;
        addObj(dst.stock.goods, goods);
        f.stock = emptyStock(); if (keepCrude) f.stock.goods.crude = keepCrude;
      }
      // медзапаси в шпиталі мережі
      for (const h of net.own.filter(x => x.type === 'hospital' && inNet(x))) {
        const need = Math.ceil(Math.max(0, h.patients * MD().medPerPatientHour * 6 - (h.stock.goods.med || 0)));
        const st = net.stores.find(s => net.comp[s.idx] === net.comp[h.idx] && (s.stock.goods.med || 0) > 0);
        if (st && need > 0) { const t = Math.min(need, st.stock.goods.med); st.stock.goods.med -= t; h.stock.goods.med = (h.stock.goods.med || 0) + t; }
      }
      // 5. Автопостачання підрозділів
      const supplied = [];
      for (const u of state.units.filter(x => x.faction === fac)) {
        const d = u.embarked != null ? -1 : net.dist[u.idx];
        u.inSupply = d >= 0;
        if (!u.inSupply) continue;
        const st = nearestStore(state, net, u.idx);
        if (!st) continue;
        const got = resupplyFrom(state, u, st.stock, LG().resupplyShare, { replacements: u.combatTurn === state.time.turn ? 0 : LG().replacementsPerHour });
        const t = gotText(got);
        if (t) supplied.push(`${u.name}: ${t}`);
        // поранені — у шпиталь мережі
        const hs = hospitalsOf(state, fac).filter(h => net.comp[h.idx] >= 0 && net.comp[h.idx] === net.comp[st.idx]);
        for (const who of [u]) {
          const carried = who.type === 'medevac' ? (who.carriedWounded || 0) : 0;
          let wnd = who.personnel.wounded + carried;
          for (const h of hs) {
            if (wnd <= 0) break;
            const n = Math.min(wnd, hospitalRoom(h));
            if (n <= 0) continue;
            let fromCarried = Math.min(n, carried), fromUnit = n - fromCarried;
            if (who.type === 'medevac') who.carriedWounded -= fromCarried;
            who.personnel.wounded -= fromUnit; who.personnel.evacuated = (who.personnel.evacuated || 0) + fromUnit;
            h.patients += n; wnd -= n;
            supplied.push(`${who.name}: ${n} поранених відправлено в «${h.name}»`);
          }
        }
      }
      if (supplied.length) Engine.log(state, `Тилове постачання: ${supplied.join('; ')}.`, 'supply', fac);
      if (produced.length) Engine.log(state, `Виробництво: ${produced.join('; ')}.`, 'supply', fac);
      eco.last = { income: income.settlements, expense: expense.production };
    }
    // 6. Медицина: поранені без допомоги, у евакгрупах, у шпиталях
    for (const u of state.units) {
      const p = u.personnel;
      const stab = medevacsNear(state, u).length > 0 || u.type === 'medevac';
      const rate = stab ? MD().stabilizedDeathPerHour : MD().untreatedDeathPerHour;
      const pool = p.wounded + (u.type === 'medevac' ? (u.carriedWounded || 0) : 0);
      if (pool <= 0) continue;
      u.acc.wdie = (u.acc.wdie || 0) + pool * rate;
      let n = Math.min(pool, Math.floor(u.acc.wdie + 1e-9));
      u.acc.wdie -= n;
      if (n > 0) {
        const fromUnit = Math.min(n, p.wounded);
        p.wounded -= fromUnit; p.killed += fromUnit;
        if (u.type === 'medevac') u.carriedWounded -= (n - fromUnit);
        ensureEconomy(state)[u.faction].deadOfWounds += n;
        Loot.cacheAt(state, u.idx, true).dead[u.faction] += n;
        Engine.log(state, `${u.name}: ${n} поранених померли${stab ? ' попри допомогу' : ' без медичної допомоги'}.`, 'warn', u.faction);
      }
    }
    for (const h of facilities(state).filter(x => x.type === 'hospital' && !x.destroyed && x.patients > 0)) {
      const eco = state.economy[h.owner];
      const medNeed = h.patients * MD().medPerPatientHour;
      const hasMed = (h.stock.goods.med || 0) >= medNeed - 1e-9;
      h.stock.goods.med = Math.max(0, r1((h.stock.goods.med || 0) - medNeed));
      h.acc.die += h.patients * (hasMed ? MD().hospitalDeathPerHour : MD().untreatedDeathPerHour);
      h.acc.rec += h.patients * (hasMed ? MD().hospitalRecoverPerHour : 0);
      const die = Math.min(h.patients, Math.floor(h.acc.die + 1e-9)); h.acc.die -= die; h.patients -= die;
      const rec = Math.min(h.patients, Math.floor(h.acc.rec + 1e-9)); h.acc.rec -= rec; h.patients -= rec;
      eco.deadOfWounds += die; eco.recovered += rec; eco.manpower += rec;
      if (die || rec || !hasMed) Engine.log(state, `«${h.name}»: ${rec ? `${rec} одужали й повернулися до резерву` : ''}${rec && die ? ', ' : ''}${die ? `${die} померли` : ''}${!hasMed ? (rec || die ? '; ' : '') + 'немає медзапасів — лікування зупинено' : ''}. Пацієнтів: ${h.patients}/${FT().hospital.beds}.`, 'supply', h.owner);
    }
    // 7. Ремонт техніки
    for (const rb of facilities(state).filter(x => x.type === 'repair_base' && !x.destroyed && x.condition > 0 && x.offline <= 0)) {
      const def = FT().repair_base;
      for (const v of state.units.filter(x => x.vehicle && x.faction === rb.owner && g(state).dist(x.idx, rb.idx) <= 1 && x.vehicle.condition < 100)) {
        const net = rb;
        const add = Math.min(def.repairPerHour, 100 - v.vehicle.condition);
        const st = facilities(state).find(s => isStore(s) && s.owner === rb.owner && (s.stock.goods.parts || 0) > 0) || rb;
        const parts = Math.ceil(add / def.repairPerHour * def.partsPerRepair);
        if ((st.stock.goods.parts || 0) < parts) continue;
        st.stock.goods.parts -= parts;
        v.vehicle.condition += add;
        Engine.log(state, `${v.name}: ремонт на «${rb.name}» +${add}% (стан ${v.vehicle.condition}%).`, 'supply', v.faction);
      }
    }
  }
  function scale(o, k) { const r = {}; for (const [a, n] of Object.entries(o)) { const v = Math.floor(n * k); if (v) r[a] = v; } return r; }

  // ---------------------------------------------------- знання про об’єкти
  function updateKnowledge(state) {
    for (const f of facilities(state)) {
      for (let fac = 0; fac < 3; fac++) {
        const seen = f.hidden ? state.units.some(u => u.faction === fac && u.personnel.fit > 0 && g(state).dist(u.idx, f.idx) <= 1) : Intel.hexObserved(state, fac, f.idx);
        if (f.owner === fac || seen) {
          if (!f.knownBy.includes(fac)) f.knownBy.push(fac);
          f.seen[fac] = { day: state.time.day, hour: state.time.hour, owner: f.owner, destroyed: f.destroyed };
        }
      }
    }
  }
  function known(state, fac) { return facilities(state).filter(f => f.knownBy.includes(fac)); }

  // Поточна зона постачання (для відображення)
  function refreshSupply(state, fac) {
    const net = network(state, fac);
    for (const u of state.units) if (u.faction === fac) u.inSupply = u.embarked == null && net.dist[u.idx] >= 0;
    return net;
  }

  // ---------------------------------------------------- огляд для панелі
  function summary(state, fac) {
    ensureEconomy(state);
    const eco = state.economy[fac];
    const own = facilities(state).filter(f => f.owner === fac && !f.destroyed);
    const total = emptyStock();
    for (const f of own) { addObj(total.ammo, f.stock.ammo); addObj(total.weapons, f.stock.weapons); addObj(total.goods, f.stock.goods); }
    // прогноз на 6 годин
    let income = 0, expense = 0;
    for (const s of state.map.settlements) if (s.control === fac) income += Math.round((EC().income[s.kind] || 0) * Politics.incomeMult(state, s));
    const prod = [];
    for (const f of own) {
      const def = FT()[f.type];
      if (!def.cost) continue;
      const working = f.condition > 0 && state.map.control[f.idx] === fac;
      const after = Math.max(0, f.offline);
      if (working) expense += def.cost;
      prod.push({ f, def, working, offline: after });
    }
    const forecast = [];
    let money = eco.money;
    for (let h = 1; h <= 6; h++) { money += income - expense; forecast.push(money); }
    const man = state.units.filter(u => u.faction === fac);
    const inSupply = man.filter(u => u.inSupply).length;
    const wounded = man.reduce((a, u) => a + u.personnel.wounded + (u.carriedWounded || 0), 0);
    const patients = own.filter(f => f.type === 'hospital').reduce((a, f) => a + f.patients, 0);
    return { eco, own, total, income, expense, forecast, prod, inSupply, units: man.length, wounded, patients };
  }

  return {
    facilities, facilityAt, byId, isStore, makeFacility, placeScenario, ensureEconomy, network, basicLoad, supplyLevel, supplyText,
    resupply, resupplyReason, loadFromStore, loadReason, issueFromCargo, issueReason, unloadToStore, unloadReason,
    destroyFacility, destroyReason, pickupWounded, pickupReason, medevacsNear, hospitalsOf, endOfHour, updateKnowledge, known,
    summary, refreshSupply, sourcesAt, stockKg, cargoKg, cargoCapKg, describeStock, storesNear, emptyStock
  };
})();

// ---- 07e_politics.js
// ============================================================================
// МОДУЛЬ: НАСЕЛЕННЯ, ПОЛІТИКА, ДИПЛОМАТІЯ, ПОДІЇ, ЦІЛІ ПЕРЕМОГИ (етап 4)
// Населення пунктів поділене на етнічні групи; кожна група має власну
// підтримку трьох фракцій. Підтримка впливає на доходи, мобілізацію,
// розвідку (інформатори), саботаж, протести й місцеві ополчення.
// ============================================================================
const Politics = (() => {
  const P = () => CONFIG.population;
  const DP = () => CONFIG.diplomacy;
  const GROUPS = ['yug', 'rus', 'cauc'];
  const clamp = (x, a = 0, b = 100) => Math.max(a, Math.min(b, x));
  const r1 = x => Math.round(x * 10) / 10;
  const fname = f => CONFIG.factions[f].name;

  // ---------------------------------------------------- ініціалізація
  function initSettlement(s, i) {
    const def = P().settlements[i] || { pop: s.kind === 'city' ? 20000 : 1000, mix: { yug: 0.8, rus: 0.15, cauc: 0.05 } };
    s.pop = {}; s.support = {};
    for (const gr of GROUPS) { s.pop[gr] = Math.round(def.pop * (def.mix[gr] || 0)); s.support[gr] = P().baseSupport[gr].slice(); }
    s.pop0 = Object.assign({}, s.pop);
    s.civKilled = 0; s.civWounded = 0; s.refugees = 0;
    s.civBy = [0, 0, 0];
    s.damage = { housing: 0, hospital: 0, water: 0, transport: 0, industry: 0 };
    s.unrest = 'none'; s.admin = s.control; s.combatTurn = 0; s.sabAcc = 0; s.civAcc = 0;
  }

  function init(state) {
    state.map.settlements.forEach((s, i) => { if (!s.pop) initSettlement(s, i); });
    if (!state.diplomacy) {
      state.diplomacy = { rel: {}, proposals: [], reputation: [50, 50, 50], nextId: 1, history: [] };
      for (const k of ['0-1', '0-2', '1-2']) state.diplomacy.rel[k] = { status: 'war', agreements: [] };
    }
    if (!state.stats) state.stats = { inflicted: [0, 0, 0], captured: [0, 0, 0] };
    if (!state.events) state.events = Scenario.events();
    if (!state.campaign) state.campaign = { endDay: CONFIG.campaign.days, over: false, winner: null, reason: '', objectives: Scenario.objectives(), scores: [0, 0, 0], chronicle: null, ctl0: state.map.settlements.map(s => s.control) };
  }

  function totalPop(s) { return GROUPS.reduce((a, g) => a + (s.pop ? s.pop[g] : 0), 0); }
  function support(s, f) {
    if (!s.pop) return 0;
    const tot = totalPop(s) || 1;
    return GROUPS.reduce((a, g) => a + s.pop[g] * s.support[g][f], 0) / tot;
  }
  function groupSupport(state, f, group) {
    let w = 0, t = 0;
    for (const s of state.map.settlements) if (s.pop) { w += s.pop[group] * s.support[group][f]; t += s.pop[group]; }
    return t ? w / t : 0;
  }
  function nationalSupport(state, f) {
    let w = 0, t = 0;
    for (const s of state.map.settlements) if (s.pop) { const p = totalPop(s); w += p * support(s, f); t += p; }
    return t ? w / t : 0;
  }
  function adjustSupport(s, f, delta, group) {
    for (const g of group ? [group] : GROUPS) s.support[g][f] = clamp(r1(s.support[g][f] + delta));
  }

  function incomeMult(state, s) {
    if (!s.pop || s.control < 0) return 1;
    if (s.unrest === 'strike') return 0;
    return P().incomeBase + P().incomePerSupport * support(s, s.control) / 100;
  }
  function manpowerMult(state, s) { return s.pop && s.control >= 0 ? clamp(support(s, s.control) / 50, 0, 2) : 1; }

  // ---------------------------------------- цивільні в зоні бою
  function onCombat(state, idx, shooter, fireSoft, indirect) {
    const m = state.map;
    const sid = m.settlement[idx];
    if (sid == null || sid < 0) return null;
    const s = m.settlements[sid];
    if (!s.pop) return null;
    const key = CONFIG.terrain[m.terrain[idx]].key;
    let k = P().civK[key === 'city' ? 'city' : key === 'industrial' ? 'industrial' : 'village'];
    if (indirect) k *= P().indirectCivMult;
    if (corridorAt(state, sid)) k *= 0.3;   // гуманітарний коридор: частину людей вивели
    s.civAcc = (s.civAcc || 0) + fireSoft * k;
    const n = Math.floor(s.civAcc + 1e-9);
    s.civAcc -= n;
    const killed = Math.round(n * P().civKilledShare), wounded = n - killed;
    s.civKilled += killed; s.civWounded += wounded;
    s.civBy[shooter] += n;
    removePeople(s, killed);
    const dmg = fireSoft * P().damagePerFire * (indirect ? 2 : 1) / (s.kind === 'city' ? 6 : 2);
    s.damage.housing = clamp(r1(s.damage.housing + dmg));
    if (key === 'industrial') s.damage.industry = clamp(r1(s.damage.industry + dmg * 1.5));
    s.damage.water = clamp(r1(s.damage.water + dmg * 0.4));
    s.damage.transport = clamp(r1(s.damage.transport + dmg * 0.3));
    s.combatTurn = state.time.turn;
    let drop = 0;
    if (n > 0) {
      drop = n * P().supportPerCiv / Math.sqrt(Math.max(100, totalPop(s)));
      adjustSupport(s, shooter, -drop);
    }
    return n ? { settlement: s.name, killed, wounded, drop: r1(drop) } : null;
  }
  function removePeople(s, n) {
    const tot = totalPop(s);
    if (tot <= 0 || n <= 0) return;
    for (const g of GROUPS) s.pop[g] = Math.max(0, s.pop[g] - Math.round(n * s.pop[g] / tot));
  }

  function recordCasualties(state, by, n) { if (by != null && by >= 0) state.stats.inflicted[by] += n; }
  function recordCaptured(state, by, n) { if (by != null && by >= 0) state.stats.captured[by] += n; }

  // ---------------------------------------- захоплення пункту
  function onCapture(state, s, from, to) {
    if (!s.pop || to < 0) return;
    const share = P().captureRefugees;
    const n = Math.round(totalPop(s) * share);
    removePeople(s, n); s.refugees += n;
    s.admin = to;
    let loss = 0;
    if (from >= 0) {
      const eco = Logistics.ensureEconomy(state)[from];
      loss = Math.round(Math.max(0, eco.money) * P().captureMoneyLoss * (s.kind === 'city' ? 1 : 0.2));
      eco.money -= loss;
    }
    Engine.log(state, `${s.name}: адміністрацію призначає ${fname(to)}. ${n} мешканців стали біженцями${from >= 0 ? `; ${fname(from)} евакуює установи, втрачено ${loss} грн` : ''}.`, 'event', to, null);
  }

  // ---------------------------------------- кінець години: населення
  function hourPopulation(state) {
    const turn = state.time.turn;
    for (const s of state.map.settlements) {
      if (!s.pop) continue;
      const c = s.control;
      const fighting = s.combatTurn === turn;
      // біженці
      let out = 0;
      if (fighting) out += totalPop(s) * P().refugeesCombat;
      if (s.damage.housing > 50) out += totalPop(s) * P().refugeesDamage;
      out = Math.round(out);
      if (out > 0) { removePeople(s, out); s.refugees += out; }
      // повернення до базових настроїв
      for (const g of GROUPS) for (let f = 0; f < 3; f++) {
        const base = P().baseSupport[g][f];
        s.support[g][f] = clamp(r1(s.support[g][f] + (base - s.support[g][f]) * P().driftToBase));
      }
      if (c >= 0) {
        // порядок або злидні
        const hardship = (s.damage.water + s.damage.housing + s.damage.hospital) / 300;
        if (!fighting && s.unrest === 'none') adjustSupport(s, c, P().orderGain);
        if (hardship > 0.15) adjustSupport(s, c, -P().hardshipSupport * hardship * 3);
        // відновлення
        if (!fighting) for (const k of Object.keys(s.damage)) s.damage[k] = clamp(r1(s.damage[k] - P().repairPerHour));
        // протести, страйки
        const sup = support(s, c);
        const prev = s.unrest;
        s.unrest = sup < P().strikeBelow ? 'strike' : sup < P().protestBelow ? 'protest' : 'none';
        if (s.unrest !== prev && s.unrest !== 'none') Engine.log(state, `${s.name}: ${s.unrest === 'strike' ? 'страйк — доходи й підприємства пункту зупинено' : 'протести проти адміністрації'} (підтримка ${fname(c)} ${Math.round(sup)}%).`, 'event', c, null);
        if (s.unrest === 'none' && prev !== 'none') Engine.log(state, `${s.name}: протести вщухли.`, 'event', c, null);
        // саботаж на користь іншої фракції
        let best = -1, bs = 0;
        for (let f = 0; f < 3; f++) if (f !== c) { const v = support(s, f); if (v > bs) { bs = v; best = f; } }
        if (sup < P().sabotageOwnBelow && bs >= P().sabotageOtherAbove) {
          s.sabAcc += P().sabotagePerHour;
          if (s.sabAcc >= 1) { s.sabAcc -= 1; sabotage(state, s, c, best); }
        } else s.sabAcc = Math.max(0, s.sabAcc - 0.05);
      }
    }
  }

  function sabotage(state, s, victim, helper) {
    const targets = Logistics.facilities(state).filter(f => f.owner === victim && !f.destroyed && state.map.settlement[f.idx] === s.id);
    if (targets.length) {
      const f = targets[(state.time.turn + s.id) % targets.length];
      if (Logistics.isStore(f)) {
        for (const k of Object.keys(f.stock.goods)) f.stock.goods[k] = Math.floor(f.stock.goods[k] * 0.8);
        for (const k of Object.keys(f.stock.ammo)) f.stock.ammo[k] = Math.floor(f.stock.ammo[k] * 0.9);
      } else { f.condition = Math.max(0, f.condition - 20); f.offline = Math.max(f.offline, 2); }
      Engine.log(state, `${s.name}: саботаж на «${f.name}» — місцеві прихильники «${fname(helper)}» завдали шкоди.`, 'warn', victim, [victim, helper]);
    } else {
      s.damage.transport = clamp(s.damage.transport + 10);
      Engine.log(state, `${s.name}: саботаж на транспорті (прихильники «${fname(helper)}»).`, 'warn', victim, [victim, helper]);
    }
  }

  // ---------------------------------------- дії фракції в пункті
  function aidReason(state, f, s) {
    if (!s || !s.pop) return 'Населений пункт не знайдено.';
    const eco = Logistics.ensureEconomy(state)[f];
    if (eco.money < P().aid.money) return `Потрібно ${P().aid.money} грн (є ${Math.round(eco.money)}).`;
    if (s.aidTurn === state.time.turn) return 'Допомогу вже надано цієї години.';
    if (s.control !== f && !corridorAt(state, s.id)) return 'Допомогу можна надати у своєму пункті або через гуманітарний коридор.';
    return null;
  }
  function aid(state, f, sid) {
    const s = state.map.settlements[sid];
    if (Engine.phaseFaction(state) !== f) return { ok: false, reason: 'Лише у фазі своєї фракції.' };
    const why = aidReason(state, f, s);
    if (why) return { ok: false, reason: why };
    Logistics.ensureEconomy(state)[f].money -= P().aid.money;
    adjustSupport(s, f, P().aid.support);
    s.damage.water = clamp(s.damage.water - 5); s.damage.hospital = clamp(s.damage.hospital - 5);
    s.aidTurn = state.time.turn;
    Engine.log(state, `${fname(f)}: гуманітарний конвой у ${s.name} (−${P().aid.money} грн), підтримка +${P().aid.support}.`, 'event', f, null);
    return { ok: true };
  }
  // Національне ополчення з конкретної етнічної групи пункту
  function militiaReason(state, f, s, group) {
    if (!s || !s.pop) return 'Населений пункт не знайдено.';
    if (s.control !== f) return 'Потрібно контролювати пункт.';
    const M = P().militia;
    if (!group) return null;
    if (!GROUPS.includes(group)) return 'Невідома група.';
    if (s.pop[group] < M.minGroupPop) return `У пункті замало людей цієї групи (${s.pop[group]}, потрібно ${M.minGroupPop}).`;
    const sup = s.support[group][f];
    if (sup < M.supportAbove) return `Потрібна підтримка групи ≥${M.supportAbove}% (зараз ${Math.round(sup)}%).`;
    const eco = Logistics.ensureEconomy(state)[f];
    if (eco.money < M.money) return `Потрібно ${M.money} грн.`;
    if (Engine.unitsAt(state, s.center).some(u => u.faction !== f)) return 'У центрі пункту противник.';
    const last = (s.militiaTurns || {})[group];
    if (last && state.time.turn - last < 24) return 'Ополчення з цієї групи в пункті можна збирати раз на добу.';
    return null;
  }
  const GROUP_ADJ = { yug: 'юготарське', rus: 'російське', cauc: 'кавказьке' };
  function raiseMilitia(state, f, sid, group) {
    const s = state.map.settlements[sid];
    if (Engine.phaseFaction(state) !== f) return { ok: false, reason: 'Лише у фазі своєї фракції.' };
    group = group || GROUPS.slice().sort((a, b) => s.support[b][f] - s.support[a][f])[0];
    const why = militiaReason(state, f, s, group);
    if (why) return { ok: false, reason: why };
    const M = P().militia;
    Logistics.ensureEconomy(state)[f].money -= M.money;
    const n = 1 + state.units.concat(state.lost || []).filter(u => u.faction === f && /^Ополч/.test(u.name)).length;
    const u = Scenario.createUnit(state, 'inf_squad', f, s.center, n);
    u.name = `Ополч. №${n} ${['СВ', 'ДП', 'НП'][f]} (${{ yug: 'юг.', rus: 'рос.', cauc: 'кавк.' }[group]})`;
    u.personnel.assigned = M.size; u.personnel.fit = M.size;
    u.weapons = { 'АКМ': M.size - 1, 'РПК': 1 }; u.ammo = { '762s': 200 * M.size };
    u.atdQuota = 0;
    u.morale = 65; u.baseMorale = 65; u.experience = 0; u.xp = 0;
    u.ethnic = group; u.home = sid;
    u.mp = 0; u.movedThisPhase = true;
    state.units.push(u);
    s.pop[group] = Math.max(0, s.pop[group] - M.size);
    // напруга між групами: інші трохи насторожено ставляться до озброєння сусідів
    for (const g of GROUPS) if (g !== group) adjustSupport(s, f, -M.tension, g);
    s.militiaTurns = Object.assign({}, s.militiaTurns || {}, { [group]: state.time.turn });
    Engine.log(state, `${s.name}: сформовано ${GROUP_ADJ[group]} ополчення ${u.name} (${M.size} осіб). Інші групи пункту насторожені (підтримка −${M.tension}).`, 'event', f);
    Intel.update(state);
    return { ok: true, unitId: u.id };
  }
  // Ополчення стійкіше біля дому
  function homeFactor(state, u) {
    if (!u.ethnic || u.home == null) return 1;
    const s = state.map.settlements[u.home];
    const d = Engine.grid(state).dist(u.idx, s.center);
    const M = P().militia;
    return d <= M.homeRadius ? M.homeMoraleMult : d >= M.farRadius ? M.farMoraleMult : 1;
  }

  // ---------------------------------------------------- ДИПЛОМАТІЯ
  const TYPES = {
    ceasefire: { name: 'Перемир’я', desc: 'Заборона атак між сторонами' },
    exchange: { name: 'Обмін полоненими', desc: 'Повернення полонених в резерв сторін' },
    corridor: { name: 'Гуманітарний коридор', desc: 'Без атак у населеному пункті, евакуація цивільних' },
    alliance: { name: 'Союз', desc: 'Без атак, спільна розвідка й постачання, спільні операції' },
    intel: { name: 'Обмін розвідданими', desc: 'Сторони бачать те, що бачить партнер' },
    supply: { name: 'Спільне постачання', desc: 'Поповнення на складах партнера' },
    territory: { name: 'Передача території', desc: 'Населений пункт переходить іншій стороні' },
    political: { name: 'Політична угода', desc: 'Спільна заява: підтримка населення, репутація' }
  };
  function key(a, b) { return a < b ? `${a}-${b}` : `${b}-${a}`; }
  function rel(state, a, b) { return state.diplomacy.rel[key(a, b)]; }
  function active(state, a, b, type) {
    if (a === b) return null;
    const r = rel(state, a, b);
    return r.agreements.find(x => x.type === type && (x.until == null || x.until > state.time.turn)) || null;
  }
  function allied(state, a, b) { return a === b || !!active(state, a, b, 'alliance'); }
  function sharesIntel(state, a, b) { return a !== b && (allied(state, a, b) || !!active(state, a, b, 'intel')); }
  function sharesSupply(state, a, b) { return a !== b && (allied(state, a, b) || !!active(state, a, b, 'supply')); }
  function corridorAt(state, sid) {
    if (!state.diplomacy) return false;
    for (const r of Object.values(state.diplomacy.rel)) if (r.agreements.some(x => x.type === 'corridor' && x.terms.settlement === sid && x.until > state.time.turn)) return true;
    return false;
  }
  function statusText(state, a, b) {
    if (allied(state, a, b)) return 'Союз';
    if (active(state, a, b, 'ceasefire')) return 'Перемир’я';
    return 'Війна';
  }

  // Що порушить атака фракції a по фракції b у гексі idx
  function attackCheck(state, a, b, idx) {
    if (!state.diplomacy || a === b) return [];
    const out = [];
    for (const t of ['alliance', 'ceasefire']) { const x = active(state, a, b, t); if (x) out.push(x); }
    const sid = state.map.settlement[idx];
    if (sid >= 0) {
      const x = active(state, a, b, 'corridor');
      if (x && x.terms.settlement === sid) out.push(x);
    }
    return out;
  }
  function breakAgreements(state, breaker, victim, list) {
    if (!list.length) return;
    const r = rel(state, breaker, victim);
    r.agreements = r.agreements.filter(x => !list.includes(x) && !['ceasefire', 'alliance', 'intel', 'supply'].includes(x.type));
    state.diplomacy.reputation[breaker] = clamp(state.diplomacy.reputation[breaker] - DP().breakReputation);
    for (const s of state.map.settlements) if (s.pop) adjustSupport(s, breaker, -DP().breakSupport);
    const names = list.map(x => TYPES[x.type].name.toLowerCase()).join(', ');
    state.diplomacy.history.push({ day: state.time.day, hour: state.time.hour, text: `${fname(breaker)} порушує угоди з «${fname(victim)}»: ${names}.` });
    Engine.log(state, `ПОРУШЕННЯ УГОД: ${fname(breaker)} атакує «${fname(victim)}» попри ${names}. Репутація −${DP().breakReputation}, підтримка населення −${DP().breakSupport}. Між сторонами знову війна.`, 'event', breaker, null);
  }

  function proposeReason(state, from, to, type, terms) {
    if (from === to) return 'Оберіть іншу фракцію.';
    if (!TYPES[type]) return 'Невідомий тип угоди.';
    if (Engine.phaseFaction(state) !== from) return 'Пропозиції надсилаються у фазі своєї фракції.';
    if (state.diplomacy.proposals.some(p => p.status === 'open' && p.from === from && p.to === to && p.type === type)) return 'Така пропозиція вже очікує відповіді.';
    if (['ceasefire', 'alliance', 'intel', 'supply'].includes(type) && active(state, from, to, type)) return 'Така угода вже діє.';
    if (type === 'alliance' && !active(state, from, to, 'ceasefire')) return 'Союз можливий лише після перемир’я.';
    if (type === 'corridor') { const s = state.map.settlements[terms.settlement]; if (!s) return 'Оберіть населений пункт.'; }
    if (type === 'territory') {
      const s = state.map.settlements[terms.settlement];
      if (!s) return 'Оберіть населений пункт.';
      if (s.control !== terms.giver) return `${s.name} зараз не контролює сторона, що має його передати.`;
      if (terms.giver !== from && terms.giver !== to) return 'Передати можна лише свій або партнерів пункт.';
    }
    if (type === 'exchange') {
      const held = (h, o) => state.prisoners.filter(p => p.holder === h && p.origin === o).reduce((a, p) => a + p.count, 0);
      if (!held(from, to) && !held(to, from)) return 'Немає полонених для обміну.';
    }
    return null;
  }
  function propose(state, from, to, type, terms = {}) {
    const why = proposeReason(state, from, to, type, terms);
    if (why) return { ok: false, reason: why };
    const p = { id: state.diplomacy.nextId++, from, to, type, terms, created: state.time.turn, day: state.time.day, hour: state.time.hour, status: 'open' };
    state.diplomacy.proposals.push(p);
    Engine.log(state, `Дипломатія: ${fname(from)} пропонує «${fname(to)}» — ${describe(state, p)}. Відповідь — у фазі отримувача.`, 'event', from, [from, to]);
    return { ok: true, id: p.id };
  }
  function describe(state, p) {
    const T = TYPES[p.type];
    const s = p.terms.settlement != null ? state.map.settlements[p.terms.settlement] : null;
    switch (p.type) {
      case 'ceasefire': return `${T.name} на ${DP().ceasefireHours} год`;
      case 'corridor': return `${T.name} у ${s ? s.name : '?'} на ${DP().corridorHours} год`;
      case 'intel': return `${T.name} на ${DP().intelHours} год`;
      case 'supply': return `${T.name} на ${DP().supplyHours} год`;
      case 'territory': return `${T.name}: ${s ? s.name : '?'} від «${fname(p.terms.giver)}» до «${fname(p.terms.giver === p.from ? p.to : p.from)}»`;
      default: return T.name;
    }
  }
  function respond(state, id, accept) {
    const p = state.diplomacy.proposals.find(x => x.id === id);
    if (!p || p.status !== 'open') return { ok: false, reason: 'Пропозицію не знайдено.' };
    if (Engine.phaseFaction(state) !== p.to) return { ok: false, reason: 'Відповідь — у фазі фракції-отримувача.' };
    if (!accept) {
      p.status = 'rejected';
      Engine.log(state, `Дипломатія: ${fname(p.to)} відхиляє пропозицію «${fname(p.from)}» (${describe(state, p)}).`, 'event', p.to, [p.from, p.to]);
      return { ok: true };
    }
    const err = proposeCheckOnAccept(state, p);
    if (err) { p.status = 'failed'; return { ok: false, reason: err }; }
    p.status = 'accepted';
    apply(state, p);
    return { ok: true };
  }
  function proposeCheckOnAccept(state, p) {
    if (p.type === 'territory') { const s = state.map.settlements[p.terms.settlement]; if (s.control !== p.terms.giver) return 'Умови змінилися: пункт уже не контролює сторона-передавач.'; }
    if (p.type === 'alliance' && !active(state, p.from, p.to, 'ceasefire')) return 'Перемир’я вже не діє.';
    return null;
  }
  function apply(state, p) {
    const r = rel(state, p.from, p.to);
    const t = state.time.turn;
    const add = (hours, terms) => r.agreements.push({ type: p.type, from: p.from, to: p.to, terms: terms || p.terms, since: t, until: hours == null ? null : t + hours });
    let extra = '';
    switch (p.type) {
      case 'ceasefire': add(DP().ceasefireHours); break;
      case 'corridor': add(DP().corridorHours); { const s = state.map.settlements[p.terms.settlement]; adjustSupport(s, p.from, 3); adjustSupport(s, p.to, 3); } break;
      case 'intel': add(DP().intelHours); break;
      case 'supply': add(DP().supplyHours); break;
      case 'alliance': add(null); break;
      case 'political': add(null); for (const s of state.map.settlements) if (s.pop) { adjustSupport(s, p.from, 3); adjustSupport(s, p.to, 3); }
        state.diplomacy.reputation[p.from] = clamp(state.diplomacy.reputation[p.from] + 5); state.diplomacy.reputation[p.to] = clamp(state.diplomacy.reputation[p.to] + 5); break;
      case 'exchange': {
        let back = [0, 0, 0];
        for (const pr of state.prisoners) {
          if ((pr.holder === p.from && pr.origin === p.to) || (pr.holder === p.to && pr.origin === p.from)) { back[pr.origin] += pr.count; pr.count = 0; }
        }
        state.prisoners = state.prisoners.filter(x => x.count > 0);
        const eco = Logistics.ensureEconomy(state);
        eco[p.from].manpower += back[p.from]; eco[p.to].manpower += back[p.to];
        extra = ` Повернулися: до «${fname(p.from)}» ${back[p.from]}, до «${fname(p.to)}» ${back[p.to]} осіб.`;
        for (const s of state.map.settlements) if (s.pop) { adjustSupport(s, p.from, 1); adjustSupport(s, p.to, 1); }
        break;
      }
      case 'territory': {
        const s = state.map.settlements[p.terms.settlement];
        const recv = p.terms.giver === p.from ? p.to : p.from;
        for (let i = 0; i < state.map.settlement.length; i++) if (state.map.settlement[i] === s.id) state.map.control[i] = recv;
        const prev = s.control;
        s.control = recv;
        onCapture(state, s, -1, recv);
        extra = ` ${s.name} переходить до «${fname(recv)}» (раніше — «${fname(prev)}»).`;
        break;
      }
    }
    state.diplomacy.history.push({ day: state.time.day, hour: state.time.hour, text: `Угода: ${describe(state, p)} між «${fname(p.from)}» і «${fname(p.to)}».${extra}` });
    Engine.log(state, `Дипломатія: УГОДУ УКЛАДЕНО — ${describe(state, p)} між «${fname(p.from)}» і «${fname(p.to)}».${extra}`, 'event', p.to, null);
  }
  function dissolveAlliance(state, f, other) {
    const r = rel(state, f, other);
    const had = r.agreements.some(x => x.type === 'alliance');
    if (!had) return { ok: false, reason: 'Союзу немає.' };
    r.agreements = r.agreements.filter(x => x.type !== 'alliance');
    Engine.log(state, `Дипломатія: ${fname(f)} розриває союз із «${fname(other)}» (без бойових дій — репутація не страждає).`, 'event', f, null);
    return { ok: true };
  }
  function incoming(state, f) { return state.diplomacy ? state.diplomacy.proposals.filter(p => p.status === 'open' && p.to === f) : []; }

  function hourDiplomacy(state) {
    const t = state.time.turn;
    for (const p of state.diplomacy.proposals) if (p.status === 'open' && t - p.created >= DP().proposalTTL) {
      p.status = 'expired';
      Engine.log(state, `Дипломатія: пропозиція «${fname(p.from)}» (${describe(state, p)}) залишилася без відповіді.`, 'event', p.from, [p.from, p.to]);
    }
    for (const r of Object.values(state.diplomacy.rel)) {
      const ended = r.agreements.filter(x => x.until != null && x.until <= t);
      if (ended.length) {
        r.agreements = r.agreements.filter(x => !ended.includes(x));
        for (const x of ended) Engine.log(state, `Дипломатія: завершилася угода «${TYPES[x.type].name}» між «${fname(x.from)}» і «${fname(x.to)}».`, 'event', x.from, null);
      }
    }
    if (state.time.hour === 23) for (let f = 0; f < 3; f++) state.diplomacy.reputation[f] = clamp(state.diplomacy.reputation[f] + DP().keepReputationPerDay);
  }

  // ---------------------------------------------------- УМОВНІ ПОДІЇ
  function evalTrigger(state, ev) {
    const t = ev.trigger;
    const S = state.map.settlements;
    switch (t.type) {
      case 'time': return state.time.day > t.day || (state.time.day === t.day && state.time.hour >= t.hour);
      case 'control': { const s = S[t.settlement]; return t.faction != null ? s.control === t.faction : s.control !== state.campaign.ctl0[t.settlement]; }
      case 'losses': { const k = state.units.concat(state.lost).filter(u => u.faction === t.faction).reduce((a, u) => a + u.personnel.killed, 0); return k >= t.killed; }
      case 'support': { const s = S[t.settlement]; const f = t.faction === 'controller' ? s.control : t.faction; if (f < 0) return false; const v = support(s, f); return t.below != null ? v < t.below : v > t.above; }
      case 'diplomacy': return !!active(state, t.a, t.b, t.agreement);
      case 'money': return Logistics.ensureEconomy(state)[t.faction].money < t.below;
    }
    return false;
  }
  function applyEffect(state, ev, e) {
    const S = state.map.settlements;
    const who = f => f === 'controller' ? S[e.settlement].control : f;
    switch (e.type) {
      case 'support': { const s = S[e.settlement]; const f = who(e.faction); if (f >= 0) adjustSupport(s, f, e.delta, e.group); break; }
      case 'supportAll': for (const s of S) if (s.pop) adjustSupport(s, e.faction, e.delta, e.group); break;
      case 'refugees': { const s = S[e.settlement]; const n = Math.round(totalPop(s) * e.share); removePeople(s, n); s.refugees += n; break; }
      case 'money': { const eco = Logistics.ensureEconomy(state)[who(e.faction)]; if (eco) eco.money += e.delta; break; }
      case 'manpower': { const eco = Logistics.ensureEconomy(state)[e.faction]; eco.manpower += e.delta; break; }
      case 'goods': {
        const f = who(e.faction);
        const dst = Logistics.facilities(state).find(x => x.owner === f && !x.destroyed && (x.type === e.facility || (e.facility === 'store' && Logistics.isStore(x))));
        if (dst) for (const [k, n] of Object.entries(e.goods)) dst.stock.goods[k] = (dst.stock.goods[k] || 0) + n;
        break;
      }
      case 'spawn': {
        const s = S[e.settlement];
        if (s.control !== e.faction) break;
        const u = Scenario.createUnit(state, e.unitType, e.faction, s.center, 90 + state.units.length);
        u.name = e.name || u.name;
        state.units.push(u); Intel.update(state);
        break;
      }
    }
  }
  function hourEvents(state) {
    for (const ev of state.events) {
      if (ev.fired) continue;
      if (!evalTrigger(state, ev)) continue;
      ev.fired = { day: state.time.day, hour: state.time.hour };
      for (const e of ev.effects) applyEffect(state, ev, e);
      Engine.log(state, `ПОДІЯ «${ev.name}»: ${ev.text}`, 'event', null);
    }
  }

  // ---------------------------------------------------- ЦІЛІ ТА ПЕРЕМОГА
  function objectiveScore(state, f, o) {
    const S = state.map.settlements;
    switch (o.type) {
      case 'holdSettlement': return S[o.settlement].control === f ? o.points : 0;
      case 'holdFacility': return Logistics.facilities(state).some(x => x.type === o.facility && x.owner === f && !x.destroyed) ? o.points : 0;
      case 'support': return o.points * Math.min(1, nationalSupport(state, f) / (o.target || 60));
      case 'groupSupport': return o.points * Math.min(1, groupSupport(state, f, o.group) / (o.target || 60));
      case 'enemyLosses': return o.points * Math.min(1, (state.stats.inflicted[f] + state.stats.captured[f]) / (o.target || 60));
      case 'reputation': return o.points * state.diplomacy.reputation[f] / 100;
    }
    return 0;
  }
  function objectiveName(state, o) {
    const S = state.map.settlements;
    switch (o.type) {
      case 'holdSettlement': return `Утримувати ${S[o.settlement].name}`;
      case 'holdFacility': return `Утримувати: ${CONFIG.facilities[o.facility].name}`;
      case 'support': return `Підтримка населення (мета ${o.target || 60}%)`;
      case 'groupSupport': return `Підтримка: ${P().groups[o.group]} (мета ${o.target || 60}%)`;
      case 'enemyLosses': return `Втрати противника (мета ${o.target || 60} осіб)`;
      case 'reputation': return 'Репутація на переговорах';
    }
    return o.type;
  }
  function scores(state) {
    return [0, 1, 2].map(f => {
      const list = state.campaign.objectives[f].map(o => ({ o, name: objectiveName(state, o), got: objectiveScore(state, f, o) }));
      return { total: Math.round(list.reduce((a, x) => a + x.got, 0)), max: list.reduce((a, x) => a + x.o.points, 0), list };
    });
  }

  function checkCampaign(state) {
    const c = state.campaign;
    if (!c || c.over || c.disabled) return;
    const sc = scores(state);
    c.scores = sc.map(x => x.total);
    let winner = null, reason = '';
    // військова: інші фракції без боєздатних підрозділів
    for (let f = 0; f < 3; f++) {
      const others = state.units.filter(u => u.faction !== f && !allied(state, f, u.faction) && u.personnel.fit > 0);
      if (!others.length && state.units.some(u => u.faction === f)) { winner = f; reason = 'Військова перемога: збройні сили суперників знищені або капітулювали.'; }
    }
    // політична: підтримка населення й контроль міста
    for (let f = 0; f < 3 && winner == null; f++) {
      if (nationalSupport(state, f) >= 60 && state.map.settlements[0].control === f) { winner = f; reason = `Політична перемога: підтримка населення ${Math.round(nationalSupport(state, f))}% і контроль над ${state.map.settlements[0].name}.`; }
    }
    // за окулами
    for (let f = 0; f < 3 && winner == null; f++) if (sc[f].total >= 80) { winner = f; reason = `Дострокова перемога за цілями: ${sc[f].total} очок.`; }
    let end = winner != null;
    if (!end && state.time.day > c.endDay) {
      end = true;
      const best = Math.max(...c.scores);
      const top = [0, 1, 2].filter(f => c.scores[f] === best);
      if (top.length === 1) { winner = top[0]; reason = `Кампанію завершено (${c.endDay} доби). Перемога за цілями: ${best} очок.`; }
      else reason = `Кампанію завершено (${c.endDay} доби). Нічия: ${top.map(fname).join(' і ')} — по ${best} очок.`;
    }
    if (end) {
      c.over = true; c.winner = winner; c.reason = reason;
      c.chronicle = chronicle(state, sc);
      Engine.log(state, `КАМПАНІЮ ЗАВЕРШЕНО. ${winner != null ? fname(winner) + ' перемагає. ' : ''}${reason}`, 'event', null);
    }
  }

  function chronicle(state, sc) {
    const all = state.units.concat(state.lost);
    const fac = [0, 1, 2].map(f => {
      const us = all.filter(u => u.faction === f);
      const sum = k => us.reduce((a, u) => a + (u.personnel[k] || 0), 0);
      const eco = Logistics.ensureEconomy(state)[f];
      return {
        name: fname(f), score: sc[f].total, killed: sum('killed'), wounded: sum('wounded') + sum('evacuated'), captured: sum('captured'), missing: sum('missing'),
        deadOfWounds: eco.deadOfWounds, unitsLeft: state.units.filter(u => u.faction === f).length, unitsLost: state.lost.filter(u => u.faction === f).length,
        prisonersHeld: state.prisoners.filter(p => p.holder === f).reduce((a, p) => a + p.count, 0),
        money: Math.round(eco.money), manpower: eco.manpower, support: Math.round(nationalSupport(state, f)), reputation: state.diplomacy.reputation[f],
        facilities: Logistics.facilities(state).filter(x => x.owner === f && !x.destroyed).length
      };
    });
    const towns = state.map.settlements.map(s => ({
      name: s.name, control: s.control, pop: totalPop(s), pop0: GROUPS.reduce((a, g) => a + s.pop0[g], 0), civKilled: s.civKilled, civWounded: s.civWounded,
      refugees: s.refugees, housing: s.damage.housing, support: [0, 1, 2].map(f => Math.round(support(s, f))), unrest: s.unrest
    }));
    return { time: Engine.timeLabel(state.time), factions: fac, towns, history: state.diplomacy.history.slice(), events: state.events.filter(e => e.fired).map(e => ({ name: e.name, when: e.fired })) };
  }

  function endOfHour(state) {
    init(state);
    hourPopulation(state);
    hourDiplomacy(state);
    hourEvents(state);
  }

  return {
    GROUPS, TYPES, init, totalPop, support, groupSupport, nationalSupport, adjustSupport, incomeMult, manpowerMult, onCombat, onCapture,
    recordCasualties, recordCaptured, aid, aidReason, raiseMilitia, militiaReason, homeFactor, GROUP_ADJ, rel, active, allied, sharesIntel, sharesSupply, corridorAt,
    statusText, attackCheck, breakAgreements, propose, proposeReason, respond, describe, dissolveAlliance, incoming,
    endOfHour, checkCampaign, scores, objectiveName, chronicle
  };
})();

// ---- 07f_field.js
// ============================================================================
// МОДУЛЬ: ІНЖЕНЕРНІ РОБОТИ ТА ТЕХНІКА (блок А)
// Понтонні мости, укриття, ремонт об’єктів, підрив мостів, відновлення
// уламків; покинута техніка як трофей; реквізиція цивільних машин;
// військовий автопарк; встановлення кулемета чи АГС на техніку.
// ============================================================================
const Field = (() => {
  const E = () => CONFIG.engineering;
  const g = s => Engine.grid(s);
  const fname = f => CONFIG.factions[f].name;
  const ABBR = ['СВ', 'ДП', 'НП'];

  function projects(state) { if (!state.projects) state.projects = []; return state.projects; }
  function projectOf(state, u) { return u.project ? projects(state).find(p => p.id === u.project) || null : null; }

  // ---------------------------------------------- матеріали з постачання
  // Інженерне майно/запчастини: вантаж машини в гексі або склад мережі (у зоні постачання)
  function findGoods(state, u, key, need) {
    for (const v of state.units) {
      if (v.faction !== u.faction || v.idx !== u.idx || !v.cargo || !v.cargo.goods) continue;
      if ((v.cargo.goods[key] || 0) >= need) return { from: v.name, take: () => { v.cargo.goods[key] -= need; } };
    }
    for (const f of Logistics.storesNear(state, u)) if ((f.stock.goods[key] || 0) >= need) return { from: f.name, take: () => { f.stock.goods[key] -= need; } };
    const net = Logistics.network(state, u.faction);
    if (net.dist[u.idx] >= 0) {
      const st = net.stores.filter(f => (f.stock.goods[key] || 0) >= need).sort((a, b) => g(state).dist(a.idx, u.idx) - g(state).dist(b.idx, u.idx))[0];
      if (st) return { from: st.name, take: () => { st.stock.goods[key] -= need; } };
    }
    return null;
  }

  // ---------------------------------------------------- інженерні роботи
  function canEngineer(state, u) {
    if (!u) return 'Підрозділ не знайдено.';
    if (u.type !== 'eng_squad') return 'Інженерні роботи виконує інженерне відділення.';
    if (u.embarked != null) return 'Спершу висадіть відділення.';
    if (u.personnel.fit < 2) return 'Замало боєздатних інженерів.';
    if (u.project) return 'Відділення вже виконує роботу (її можна скасувати наказом «Скасувати наказ»).';
    return null;
  }

  // Доступні роботи для інженерів у поточній позиції
  function options(state, u) {
    const out = [];
    if (canEngineer(state, u)) return out;
    const grid = g(state), m = state.map;
    for (let d = 0; d < 6; d++) {
      const n = grid.neighbor(u.idx, d); if (n < 0) continue;
      if (m.river[n] && !m.bridge[n]) out.push({ type: 'bridge', target: n, label: `${E().bridge.name} у ${grid.label(n)}` });
      if (m.river[n] && m.bridge[n]) out.push({ type: 'demolish', target: n, label: `${E().demolish.name} у ${grid.label(n)}` });
    }
    if (m.river[u.idx] && m.bridge[u.idx]) out.push({ type: 'demolish', target: u.idx, label: `${E().demolish.name} під собою` });
    if ((m.shelter[u.idx] || 0) < E().shelter.max) out.push({ type: 'shelter', target: u.idx, label: `${E().shelter.name} у ${grid.label(u.idx)} (рівень ${(m.shelter[u.idx] || 0) + 1})` });
    for (const f of Logistics.facilities(state)) {
      if (f.owner !== u.faction || grid.dist(f.idx, u.idx) > 1) continue;
      if (!Logistics.isStore(f) && f.condition < 100 && f.type !== 'motorpool') out.push({ type: 'repair', target: f.id, label: `${E().repair.name}: ${f.name} (${f.condition}%)` });
    }
    const c = Loot.cacheAt(state, u.idx, false);
    if (c && c.vehicles) c.vehicles.forEach((v, i) => { if (v.wreck) out.push({ type: 'restore', target: i, label: `${E().restore.name}: ${CONFIG.unitTypes[v.type].name} (уламки)` }); });
    return out;
  }

  function startProject(state, unitId, type, target) {
    const u = Engine.unitById(state, unitId);
    const err = Engine.checkCommandable(state, u) || canEngineer(state, u);
    if (err) return { ok: false, reason: err };
    const opt = options(state, u).find(o => o.type === type && o.target === target);
    if (!opt) return { ok: false, reason: 'Ця робота тут недоступна.' };
    const def = E()[type];
    const need = def.eng ? { key: 'eng', n: def.eng } : def.parts ? { key: 'parts', n: type === 'repair' ? def.parts : def.parts } : null;
    if (need) {
      const src = findGoods(state, u, need.key, need.n);
      if (!src) return { ok: false, reason: `Потрібно ${need.n} компл. «${CONFIG.goods[need.key].name}»: у вантажі машини в гексі, на складі поруч або в зоні постачання.` };
      src.take();
      opt.source = src.from;
    }
    if (u.order) u.order = null;
    u.stance = 'none'; u.fort = 0;
    const p = { id: (state.nextProjectId = (state.nextProjectId || 0) + 1), type, target, faction: u.faction, unitId: u.id, at: u.idx, progress: 0, hours: def.hours, label: opt.label, started: { day: state.time.day, hour: state.time.hour } };
    projects(state).push(p);
    u.project = p.id;
    Engine.log(state, `${u.name}: розпочато «${opt.label}» (${def.hours} год${opt.source ? `, матеріали: ${opt.source}` : ''}). Відділення має лишатися на місці.`, 'order', u.faction);
    return { ok: true, id: p.id };
  }

  function cancelProject(state, u, why) {
    const p = projectOf(state, u);
    if (!p) return;
    state.projects = projects(state).filter(x => x !== p);
    u.project = null;
    Engine.log(state, `${u.name}: роботу «${p.label}» перервано${why ? ' — ' + why : ''}. Витрачені матеріали не повертаються.`, 'warn', u.faction);
  }

  function finish(state, p, u) {
    const m = state.map, grid = g(state);
    switch (p.type) {
      case 'bridge': m.bridge[p.target] = 1; break;
      case 'demolish': m.bridge[p.target] = 0; m.road[p.target] = m.road[p.target]; break;
      case 'shelter': m.shelter[p.target] = Math.min(E().shelter.max, (m.shelter[p.target] || 0) + 1); break;
      case 'restore': {
        const c = Loot.cacheAt(state, p.at, false);
        const v = c && c.vehicles && c.vehicles[p.target];
        if (v && v.wreck) { v.wreck = false; v.condition = E().restore.condition; v.fuel = 0; }
        break;
      }
    }
    Engine.log(state, `${u ? u.name : 'Інженери'}: «${p.label}» завершено.${p.type === 'restore' ? ' Машину можна забрати — потрібен екіпаж.' : ''}`, 'event', p.faction, p.type === 'bridge' || p.type === 'demolish' ? null : [p.faction]);
  }

  function endOfHour(state) {
    const turn = state.time.turn;
    for (const p of projects(state).slice()) {
      const u = Engine.unitById(state, p.unitId);
      if (!u || u.idx !== p.at || u.personnel.fit < 2) { if (u) cancelProject(state, u, 'відділення залишило місце робіт'); else state.projects = projects(state).filter(x => x !== p); continue; }
      if (u.combatTurn === turn) { Engine.log(state, `${u.name}: роботи призупинено через бій.`, 'warn', u.faction); continue; }
      if (p.type === 'repair') {
        const f = Logistics.byId(state, p.target);
        if (!f || f.owner !== u.faction) { cancelProject(state, u, 'об’єкт втрачено'); continue; }
        if (p.progress > 0) {
          const src = findGoods(state, u, 'parts', E().repair.parts);
          if (!src) { cancelProject(state, u, 'закінчилися запчастини'); continue; }
          src.take();
        }
        p.progress++;
        f.condition = Math.min(100, f.condition + E().repair.amount);
        if (f.condition >= 100) { f.offline = Math.min(f.offline, 0); state.projects = projects(state).filter(x => x !== p); u.project = null; Engine.log(state, `${u.name}: «${f.name}» відремонтовано (100%).`, 'event', u.faction); }
        else Engine.log(state, `${u.name}: ремонт «${f.name}» — стан ${f.condition}%.`, 'info', u.faction);
        continue;
      }
      p.progress++;
      if (p.progress >= p.hours) { state.projects = projects(state).filter(x => x !== p); u.project = null; finish(state, p, u); }
    }
  }

  // ---------------------------------------- покинута техніка й уламки
  const FIXED = m => { const w = CONFIG.weapons[m]; return w && w.holder === false && !w.disposable; };
  // Викликається, коли техніка вибуває (знищена або без екіпажу)
  function leaveVehicle(state, u) {
    const c = Loot.cacheAt(state, u.idx, true);
    if (!c.vehicles) c.vehicles = [];
    const fixed = {};
    for (const [m, n] of Object.entries(u.weapons)) if (FIXED(m) || m === u.mount) { fixed[m] = n; delete u.weapons[m]; }
    const rec = { type: u.type, model: u.vehicle.model, from: u.faction, wreck: !!u.destroyed, condition: u.destroyed ? 0 : u.vehicle.condition, fuel: u.destroyed ? 0 : u.vehicle.fuel, weapons: u.destroyed ? {} : fixed, mount: u.destroyed ? null : u.mount, day: state.time.day, hour: state.time.hour };
    if (!u.destroyed) {
      // боєприпаси до бортової зброї лишаються в машині
      rec.ammo = {};
      for (const m of Object.keys(fixed)) { const cat = CONFIG.weapons[m].ammo; if (u.ammo[cat]) { rec.ammo[cat] = u.ammo[cat]; delete u.ammo[cat]; } }
    }
    c.vehicles.push(rec);
    return rec;
  }

  function takeReason(state, u, rec) {
    if (!u || !rec) return 'Техніку не знайдено.';
    if (rec.wreck) return 'Це уламки: спершу відновіть машину (інженери).';
    if (u.vehicle) return 'Забрати машину може піший підрозділ (з нього сформують екіпаж).';
    if (u.embarked != null) return 'Спершу висадіть підрозділ.';
    const crew = CONFIG.unitTypes[rec.type].vehicle.crew;
    if (u.personnel.fit < crew) return `Потрібен екіпаж: ${crew} ос. (боєздатних ${u.personnel.fit}).`;
    const cost = Engine.mpMax(u) * CONFIG.loot.actionShare;
    if (u.mp < cost - 1e-9) return `Це займає ${CONFIG.loot.actionShare * 100}% години.`;
    return null;
  }
  function takeVehicle(state, unitId, index) {
    const u = Engine.unitById(state, unitId);
    const err = Engine.checkCommandable(state, u);
    if (err) return { ok: false, reason: err };
    const c = Loot.cacheAt(state, u.idx, false);
    const rec = c && c.vehicles ? c.vehicles[index] : null;
    const why = takeReason(state, u, rec);
    if (why) return { ok: false, reason: why };
    const def = CONFIG.unitTypes[rec.type];
    const crew = def.vehicle.crew;
    const v = Scenario.createUnit(state, rec.type, u.faction, u.idx, 1);
    v.name = `${def.short} (трофей) ${ABBR[u.faction]}`;
    v.weapons = {}; v.ammo = {};
    // екіпаж бере частину особистої зброї з підрозділу
    const kit = Loot.give(state, v, pickHolders(u, crew), {});
    for (const [m, n] of Object.entries(rec.weapons || {})) v.weapons[m] = (v.weapons[m] || 0) + n;
    for (const [k, n] of Object.entries(rec.ammo || {})) v.ammo[k] = (v.ammo[k] || 0) + n;
    v.mount = rec.mount || null;
    v.vehicle.condition = rec.condition; v.vehicle.fuel = rec.fuel;
    v.experience = u.experience; v.xp = u.xp; v.morale = u.morale; v.baseMorale = u.baseMorale;
    v.mp = 0; v.movedThisPhase = true;
    u.personnel.fit -= crew; u.personnel.assigned = Math.max(0, u.personnel.assigned - crew);
    u.mp -= Engine.mpMax(u) * CONFIG.loot.actionShare;
    c.vehicles.splice(index, 1);
    state.units.push(v);
    let note = '';
    if (u.personnel.fit <= 0 && u.personnel.assigned <= 0 && u.personnel.wounded <= 0) { state.units = state.units.filter(x => x !== u); note = ` Увесь склад ${u.name} перейшов в екіпаж.`; }
    Engine.log(state, `${u.name}: забрано ${def.vehicle.model} (стан ${rec.condition}%, пальне ${Engine.fmt(rec.fuel)} л). Екіпаж — ${crew} ос.; новий підрозділ ${v.name}.${note}`, 'event', v.faction);
    Intel.update(state);
    return { ok: true, unitId: v.id };
  }
  function pickHolders(u, n) {
    const out = {};
    for (const [m, k] of Object.entries(u.weapons)) {
      if (n <= 0) break;
      if (!Loot.isHolder(m)) continue;
      const t = Math.min(k, n); out[m] = t; n -= t; u.weapons[m] -= t; if (!u.weapons[m]) delete u.weapons[m];
    }
    return out;
  }

  // ---------------------------------------------------- реквізиція
  function requisitionLeft(state, s) {
    const per = CONFIG.requisition.perPeople;
    return Math.max(0, Math.floor(Politics.totalPop(s) / per) - (s.requisitioned || 0));
  }
  function requisitionReason(state, f, s, type) {
    if (!s || !s.pop) return 'Населений пункт не знайдено.';
    if (s.control !== f) return 'Реквізиція можлива лише в підконтрольному пункті.';
    const R = CONFIG.requisition[type];
    if (!R) return 'Невідомий тип машини.';
    if (requisitionLeft(state, s) <= 0) return 'Цивільних машин у пункті більше немає.';
    const eco = Logistics.ensureEconomy(state)[f];
    if (eco.money < R.money) return `Потрібно ${R.money} грн.`;
    const crew = CONFIG.unitTypes[type].vehicle.crew;
    if (eco.manpower < crew) return `Потрібно ${crew} ос. з резерву для екіпажу.`;
    if (Engine.unitsAt(state, s.center).some(u => u.faction !== f)) return 'У центрі пункту противник.';
    return null;
  }
  function requisition(state, f, sid, type) {
    const s = state.map.settlements[sid];
    if (Engine.phaseFaction(state) !== f) return { ok: false, reason: 'Лише у фазі своєї фракції.' };
    const why = requisitionReason(state, f, s, type);
    if (why) return { ok: false, reason: why };
    const R = CONFIG.requisition[type];
    const eco = Logistics.ensureEconomy(state)[f];
    const crew = CONFIG.unitTypes[type].vehicle.crew;
    eco.money -= R.money; eco.manpower -= crew;
    s.requisitioned = (s.requisitioned || 0) + 1;
    Politics.adjustSupport(s, f, -R.support);
    const n = 1 + state.units.concat(state.lost).filter(u => u.faction === f && u.type === type).length;
    const v = Scenario.createUnit(state, type, f, s.center, n);
    v.vehicle.fuel = Math.round(v.vehicle.fuelMax / 2);
    v.experience = 0; v.xp = 0; v.morale = 60; v.baseMorale = 60;
    v.mp = 0; v.movedThisPhase = true;
    const a = Scenario.arsenal[f];
    v.weapons = { [a.carbine]: crew }; v.ammo = Scenario.ammoFor(v.weapons);
    state.units.push(v);
    Engine.log(state, `${s.name}: реквізовано ${CONFIG.unitTypes[type].name.toLowerCase()} (−${R.money} грн, екіпаж ${crew} з резерву). Підтримка мешканців −${R.support}. Залишилось машин: ${requisitionLeft(state, s)}.`, 'event', f);
    Intel.update(state);
    return { ok: true, unitId: v.id };
  }

  // ---------------------------------------------------- автопарк
  function motorpoolReason(state, f, fac, type) {
    if (!fac || fac.type !== 'motorpool' || fac.destroyed) return 'Автопарк не знайдено.';
    if (fac.owner !== f) return 'Це не ваш автопарк.';
    if (!fac.vehicles || !(fac.vehicles[type] > 0)) return 'Таких машин в автопарку немає.';
    const crew = CONFIG.unitTypes[type].vehicle.crew;
    if (Logistics.ensureEconomy(state)[f].manpower < crew) return `Потрібно ${crew} ос. з резерву для екіпажу.`;
    if (Engine.unitsAt(state, fac.idx).some(u => u.faction !== f)) return 'В автопарку противник.';
    return null;
  }
  function issueVehicle(state, f, facId, type) {
    const fac = Logistics.byId(state, facId);
    if (Engine.phaseFaction(state) !== f) return { ok: false, reason: 'Лише у фазі своєї фракції.' };
    const why = motorpoolReason(state, f, fac, type);
    if (why) return { ok: false, reason: why };
    const crew = CONFIG.unitTypes[type].vehicle.crew;
    Logistics.ensureEconomy(state)[f].manpower -= crew;
    fac.vehicles[type]--;
    const n = 1 + state.units.concat(state.lost).filter(u => u.faction === f && u.type === type).length;
    const v = Scenario.createUnit(state, type, f, fac.idx, n);
    v.experience = 0; v.xp = 0; v.mp = 0; v.movedThisPhase = true;
    state.units.push(v);
    Engine.log(state, `«${fac.name}»: видано ${CONFIG.unitTypes[type].name.replace(' (екіпаж)', '')} — ${v.name}, екіпаж ${crew} ос. з резерву. Залишилось: ${fac.vehicles[type]}.`, 'event', f);
    Intel.update(state);
    return { ok: true, unitId: v.id };
  }

  // ---------------------------------------------------- встановлення зброї
  function mountSources(state, v) {
    const out = [];
    for (const f of Logistics.facilities(state)) if (f.idx === v.idx && f.owner === v.faction && !f.destroyed) for (const m of CONFIG.mount.allowed) if ((f.stock.weapons[m] || 0) > 0) out.push({ m, src: f, kind: 'facility' });
    for (const m of CONFIG.mount.allowed) if (v.cargo && (v.cargo.weapons[m] || 0) > 0) out.push({ m, src: v, kind: 'cargo' });
    for (const u of state.units) if (u !== v && u.faction === v.faction && u.idx === v.idx && u.embarked == null) for (const m of CONFIG.mount.allowed) if ((u.weapons[m] || 0) > 0 && !u.vehicle) out.push({ m, src: u, kind: 'unit' });
    return out;
  }
  function mountReason(state, v, m) {
    if (!v || !CONFIG.unitTypes[v.type].mountable) return 'На цю машину не можна встановити зброю (лише пікап або УАЗ).';
    const cost = Engine.mpMax(v) * CONFIG.mount.share;
    if (v.mp < cost - 1e-9) return `Встановлення займає ${CONFIG.mount.share * 100}% години.`;
    if (m && !mountSources(state, v).some(x => x.m === m)) return 'Потрібна зброя на об’єкті в гексі, у вантажі або в підрозділі поруч.';
    return null;
  }
  function mount(state, vehicleId, model) {
    const v = Engine.unitById(state, vehicleId);
    const err = Engine.checkCommandable(state, v) || mountReason(state, v, model);
    if (err) return { ok: false, reason: err };
    const src = mountSources(state, v).find(x => x.m === model);
    const cat = CONFIG.weapons[model].ammo;
    let ammo = 0;
    if (src.kind === 'facility') { src.src.stock.weapons[model]--; ammo = Math.min(CONFIG.weapons[model].basicLoad, src.src.stock.ammo[cat] || 0); src.src.stock.ammo[cat] = (src.src.stock.ammo[cat] || 0) - ammo; }
    else if (src.kind === 'cargo') { v.cargo.weapons[model]--; ammo = Math.min(CONFIG.weapons[model].basicLoad, v.cargo.ammo[cat] || 0); v.cargo.ammo[cat] = (v.cargo.ammo[cat] || 0) - ammo; }
    else { src.src.weapons[model]--; if (!src.src.weapons[model]) delete src.src.weapons[model]; ammo = Math.min(CONFIG.weapons[model].basicLoad, src.src.ammo[cat] || 0); src.src.ammo[cat] -= ammo; }
    const old = v.mount;
    if (old) { const c = Loot.ensureCargo(v); c.weapons[old] = (c.weapons[old] || 0) + 1; }
    Scenario.mountWeapon(v, model, ammo);
    v.mp -= Engine.mpMax(v) * CONFIG.mount.share;
    Engine.log(state, `${v.name}: встановлено ${model} (набоїв ${ammo})${old ? `; ${old} знято у вантаж` : ''}. Тепер це технічка.`, 'order', v.faction);
    return { ok: true };
  }

  // Автопарк для старих збережень і нових кампаній
  function placeMotorpool(state) {
    if (Logistics.facilities(state).some(f => f.type === 'motorpool')) return;
    const dep = Logistics.facilities(state).find(f => f.type === 'depot' && f.owner === 0);
    if (!dep) return;
    const grid = g(state);
    const used = new Set(Logistics.facilities(state).map(f => f.idx));
    const cand = grid.within(dep.idx, 3).filter(i => state.map.settlement[i] === 0 && !used.has(i) && !state.map.river[i]).sort((a, b) => grid.dist(a, dep.idx) - grid.dist(b, dep.idx) || a - b);
    const idx = cand.length ? cand[0] : dep.idx;
    const f = Logistics.makeFacility(state, 'motorpool', idx, 0, 'Військовий автопарк');
    f.vehicles = { veh_uaz: 4 };
  }

  return { projects, projectOf, options, startProject, cancelProject, endOfHour, canEngineer, leaveVehicle, takeVehicle, takeReason, requisition, requisitionReason, requisitionLeft, issueVehicle, motorpoolReason, mount, mountReason, mountSources, placeMotorpool };
})();

// ---- 07g_recruit.js
// ============================================================================
// МОДУЛЬ: НАБІР ПІДРОЗДІЛІВ, ПІДПІЛЛЯ, ЧОРНИЙ РИНОК (блок Б)
// Нові підрозділи формуються на складі: люди з резерву, зброя зі складу,
// гроші на спорядження, кілька годин підготовки. Підпільні майстерні
// працюють у прихильних пунктах. Чорний ринок продає зброю й запаси
// з доставкою на свій склад.
// ============================================================================
const Recruit = (() => {
  const R = () => CONFIG.recruitment;
  const W = () => CONFIG.workshop;
  const BM = () => CONFIG.blackMarket;
  const fname = f => CONFIG.factions[f].name;
  const ABBR = ['СВ', 'ДП', 'НП'];

  function queue(state) { if (!state.formations) state.formations = []; return state.formations; }
  function orders(state) { if (!state.market) state.market = []; return state.market; }

  // Яку зброю потребує тип підрозділу (автомати взаємозамінні)
  function needs(typeId, faction) {
    const w = Scenario.weaponsFor(typeId, faction);
    const out = { rifles: 0, exact: {} };
    for (const [m, n] of Object.entries(w)) {
      if (R().rifles.includes(m)) out.rifles += n;
      else if (m !== 'Одноразовий ПТГ' && m !== 'Пістолет') out.exact[m] = (out.exact[m] || 0) + n;
    }
    return out;
  }

  function plan(state, f, store, typeId) {
    const ut = CONFIG.unitTypes[typeId];
    const nd = needs(typeId, f);
    const st = store.stock.weapons;
    const take = {};
    let rifles = nd.rifles;
    // РПК і снайперську гвинтівку за браком можна замінити автоматом
    for (const m of ['РПК', 'Снайперська гвинтівка']) {
      const n = nd.exact[m] || 0, have = st[m] || 0;
