<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yugotaria: Civil War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
body{margin:0}

/* Макет: штабний планшет — карта в центрі, ліворуч сили фракції, праворуч картка й накази, знизу журнал. */
:root {
  --bg: #e4e2d8;
  --panel: #f1efe6;
  --panel-2: #e9e6da;
  --line: #c6c2b0;
  --fg: #22241f;
  --muted: #66685c;
  --accent: #4b5a36;
  --accent-fg: #f3f1e8;
  --warn: #9a5b12;
  --bad: #9b2f25;
  --mapbg: #cfcbbb;
  --font-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
  --f-soc: #a4433a; --f-dem: #3b5f8f; --f-nat: #a87d22;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171914; --panel: #20231d; --panel-2: #282b24; --line: #3b3f35; --fg: #e2e0d4; --muted: #9b9c8c;
    --accent: #a8b886; --accent-fg: #161812; --warn: #d89a4a; --bad: #e0766a; --mapbg: #2a2d26;
    --f-soc: #c9675d; --f-dem: #6f93c4; --f-nat: #cfa448;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171914; --panel: #20231d; --panel-2: #282b24; --line: #3b3f35; --fg: #e2e0d4; --muted: #9b9c8c;
  --accent: #a8b886; --accent-fg: #161812; --warn: #d89a4a; --bad: #e0766a; --mapbg: #2a2d26;
  --f-soc: #c9675d; --f-dem: #6f93c4; --f-nat: #cfa448;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px; cursor: pointer;
  letter-spacing: 0.02em;
}
button:hover:not(:disabled) { border-color: var(--muted); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.toggle[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
.num, .data { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

#app {
  height: 100%; display: grid;
  grid-template-columns: 270px minmax(0, 1fr) 330px;
  grid-template-rows: auto minmax(0, 1fr) 170px;
  grid-template-areas: "top top top" "left map right" "left log right";
}
#top {
  grid-area: top; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 7px max(12px, env(safe-area-inset-right, 0px)) 7px max(12px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 15px; white-space: nowrap; }
.brand small { font-weight: 500; color: var(--muted); letter-spacing: 0.04em; margin-left: 6px; text-transform: none; }
.clock { font-family: var(--font-data); font-size: 15px; font-weight: 500; white-space: nowrap; }
.phases { display: flex; gap: 2px; flex-wrap: wrap; }
.phase-chip {
  font-size: 12px; padding: 4px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.phase-chip.active { color: #fff; font-weight: 600; border-color: transparent; }
.spacer { flex: 1; }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }

aside, #log { background: var(--panel); min-height: 0; min-width: 0; }
#left { grid-area: left; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#right { grid-area: right; border-left: 1px solid var(--line); overflow-y: auto; }
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; background: var(--mapbg); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#log { grid-area: log; border-top: 1px solid var(--line); display: flex; flex-direction: column; }

.sec { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sec h3 {
  margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600;
}
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 7px 4px; font-size: 12px; border-bottom: 3px solid transparent; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); font-weight: 600; }
#unitlist { overflow-y: auto; flex: 1; min-height: 0; }
.urow {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; width: 100%;
  padding: 6px 12px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; text-align: left;
}
.urow:hover { background: var(--panel-2); }
.urow.sel { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
.urow .ic { height: 20px; border: 1.5px solid; font-size: 10px; display: grid; place-items: center; font-weight: 700; color: #fff; }
.urow .nm { font-weight: 600; font-size: 13px; }
.urow .st { font-size: 12px; color: var(--muted); }
.urow .mp { font-family: var(--font-data); font-size: 12px; color: var(--muted); }

.ctlbar { display: flex; height: 8px; margin: 4px 0 6px; overflow: hidden; border-radius: 1px; }
.ctlbar i { display: block; height: 100%; }
.ctlrow { display: flex; justify-content: space-between; font-size: 12.5px; gap: 6px; white-space: nowrap; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }
.settl { font-size: 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-top: 6px; }

.card-head { display: flex; gap: 10px; align-items: center; }
.card-head .flag { width: 6px; align-self: stretch; }
.card-head h2 { margin: 0; font-size: 18px; line-height: 1.1; text-wrap: balance; }
.card-head .sub { font-size: 12px; color: var(--muted); }
.moralebar { height: 6px; background: var(--panel-2); border: 1px solid var(--line); margin-top: 4px; }
.moralebar > i { display: block; height: 100%; background: var(--accent); }
.list { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.list li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.list li span:last-child { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.orders { display: flex; gap: 6px; flex-wrap: wrap; }
.notice { font-size: 12px; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
.notice.warn { color: var(--warn); }
.notice.bad { color: var(--bad); }
.route { background: var(--panel-2); border: 1px solid var(--line); padding: 10px; margin-top: 8px; }
.route ul { margin: 6px 0; padding-left: 18px; font-size: 12px; line-height: 1.45; }
.chip { font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 2px; white-space: nowrap; }
.chip.warn { color: var(--warn); border-color: currentColor; }
.chip.ok { color: var(--accent); border-color: currentColor; }
.unitsinhex button { display: block; width: 100%; text-align: left; margin-top: 4px; font-size: 13px; }

.loghead { display: flex; align-items: center; gap: 10px; padding: 5px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
.loghead h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
#logbody { overflow-y: auto; flex: 1; min-height: 0; padding: 4px 12px; font-size: 12.5px; }
.le { display: grid; grid-template-columns: 82px 12px 1fr; gap: 6px; padding: 2px 0; line-height: 1.35; }
.le .t { font-family: var(--font-data); color: var(--muted); font-size: 11.5px; }
.le.phase .x, .le.hour .x, .le.day .x { font-weight: 600; }
.le.warn .x { color: var(--warn); }
.le .x { min-width: 0; overflow-wrap: anywhere; }

.mapctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
.mapctl button { background: var(--panel); min-width: 34px; font-size: 13px; padding: 5px 8px; }
#hexinfo {
  position: absolute; left: 10px; bottom: 10px; z-index: 2; background: var(--panel); border: 1px solid var(--line);
  padding: 5px 9px; font-size: 12px; font-family: var(--font-data); max-width: calc(100% - 20px); pointer-events: none;
}
#modehint {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 2; background: var(--fg); color: var(--panel);
  padding: 5px 12px; font-size: 13px; border-radius: 2px; max-width: calc(100% - 120px); text-align: center;
}
#banner {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 3;
}
#banner div {
  background: var(--panel); border: 1px solid var(--line); border-left-width: 8px; padding: 14px 26px; text-align: center;
  font-size: 22px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; animation: bannerOut 1.8s ease forwards;
}
#banner div small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 4px; }
@keyframes bannerOut { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #banner div { animation-duration: 0.01s; animation-delay: 1.4s; } }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
#toast div { background: var(--fg); color: var(--panel); padding: 7px 14px; font-size: 13px; border-radius: 2px; max-width: 90vw; }
#toast div.bad { background: var(--bad); color: #fff; }

.modal-back { position: fixed; inset: 0; background: rgba(10, 12, 8, 0.55); z-index: 30; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); width: min(640px, 100%); max-height: 100%; overflow-y: auto; }
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal header h2 { margin: 0; font-size: 16px; text-transform: uppercase; letter-spacing: 0.08em; }
.modal .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.slot { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel-2); }
.slot .meta { font-size: 12px; color: var(--muted); font-family: var(--font-data); }
.slot .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.modal textarea { width: 100%; min-height: 120px; font-family: var(--font-data); font-size: 11px; background: var(--bg); border: 1px solid var(--line); padding: 6px; }
.modal table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.modal th, .modal td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; }
.modal td.n { text-align: right; font-family: var(--font-data); }
.tablewrap { overflow-x: auto; }
.modal ol, .modal ul { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row input[type="number"] { width: 120px; padding: 5px 8px; background: var(--bg); border: 1px solid var(--line); }
.errlist { color: var(--bad); font-size: 13px; }


#handover {
  grid-row: 2 / -1; grid-column: 1 / -1; z-index: 5; background: var(--bg);
  display: grid; place-items: center; padding: 16px;
  background-image: repeating-linear-gradient(135deg, transparent 0 22px, color-mix(in srgb, var(--line) 35%, transparent) 22px 23px);
}
#handover[hidden] { display: none; }
.ho-card { background: var(--panel); border: 1px solid var(--line); border-top: 8px solid; padding: 26px 30px; max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.ho-card h2 { margin: 0; font-size: 26px; text-transform: uppercase; letter-spacing: 0.06em; text-wrap: balance; }
.ho-card p { margin: 0; color: var(--muted); line-height: 1.45; }
.ho-time { font-family: var(--font-data); font-size: 13px; color: var(--muted); }
.ho-card button { font-size: 15px; padding: 9px 22px; }
.intens { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
.intens button { font-size: 12px; padding: 3px 8px; }
.report { background: var(--panel-2); }
.rep-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rep-head h3 { margin: 0; }
.rep-title { font-weight: 700; margin: 6px 0 4px; font-size: 14px; }
.rep-step h4 { margin: 8px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.rep-step p { margin: 2px 0; font-size: 12.5px; line-height: 1.4; }
.muted { color: var(--muted); font-weight: 400; }
.subsec { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
.subsec h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.pickrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
button.mini { font-size: 12px; padding: 2px 8px; }
.battle h4 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.battle { border-left: 4px solid #2a1a16; }
.bad { color: var(--bad); }
.le.combat .x { font-weight: 600; color: var(--bad); }
.le.combatd .x { color: var(--muted); }

@media (max-width: 900px) {
  body { overflow: auto; }
  #app {
    height: auto; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto 62vh auto auto 220px;
    grid-template-areas: "top" "map" "right" "left" "log";
  }
  #left { border-right: 0; border-top: 1px solid var(--line); max-height: 420px; }
  #right { border-left: 0; overflow: visible; }
  #top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>
</head>
<body>

<div id="app">
  <header id="top">
    <div class="brand">Юготарія <small>етап 3 · транспорт</small></div>
    <div class="clock" id="clock"></div>
    <div class="phases" id="phases"></div>
    <div class="spacer"></div>
    <div class="top-actions">
      <button id="btnEndPhase" class="primary" type="button">Завершити фазу ▸</button>
      <button id="btnSaves" type="button">Збереження</button>
      <button id="btnNew" type="button">Нова гра</button>
      <button id="btnHelp" type="button">Довідка</button>
    </div>
  </header>

  <aside id="left">
    <div class="sec" id="controlSummary"></div>
    <div class="tabs" id="factionTabs" role="tablist"></div>
    <div id="unitlist"></div>
  </aside>

  <main id="mapwrap">
    <canvas id="map" aria-label="Гексова карта"></canvas>
    <div class="mapctl">
      <button type="button" id="zoomIn" title="Наблизити (+)">＋</button>
      <button type="button" id="zoomOut" title="Віддалити (−)">−</button>
      <button type="button" id="btnCenter" title="Центрувати на вибраному">◎</button>
      <button type="button" class="toggle" id="tglControl" aria-pressed="true" title="Контроль територій">Контр.</button>
      <button type="button" class="toggle" id="tglGrid" aria-pressed="true" title="Сітка гексів">Сітка</button>
    </div>
    <div id="modehint" hidden></div>
    <div id="hexinfo"></div>
    <div id="banner"></div>
  </main>

  <aside id="right"></aside>

  <div id="handover" hidden></div>

  <section id="log">
    <div class="loghead">
      <h3>Журнал подій</h3>
      <label><input type="checkbox" id="logOwn"> сховати деталі боїв</label>
    </div>
    <div id="logbody"></div>
  </section>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";
// ---- 01_config.js
// ============================================================================
// МОДУЛЬ: КОНФІГУРАЦІЯ ТА КАТАЛОГИ
// Усі числові параметри, які не визначені специфікацією автора, позначені
// як ЗАГЛУШКА (placeholder: true) і перелічені в CONFIG.unresolved.
// ============================================================================
const CONFIG = {
  gameTitle: 'Yugotaria: Civil War',
  stage: 3,
  saveFormat: 'yugotaria-civil-war-save',
  saveVersion: 4,
  hexMeters: 250,
  map: { width: 80, height: 60 },
  startHour: 6,          // ЗАГЛУШКА: година початку кампанії
  hoursPerDay: 24,

  rules: {
    controlOnEnter: false,         // етап 1: контроль при вході (вимкнено рішенням автора)
    controlByHolding: true,        // рішення автора: гекс переходить, якщо фракція утримала його до кінця години
    settlementControlByCenter: true, // ЗАГЛУШКА: контроль населеного пункту = контроль його центрального гекса
    carryOverMP: false,            // невитрачені очки руху не переносяться на наступну годину
    blockForeignHexes: true,       // до етапу 2 (бій) не можна входити в гекс із чужими підрозділами
    stackLimit: null               // ЗАГЛУШКА: ліміт підрозділів у гексі не визначено (null = без ліміту)
  },

  // Типи місцевості (id = індекс)
  terrain: [
    { key: 'sea',         name: 'Море',                    color: '#9fb6bf' },
    { key: 'plain',       name: 'Рівнина',                 color: '#dcd6b8' },
    { key: 'forest',      name: 'Ліс',                     color: '#9fb08a' },
    { key: 'denseForest', name: 'Густий ліс',              color: '#7d9270' },
    { key: 'mountains',   name: 'Гори',                    color: '#b8a78c' },
    { key: 'swamp',       name: 'Болото',                  color: '#a9b5a0' },
    { key: 'coast',       name: 'Узбережжя',               color: '#e3dcc0' },
    { key: 'village',     name: 'Сільська забудова',       color: '#cbb89a' },
    { key: 'city',        name: 'Місто (щільна забудова)', color: '#b9a99a' },
    { key: 'industrial',  name: 'Промислова зона',         color: '#a9a39c' },
    { key: 'farmland',    name: 'Сільгоспугіддя',          color: '#e2d9a8' }
  ],

  // Витрати руху на 1 гекс (250 м). null = непрохідно.
  // Пішки — значення з п.8 специфікації; позначені * — ЗАГЛУШКИ (не задані автором).
  moveCost: {
    foot: {
      sea: null, plain: 1, forest: 2, denseForest: 3, mountains: 3 /* * */, swamp: 3,
      coast: 1 /* * */, village: 2, city: 3, industrial: 2 /* * */, farmland: 1 /* * */,
      roadDirt: 0.75, roadAsphalt: 0.5
    },
    // Колісна техніка (УАЗ, КамАЗ) — усі значення ЗАГЛУШКИ
    wheeled: {
      sea: null, plain: 1, forest: 4, denseForest: null, mountains: null, swamp: null,
      coast: 1.3, village: 1.5, city: 2, industrial: 1.5, farmland: 1.3,
      roadDirt: 0.6, roadAsphalt: 0.4
    },
    // Гусенична техніка (МТ-ЛБ) — усі значення ЗАГЛУШКИ
    tracked: {
      sea: null, plain: 0.8, forest: 2.5, denseForest: null, mountains: 4, swamp: 2,
      coast: 0.9, village: 1.5, city: 2, industrial: 1.5, farmland: 0.9,
      roadDirt: 0.6, roadAsphalt: 0.5
    }
  },
  moveClassNames: { foot: 'Пішки', wheeled: 'Колісна техніка', tracked: 'Гусенична техніка' },

  // Категорії боєприпасів
  ammo: {
    '545':   { name: '5,45×39 мм' },
    '762s':  { name: '7,62×39 мм' },
    '762r':  { name: '7,62×54R мм' },

// ---- 02_hex_rng.js
// ============================================================================
// МОДУЛЬ: ГЕКСОВА ГЕОМЕТРІЯ ТА ДЕТЕРМІНОВАНИЙ ГЕНЕРАТОР
// Гекси з пласкою верхівкою, зберігання «odd-q» (непарні колонки зміщені вниз).
// ============================================================================
const SQRT3 = Math.sqrt(3);

const Hex = {
  // Осьові напрямки та кути (у градусах, вісь Y вниз) до центру сусіда
  DIRS: [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]],
  DIR_ANGLE: [30, -30, -90, -150, 150, 90],
  opposite(d) { return (d + 3) % 6; },

  toAxial(col, row) { return { q: col, r: row - ((col - (col & 1)) >> 1) }; },
  toOffset(q, r) { return { col: q, row: r + ((q - (q & 1)) >> 1) }; },

  // Центр гекса у світових координатах (розмір гекса = 1)
  center(col, row) { return { x: 1.5 * col, y: SQRT3 * (row + 0.5 * (col & 1)) }; },

  // Світові координати -> гекс (col,row)
  fromPoint(x, y) {
    const qf = (2 / 3) * x;
    const rf = (-1 / 3) * x + (SQRT3 / 3) * y;
    const sf = -qf - rf;
    let q = Math.round(qf), r = Math.round(rf), s = Math.round(sf);
    const dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s - sf);
    if (dq > dr && dq > ds) q = -r - s; else if (dr > ds) r = -q - s;
    return Hex.toOffset(q, r);
  },

  distanceOffset(c1, r1, c2, r2) {
    const a = Hex.toAxial(c1, r1), b = Hex.toAxial(c2, r2);
    return (Math.abs(a.q - b.q) + Math.abs(a.q + a.r - b.q - b.r) + Math.abs(a.r - b.r)) / 2;
  }
};

// Сітка фіксованого розміру з таблицею сусідів
class Grid {
  constructor(w, h) {
    this.w = w; this.h = h; this.size = w * h;
    this.nb = new Int32Array(this.size * 6).fill(-1);
    for (let i = 0; i < this.size; i++) {
      const col = i % w, row = (i / w) | 0;
      const a = Hex.toAxial(col, row);
      for (let d = 0; d < 6; d++) {
        const o = Hex.toOffset(a.q + Hex.DIRS[d][0], a.r + Hex.DIRS[d][1]);
        if (o.col >= 0 && o.col < w && o.row >= 0 && o.row < h) this.nb[i * 6 + d] = o.row * w + o.col;
      }
    }
  }
  idx(col, row) { return (col < 0 || row < 0 || col >= this.w || row >= this.h) ? -1 : row * this.w + col; }
  col(i) { return i % this.w; }
  row(i) { return (i / this.w) | 0; }
  neighbor(i, d) { return this.nb[i * 6 + d]; }
  dirTo(a, b) { for (let d = 0; d < 6; d++) if (this.nb[a * 6 + d] === b) return d; return -1; }
  dist(a, b) { return Hex.distanceOffset(this.col(a), this.row(a), this.col(b), this.row(b)); }
  center(i) { return Hex.center(this.col(i), this.row(i)); }
  // Позначення гекса для гравця: колонка-рядок, з 1
  label(i) { return String(this.col(i) + 1).padStart(2, '0') + '.' + String(this.row(i) + 1).padStart(2, '0'); }
  // Усі гекси в радіусі
  within(i, radius) {
    const out = [];
    const c = this.col(i), r = this.row(i);
    for (let rr = Math.max(0, r - radius - 1); rr <= Math.min(this.h - 1, r + radius + 1); rr++)
      for (let cc = Math.max(0, c - radius); cc <= Math.min(this.w - 1, c + radius); cc++)
        if (Hex.distanceOffset(c, r, cc, rr) <= radius) out.push(rr * this.w + cc);
    return out;
  }
}

// Детермінований генератор випадкових чисел (лише для генерації карти)
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2(seed, x, y) {
  let h = (seed ^ Math.imul(x, 374761393) ^ Math.imul(y, 668265263)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function valueNoise(seed, x, y) {
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const fx = x - x0, fy = y - y0;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash2(seed, x0, y0), b = hash2(seed, x0 + 1, y0);
  const c = hash2(seed, x0, y0 + 1), d = hash2(seed, x0 + 1, y0 + 1);
  return (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
}

function fbm(seed, x, y, octaves) {
  let v = 0, amp = 0.5, f = 1, norm = 0;
  for (let o = 0; o < octaves; o++) {
    v += amp * valueNoise(seed + o * 1013, x * f, y * f);
    norm += amp; amp *= 0.5; f *= 2;
  }
  return v / norm;
}

// Двійкова купа для A*
class MinHeap {
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(key, val) {
    const k = this.k, v = this.v;
    let i = k.length; k.push(key); v.push(val);
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (k[p] <= key) break;
      k[i] = k[p]; v[i] = v[p]; i = p;
    }
    k[i] = key; v[i] = val;
  }
  pop() {
    const k = this.k, v = this.v;
    const top = v[0];
    const lk = k.pop(), lv = v.pop();
    if (k.length > 0) {
      let i = 0; const n = k.length;
      for (;;) {
        let l = 2 * i + 1, r = l + 1, m = i;
        let mk = lk;
        if (l < n && k[l] < mk) { m = l; mk = k[l]; }
        if (r < n && k[r] < mk) { m = r; }
        if (m === i) break;
        k[i] = k[m]; v[i] = v[m]; i = m;
      }
      k[i] = lk; v[i] = lv;
    }
    return top;
  }
}

// ---- 03_mapgen.js
// ============================================================================
// МОДУЛЬ: ДАНІ СВІТУ — ГЕНЕРАЦІЯ ТЕСТОВОЇ КАРТИ
// Детермінована: однаковий seed дає однакову карту.
// Назви — тимчасові позначки, змінюватимуться в редакторі (етап 6).
// ============================================================================
const MapGen = {
  generate(seed, w, h) {
    const grid = new Grid(w, h);
    const N = grid.size;
    const rnd = mulberry32(seed);
    const map = {
      w, h,
      terrain: new Uint8Array(N),
      river: new Uint8Array(N),
      bridge: new Uint8Array(N),
      road: new Uint8Array(N),      // 0 — немає, 1 — ґрунтова, 2 — асфальт
      roadDirs: new Uint8Array(N),  // бітова маска напрямків дороги
      control: new Int8Array(N).fill(-1),
      settlement: new Int16Array(N).fill(-1),
      region: new Uint8Array(N),
      settlements: [],
      regions: [{ id: 0, name: 'Область 1' }]
    };
    const T = TERRAIN_ID;

    // 1. Базовий рельєф
    for (let i = 0; i < N; i++) {
      const c = grid.col(i), r = grid.row(i);
      const nw = Math.max(0, 1 - Math.hypot(c / w, r / h) * 1.6);
      const e = fbm(seed + 11, c / 10, r / 10, 4) * 0.7 + nw * 0.4;
      const f = fbm(seed + 29, c / 9, r / 9, 4);
      let t = T.plain;
      if (e > 0.63) t = T.mountains;
      else if (f > 0.68) t = T.denseForest;
      else if (f > 0.58) t = T.forest;
      map.terrain[i] = t;
    }

    // 2. Море на сході: лінія узбережжя з шумом
    for (let r = 0; r < h; r++) {
      const coastCol = Math.round(w - 12 + (fbm(seed + 41, 0.5, r / 10, 3) - 0.5) * 10 + (r / h) * 3);
      for (let c = coastCol; c < w; c++) {
        const i = grid.idx(c, r);
        map.terrain[i] = T.sea;
      }
    }
    for (let i = 0; i < N; i++) {
      if (map.terrain[i] === T.sea) continue;
      for (let d = 0; d < 6; d++) {
        const n = grid.neighbor(i, d);
        if (n >= 0 && map.terrain[n] === T.sea) { map.terrain[i] = T.coast; break; }
      }
    }

    // 3. Річка: від північного краю до моря, меандри за шумовим полем
    const srcCol = 18 + Math.floor(rnd() * 10);
    const source = grid.idx(srcCol, 0);
    const mouthRow = Math.floor(h * 0.45 + rnd() * h * 0.15);
    let mouth = -1;
    for (let c = 0; c < w; c++) {
      const i = grid.idx(c, mouthRow);
      if (map.terrain[i] === T.coast) { mouth = i; break; }
    }
    const riverPath = MapGen.astar(grid, source, mouth, (a, b) => {
      if (map.terrain[b] === T.sea) return Infinity;
      return 1 + fbm(seed + 53, grid.col(b) / 4, grid.row(b) / 4, 2) * 6;
    });
    riverPath.unshift(source);
    for (const i of riverPath) map.river[i] = 1;

    // 4. Болота біля гирла
    for (const i of grid.within(mouth, 9)) {
      if (map.terrain[i] === T.sea) continue;
      let nearRiver = false;
      for (const j of grid.within(i, 2)) if (map.river[j]) { nearRiver = true; break; }
      if (nearRiver && fbm(seed + 67, grid.col(i) / 3, grid.row(i) / 3, 2) > 0.32 && map.terrain[i] !== T.coast) map.terrain[i] = T.swamp;
    }

    // 5. Місто на річці, ближче до моря, з промзоною біля узбережжя
    const cityRiverIdx = riverPath[Math.floor(riverPath.length * 0.62)];
    const cityCenter = grid.idx(Math.max(4, grid.col(cityRiverIdx) - 2), grid.row(cityRiverIdx));
    const city = { id: 0, name: 'Місто А', kind: 'city', center: cityCenter, control: -1 };
    map.settlements.push(city);
    for (const i of grid.within(cityCenter, 3)) {
      if (map.terrain[i] === T.sea) continue;
      map.terrain[i] = T.city; map.settlement[i] = 0;
    }
    for (const i of grid.within(cityCenter, 6)) {
      if (map.terrain[i] === T.sea || map.settlement[i] >= 0) continue;
      if (grid.dist(i, cityCenter) >= 4 && grid.col(i) > grid.col(cityCenter) + 1) {
        map.terrain[i] = T.industrial; map.settlement[i] = 0;
      }
    }

    // 6. Села
    const villageSpots = [
      ['Село Б', 0.15, 0.20], ['Село В', 0.18, 0.78], ['Село Г', 0.47, 0.12],
      ['Село Д', 0.42, 0.85], ['Село Е', 0.05, 0.50]
    ];
    for (const [name, fx, fy] of villageSpots) {
      let c = Math.round(fx * w + (rnd() - 0.5) * 6), r = Math.round(fy * h + (rnd() - 0.5) * 6);
      c = Math.min(w - 1, Math.max(1, c)); r = Math.min(h - 2, Math.max(1, r));
      let center = grid.idx(c, r);
      // уникаємо річки та моря
      let guard = 0;
      while ((map.river[center] || map.terrain[center] === T.sea || map.settlement[center] >= 0) && guard++ < 40) {
        center = grid.neighbor(center, guard % 6) >= 0 ? grid.neighbor(center, guard % 6) : center;
      }
      const id = map.settlements.length;
      map.settlements.push({ id, name, kind: 'village', center, control: -1 });
      for (const i of grid.within(center, 1)) {
        if (map.terrain[i] === T.sea || map.settlement[i] >= 0) continue;
        map.terrain[i] = T.village; map.settlement[i] = id;
      }
      for (const i of grid.within(center, 5)) {
        if (map.settlement[i] >= 0) continue;
        const t = map.terrain[i];
        if ((t === T.plain || t === T.forest) && grid.dist(i, center) >= 2 &&
            fbm(seed + 79, grid.col(i) / 3, grid.row(i) / 3, 2) > 0.42) map.terrain[i] = T.farmland;
      }
    }

    // 7. Дороги
    const roadCost = (a, b) => {
      const t = map.terrain[b];
      if (t === T.sea) return Infinity;
      let c;
      switch (t) {
        case T.plain: case T.farmland: case T.village: case T.city: case T.industrial: c = 1; break;
        case T.coast: c = 1.5; break;
        case T.forest: c = 3; break;
        case T.denseForest: c = 6; break;
        case T.mountains: c = 9; break;
        case T.swamp: c = 9; break;
        default: c = 2;
      }
      if (map.river[b]) c += 8;
      if (map.road[b]) c *= 0.3;
      return c;
    };
    const lay = (a, b, level) => {
      const path = MapGen.astar(grid, a, b, roadCost);
      const full = [a].concat(path);
      for (let k = 0; k < full.length; k++) {
        const i = full[k];
        map.road[i] = Math.max(map.road[i], level);
        if (map.river[i]) map.bridge[i] = 1;
        if (k + 1 < full.length) {
          const j = full[k + 1];
          const d = grid.dirTo(i, j);
          map.roadDirs[i] |= (1 << d);
          map.roadDirs[j] |= (1 << Hex.opposite(d));
        }
      }
    };
    const S = map.settlements;
    const westEdge = grid.idx(0, grid.row(cityCenter));
    // прибережна дорога вздовж моря
    let northCoast = -1, southCoast = -1;
    for (let r = 2; r < h; r++) { for (let c = 0; c < w; c++) { const i = grid.idx(c, r); if (map.terrain[i] === T.coast && !map.river[i]) { northCoast = i; break; } } if (northCoast >= 0) break; }
    for (let r = h - 3; r >= 0; r--) { for (let c = 0; c < w; c++) { const i = grid.idx(c, r); if (map.terrain[i] === T.coast && !map.river[i]) { southCoast = i; break; } } if (southCoast >= 0) break; }
    // переправа вище за течією: ґрунтова дорога через міст на третині русла
    const ford = riverPath[Math.floor(riverPath.length * 0.3)];
    lay(S[3].center, ford, 1);
    if (northCoast >= 0) lay(ford, northCoast, 1);
    lay(cityCenter, westEdge, 2);                 // траса на захід
    lay(cityCenter, S[3].center, 2);              // асфальт на північ (Село Г)
    lay(cityCenter, S[4].center, 2);              // асфальт на південь (Село Д)
    lay(S[1].center, S[3].center, 1);             // ґрунтові дороги між селами
    lay(S[1].center, S[5].center, 1);
    lay(S[5].center, S[2].center, 1);
    lay(S[2].center, S[4].center, 1);
    lay(S[5].center, westEdge, 1);
    if (northCoast >= 0) lay(cityCenter, northCoast, 1);
    if (southCoast >= 0) lay(cityCenter, southCoast, 1);

    // 8. Початковий контроль: найближчий «центр впливу» фракції (тестовий сценарій)
    const seeds = [cityCenter, S[1].center, S[2].center];
    for (let i = 0; i < N; i++) {
      if (map.terrain[i] === T.sea) continue;
      let best = -1, bd = Infinity;
      for (let f = 0; f < 3; f++) {
        const d = grid.dist(i, seeds[f]) * (f === 0 ? 0.8 : 1);
        if (d < bd) { bd = d; best = f; }
      }
      map.control[i] = best;
    }
    for (const s of map.settlements) s.control = map.control[s.center];
    return map;
  },

  // Універсальний A* по сітці; повертає шлях без початкового гекса
  astar(grid, start, goal, cost) {
    if (start < 0 || goal < 0) return [];
    const N = grid.size;
    const g = new Float64Array(N).fill(Infinity);
    const came = new Int32Array(N).fill(-1);
    const closed = new Uint8Array(N);
    const heap = new MinHeap();
    g[start] = 0; heap.push(grid.dist(start, goal), start);
    while (heap.size) {
      const cur = heap.pop();
      if (closed[cur]) continue;
      if (cur === goal) break;
      closed[cur] = 1;
      for (let d = 0; d < 6; d++) {
        const n = grid.neighbor(cur, d);
        if (n < 0 || closed[n]) continue;
        const c = cost(cur, n);
        if (!isFinite(c)) continue;
        const ng = g[cur] + c;
        if (ng < g[n]) { g[n] = ng; came[n] = cur; heap.push(ng + grid.dist(n, goal) * 0.3, n); }
      }
    }
    if (start !== goal && came[goal] < 0) return [];
    const path = [];
    for (let c = goal; c !== start; c = came[c]) path.push(c);
    return path.reverse();
  }
};

// ---- 04_scenario.js
// ============================================================================
// МОДУЛЬ: СЦЕНАРІЙ — ТЕСТОВИЙ СЦЕНАРІЙ ЕТАПУ 1
// Склад сил, мораль, досвід та арсенали — ЗАГЛУШКИ для перевірки механік.
// ============================================================================
const Scenario = {
  // Основна стрілецька зброя фракцій (ЗАГЛУШКА тестового сценарію)
  arsenal: [
    { rifle: 'АК-74', carbine: 'АКС-74У' },   // Соціалістична влада
    { rifle: 'АКМ',   carbine: 'АКС-74У' },   // Демократичні повстанці
    { rifle: 'АКМ',   carbine: 'АКМ' }        // Націоналістичні повстанці
  ],
  startMorale: [70, 75, 75],   // ЗАГЛУШКА
  startExperience: [1, 0, 0],  // ЗАГЛУШКА: індекси CONFIG.experience

  // Склад сил тестового сценарію
  orbat: [
    ['inf_platoon', 'inf_platoon', 'inf_squad', 'inf_squad', 'mg_team', 'at_team', 'recon', 'mortar', 'medevac', 'veh_mtlb', 'veh_kamaz'],
    ['inf_platoon', 'inf_squad', 'inf_squad', 'inf_squad', 'mg_team', 'at_team', 'recon', 'medevac', 'veh_uaz', 'veh_kamaz'],
    ['inf_platoon', 'inf_squad', 'inf_squad', 'inf_squad', 'mg_team', 'at_team', 'recon', 'mortar', 'veh_uaz']
  ],

  weaponsFor(typeId, faction) {
    const a = Scenario.arsenal[faction];
    const W = {};
    const add = (m, n) => { W[m] = (W[m] || 0) + n; };
    switch (typeId) {
      case 'inf_squad':   add(a.rifle, 4); add('РПК', 1); add('Одноразовий ПТГ', 1); break;
      case 'inf_platoon': add(a.rifle, 15); add('РПК', 2); add('ПКМ', 1); add('РПГ-7', 1); add('Снайперська гвинтівка', 1); break;
      case 'mg_team':     add('ПКМ', 1); add(a.rifle, 2); break;
      case 'at_team':     add('РПГ-7', 1); add(a.rifle, 2); add('Одноразовий ПТГ', 2); break;
      case 'recon':       add(a.rifle, 3); add('Снайперська гвинтівка', 1); break;
      case 'mortar':      add('Міномет 81 мм', 1); add(a.carbine, 4); break;
      case 'medevac':     add(a.carbine, 1); add('Пістолет', 2); break;
      default: {
        const ut = CONFIG.unitTypes[typeId];
        if (ut && ut.vehicle) add(a.carbine, ut.vehicle.crew);
        if (typeId === 'veh_mtlb') add('ПКТ', 1);
      }
    }
    return W;
  },

  ammoFor(weapons) {
    const A = {};
    for (const [m, n] of Object.entries(weapons)) {
      const w = CONFIG.weapons[m];
      if (!w) continue;
      A[w.ammo] = (A[w.ammo] || 0) + w.basicLoad * n;
    }
    return A;
  },

  createUnit(state, typeId, faction, idx, number) {
    const ut = CONFIG.unitTypes[typeId];
    const weapons = Scenario.weaponsFor(typeId, faction);
    const u = {
      id: state.nextUnitId++,
      type: typeId,
      faction,
      name: `${ut.short} №${number} ${['СВ', 'ДП', 'НП'][faction]}`,
      idx,
      personnel: { assigned: ut.personnel, fit: ut.personnel, wounded: 0, killed: 0, captured: 0, missing: 0, straggling: 0 },
      morale: Scenario.startMorale[faction],
      baseMorale: Scenario.startMorale[faction],
      experience: Scenario.startExperience[faction],
      xp: CONFIG.combat.xpForLevel[Scenario.startExperience[faction]],
      weapons,
      ammo: Scenario.ammoFor(weapons),
      supply: 'Повний боєкомплект',
      order: null,
      pendingOrder: null,
      mp: ut.mp,
      movedThisPhase: false,
      comm: { radio: 'Не визначено (етап 2)', connected: true },
      vehicle: ut.vehicle ? { model: ut.vehicle.model, fuel: ut.vehicle.fuelMax, fuelMax: ut.vehicle.fuelMax, condition: 100, passengers: ut.vehicle.passengers } : null,
      lastReport: null
    };
    Scenario.addStage2Fields(u);
    return u;
  },

  // Поля етапу 2 (бій, мораль, розвідка)
  addStage2Fields(u) {
    if (u.baseMorale == null) u.baseMorale = u.morale;
    if (u.xp == null) u.xp = CONFIG.combat.xpForLevel[u.experience] || 0;
    if (u.suppression == null) u.suppression = 0;
    if (u.fort == null) u.fort = 0;              // рівень підготовленої оборони
    if (u.stance == null) u.stance = 'none';     // none | defend | observe
    if (u.dispersal == null) u.dispersal = 0;    // 0 — немає, 1–2 — часткове, 3 — повне
    if (u.acc == null) u.acc = { cas: 0, kill: 0, veh: 0 };
    if (u.firedTurn == null) u.firedTurn = 0;
    if (u.attackedTurn == null) u.attackedTurn = 0;
    if (u.combatTurn == null) u.combatTurn = 0;   // остання година, коли підрозділ був у бою
    if (u.surrounded == null) u.surrounded = false;
    if (u.embarked === undefined) u.embarked = null;   // id машини, в якій їде підрозділ
    if (u.carrying == null) u.carrying = [];           // id пасажирів (для техніки)
    if (u.cargo == null) u.cargo = { weapons: {}, ammo: {} };   // трофеї у вантажі
  },

  // Новий стан гри з тестовим сценарієм
  build(seed) {
    const { width, height } = CONFIG.map;
    const map = MapGen.generate(seed, width, height);
    const state = {
      format: CONFIG.saveFormat,
      version: CONFIG.saveVersion,
      meta: { seed, scenario: 'Тестовий сценарій етапу 1', created: Date.now() },
      time: { day: 1, hour: CONFIG.startHour, turn: 1 },
      phase: 0,
      factions: CONFIG.factions.map(f => ({ id: f.id, name: f.name, human: true })),
      map,
      units: [],
      log: [],
      nextUnitId: 1,
      nextLogId: 1,
      intel: [{}, {}, {}],        // відомі ворожі підрозділи для кожної фракції
      caches: {},                 // місця боїв: загиблі, зброя, набої, уламки
      prisoners: [],              // { holder, origin, count, day, hour }
      lost: [],                   // знищені та полонені підрозділи
      lastCombat: null            // звіт останнього бою (для інтерфейсу)
    };
    const grid = new Grid(width, height);
    // Центри розміщення: місто (СВ), Село Б (ДП), Село В (НП)
    const anchors = [map.settlements[0].center, map.settlements[1].center, map.settlements[2].center];
    const used = new Set();
    Scenario.orbat.forEach((list, faction) => {
      const counters = {};
      // BFS навколо центру: прохідні гекси під контролем фракції
      const order = Scenario.bfsHexes(grid, map, anchors[faction], faction);
      let k = 0;
      for (const typeId of list) {
        counters[typeId] = (counters[typeId] || 0) + 1;
        const cls = CONFIG.unitTypes[typeId].move;
        while (k < order.length && (used.has(order[k]) || CONFIG.moveCost[cls][CONFIG.terrain[map.terrain[order[k]]].key] == null || map.river[order[k]])) k++;
        if (k >= order.length) break;
        const idx = order[k++];
        used.add(idx);
        const u = Scenario.createUnit(state, typeId, faction, idx, counters[typeId]);
        state.units.push(u);
      }
    });
    return state;
  },

  bfsHexes(grid, map, start, faction) {
    const seen = new Uint8Array(grid.size);
    const out = [];
    const q = [start]; seen[start] = 1;
    while (q.length) {
      const i = q.shift();
      if (map.terrain[i] !== TERRAIN_ID.sea && !map.river[i] && map.control[i] === faction) out.push(i);
      for (let d = 0; d < 6; d++) {
        const n = grid.neighbor(i, d);
        if (n >= 0 && !seen[n]) { seen[n] = 1; q.push(n); }
      }
    }
    return out;
  }
};

// ---- 05_engine.js
// ============================================================================
// МОДУЛЬ: ПРАВИЛА СИМУЛЯЦІЇ (без доступу до інтерфейсу)
// Фази, години/доби, маршрути, рух, накази, контроль гексів.
// Бій — модуль Combat, розвідка — модуль Intel.
// Усе детерміновано: однакові дії дають однаковий результат.
// ============================================================================
const Engine = (() => {
  const gridCache = new WeakMap();
  function grid(state) {
    let g = gridCache.get(state.map);
    if (!g) { g = new Grid(state.map.w, state.map.h); gridCache.set(state.map, g); }
    return g;
  }

  const PHASE_NAMES = ['Соціалістична влада', 'Демократичні повстанці', 'Націоналістичні повстанці', 'Завершення години'];
  const ORDER_NAMES = { move: 'Рух', retreat: 'Відступ', defend: 'Оборона', observe: 'Розвідка', attack: 'Атака' };

  function phaseFaction(state) { return state.phase < 3 ? state.phase : null; }
  function unitType(u) { return CONFIG.unitTypes[u.type]; }
  function moveClass(u) { return unitType(u).move; }
  function mpMax(u) { return unitType(u).mp; }
  function unitById(state, id) { return state.units.find(u => u.id === id) || null; }
  function timeLabel(t) { return `День ${t.day}, ${String(t.hour).padStart(2, '0')}:00`; }
  function fname(f) { return CONFIG.factions[f].name; }
  function canAct(u) { return u.personnel.fit > 0 && u.dispersal < 3; }

  // ---------------------------------------------------------------- журнал
  // visibleTo: масив фракцій, яким видно запис; null — усім.
  function log(state, text, kind = 'info', faction = null, visibleTo) {
    const vis = visibleTo !== undefined ? visibleTo : (faction === null ? null : [faction]);
    state.log.push({ id: state.nextLogId++, day: state.time.day, hour: state.time.hour, phase: state.phase, faction, kind, text, vis });
    if (state.log.length > 4000) state.log.splice(0, state.log.length - 4000);
  }

  // ---------------------------------------------------------- присутність
  function occupancy(state) {
    const m = new Map();
    for (const u of state.units) {
      if (!m.has(u.idx)) m.set(u.idx, []);
      m.get(u.idx).push(u);
    }
    return m;
  }
  function unitsAt(state, idx) { return state.units.filter(u => u.idx === idx); }
  function hasForeign(occ, idx, faction) {
    const list = occ.get(idx);
    return !!list && list.some(u => u.faction !== faction);
  }
  function ownCount(occ, idx, faction, exceptId) {
    const list = occ.get(idx);
    return list ? list.filter(u => u.faction === faction && u.id !== exceptId).length : 0;
  }
  // Гекси, де фракція ЗНАЄ про чужі підрозділи (бачить зараз)
  function knownForeignHexes(state, faction) {
    const s = new Set();
    for (const id of Intel.visibleIds(state, faction)) {
      const e = unitById(state, id);
      if (e) s.add(e.idx);
    }
    return s;
  }

  // ------------------------------------------------------------ місцевість
  function terrainKey(state, idx) { return CONFIG.terrain[state.map.terrain[idx]].key; }

  function roadBetween(state, from, dir, to) {
    const m = state.map;
    if (!(m.roadDirs[from] & (1 << dir))) return 0;
    if (!(m.roadDirs[to] & (1 << Hex.opposite(dir)))) return 0;
    return Math.min(m.road[from], m.road[to]);
  }

  // Вартість входу в гекс `to` із сусіднього `from`. Infinity = непрохідно.
  function stepCost(state, cls, from, dir, to) {
    const m = state.map;
    const table = CONFIG.moveCost[cls];
    if (m.river[to] && !m.bridge[to]) return Infinity;   // річка без переправи
    const base = table[terrainKey(state, to)];
    if (base == null) return Infinity;
    const road = roadBetween(state, from, dir, to);
    if (road === 2) return Math.min(base, table.roadAsphalt);
    if (road === 1) return Math.min(base, table.roadDirt);
    return base;
  }

  function hexPassable(state, cls, idx) {
    if (state.map.river[idx] && !state.map.bridge[idx]) return false;
    return CONFIG.moveCost[cls][terrainKey(state, idx)] != null;
  }

  // ----------------------------------------------------------------- маршрут
  // A* за вартістю руху. Блокують лише чужі підрозділи, ВІДОМІ фракції.
  // opts.avoidEnemy — відступ: штраф за гекси поруч із відомим ворогом.
  function findPath(state, unit, from, target, opts = {}) {
    const g = grid(state);
    const cls = moveClass(unit);
    const maxStep = mpMax(unit);
    const occ = occupancy(state);
    const limit = CONFIG.rules.stackLimit;
    const table = CONFIG.moveCost[cls];
    const blocked = opts.realOccupancy ? null : knownForeignHexes(state, unit.faction);
    const isBlocked = n => opts.realOccupancy ? hasForeign(occ, n, unit.faction) : blocked.has(n);
    let danger = null;
    if (opts.avoidEnemy) {
      danger = new Set();
      for (const h of knownForeignHexes(state, unit.faction)) for (let d = 0; d < 6; d++) { const n = g.neighbor(h, d); if (n >= 0) danger.add(n); }
    }
    let minCost = Infinity;
    for (const v of Object.values(table)) if (v != null && v < minCost) minCost = v;

    const N = g.size;
    const gs = new Float64Array(N).fill(Infinity);
    const came = new Int32Array(N).fill(-1);
    const closed = new Uint8Array(N);
    const heap = new MinHeap();
    gs[from] = 0; heap.push(0, from);
    while (heap.size) {
      const cur = heap.pop();
      if (closed[cur]) continue;
      if (cur === target) break;
      closed[cur] = 1;
      for (let d = 0; d < 6; d++) {
        const n = g.neighbor(cur, d);
        if (n < 0 || closed[n]) continue;
        if (CONFIG.rules.blockForeignHexes && isBlocked(n)) continue;
        if (limit != null && n === target && ownCount(occ, n, unit.faction, unit.id) >= limit) continue;
        const c = stepCost(state, cls, cur, d, n);
        if (!isFinite(c) || c > maxStep) continue;
        const pen = danger && danger.has(n) ? 6 : 0;
        const ng = gs[cur] + c + pen;
        if (ng < gs[n] - 1e-9) {
          gs[n] = ng; came[n] = cur;
          heap.push(ng + g.dist(n, target) * minCost + n * 1e-9, n);
        }
      }
    }
    if (from === target || came[target] < 0) return null;
    const path = [];
    for (let c = target; c !== from; c = came[c]) path.push(c);
    path.reverse();
    const costs = [];
    let prev = from, total = 0;
    for (const i of path) { const c = stepCost(state, cls, prev, g.dirTo(prev, i), i); costs.push(c); total += c; prev = i; }
    return { path, costs, total };
  }

  function splitByHours(costs, firstMp, fullMp) {
    const hourOf = [];
    let hour = 0, mp = firstMp;
    for (const c of costs) {
      if (c > mp + 1e-9) { hour++; mp = fullMp; }
      mp -= c;
      hourOf.push(hour);
    }
    return hourOf;
  }

  function checkCommandable(state, u) {
    if (!u) return 'Підрозділ не знайдено.';
    const pf = phaseFaction(state);
    if (pf === null || u.faction !== pf) return 'Накази можна віддавати лише у фазі своєї фракції.';
    if (!canAct(u)) return 'Підрозділ розсіяний і не виконує наказів, доки не повернуться бійці.';
    return null;
  }

  // ---------------------------------------------------- попередній перегляд
  function previewMove(state, unitId, target, kind = 'move') {
    const u = unitById(state, unitId);
    const err = checkCommandable(state, u);
    if (err) return { ok: false, reason: err };
    if (u.embarked != null) return { ok: false, reason: 'Підрозділ їде в машині. Віддайте наказ машині або спершу висадіть його.' };
    const g = grid(state);
    if (target < 0 || target >= g.size) return { ok: false, reason: 'Гекс поза картою.' };
    if (target === u.idx) return { ok: false, reason: 'Підрозділ уже перебуває в цьому гексі.' };
    const cls = moveClass(u);
    if (!hexPassable(state, cls, target)) {
      return { ok: false, reason: `Кінцевий гекс непрохідний для класу «${CONFIG.moveClassNames[cls]}».` };
    }
    if (knownForeignHexes(state, u.faction).has(target)) {
      return { ok: false, reason: 'У кінцевому гексі ворожий підрозділ. Використайте наказ «Атака».' };
    }
    const res = findPath(state, u, u.idx, target, { avoidEnemy: kind === 'retreat' });
    if (!res) return { ok: false, reason: 'Маршрут неможливий: шлях перекрито річкою без мостів, непрохідною місцевістю або відомими ворожими підрозділами.' };

    const pending = u.movedThisPhase || u.attackedTurn === state.time.turn;
    const firstMp = pending ? mpMax(u) : u.mp;
    const hourOf = splitByHours(res.costs, firstMp, mpMax(u));
    const hours = hourOf.length ? hourOf[hourOf.length - 1] + 1 : 0;
    const startHourOffset = pending ? 1 : 0;

    // Ризики — лише за відомими фракції даними
    const risks = [];
    const foreignCtl = res.path.filter(i => state.map.control[i] >= 0 && state.map.control[i] !== u.faction);
    if (foreignCtl.length) {
      const byF = {};
      for (const i of foreignCtl) byF[state.map.control[i]] = (byF[state.map.control[i]] || 0) + 1;
      for (const [f, n] of Object.entries(byF)) risks.push(`Маршрут проходить ${n} гекс(ів) під контролем: ${fname(f)}.`);
    }
    const known = Intel.knownList(state, u.faction);
    const near = new Set(), stale = new Set();
    for (const i of res.path) {
      for (const k of known) {
        if (g.dist(i, k.idx) <= 1) (k.visible ? near : stale).add(k.id);
      }
    }
    if (near.size) risks.push(`Маршрут проходить поруч із ${near.size} виявленим(и) ворожим(и) підрозділом(ами) — можливий бій.`);
    if (stale.size) risks.push(`Поблизу маршруту є ${stale.size} застаріла(і) позначка(и) противника.`);
    const unseen = res.path.filter(i => !Intel.hexObserved(state, u.faction, i)).length;
    if (unseen > res.path.length * 0.5) risks.push(`Понад половина маршруту (${unseen} гекс.) поза спостереженням — можлива зустріч із невиявленим противником.`);
    const bridges = res.path.filter(i => state.map.bridge[i]).length;
    if (bridges) risks.push(`Маршрут проходить через міст(и): ${bridges}. Мости — вузькі місця.`);
    const slow = res.path.filter(i => ['swamp', 'denseForest', 'mountains'].includes(terrainKey(state, i))).length;
    if (slow) risks.push(`Важка місцевість на маршруті: ${slow} гекс(ів).`);
    if (u.fort > 0) risks.push(`Підрозділ залишить обладнані позиції (рівень оборони ${u.fort}).`);
    let fuel = null;
    if (u.vehicle) {
      const need = Math.round(res.total * Transport.fuelPerMp(u) * 10) / 10;
      fuel = { need, have: u.vehicle.fuel };
      if (need > u.vehicle.fuel + 1e-9) risks.push(`Пального не вистачить: потрібно ≈${fmt(need)} л, є ${fmt(u.vehicle.fuel)} л. Машина зупиниться на маршруті.`);
      const pass = Transport.passengers(state, u);
      if (pass.length && (near.size || stale.size)) risks.push(`У машині ${Transport.load(state, u)} осіб: якщо машину знищать, усі вони стануть загиблими або пораненими${Combat.armorOf(u) === 'armored' ? '' : ', а небронована машина вразлива навіть для стрілецької зброї'}.`);
    }
    if (!risks.length) risks.push('Суттєвих ризиків за наявними даними не виявлено.');

    return {
      ok: true, kind, unitId, target, path: res.path, costs: res.costs, total: res.total, fuel,
      hourOf, hours, pending, startHourOffset, risks,
      firstMp, arrive: addHours(state.time, hours - 1 + startHourOffset)
    };
  }

  function addHours(t, n) {
    let h = t.hour + n, d = t.day;
    while (h >= CONFIG.hoursPerDay) { h -= CONFIG.hoursPerDay; d++; }
    return { day: d, hour: h };
  }

  // ------------------------------------------------------------------ накази
  function issueMoveOrder(state, unitId, target, kind = 'move') {
    const p = previewMove(state, unitId, target, kind);
    if (!p.ok) return p;
    const u = unitById(state, unitId);
    const order = {
      type: kind, target, path: p.path.slice(), status: 'active',
      issued: { day: state.time.day, hour: state.time.hour }
    };
    const g = grid(state);
    const nm = ORDER_NAMES[kind];
    if (p.pending) {
      u.pendingOrder = order;
      log(state, `${u.name}: новий наказ «${nm} → ${g.label(target)}» прийнято. Поточна дія цієї години вже виконана, новий наказ почне виконуватися з наступної години.`, 'order', u.faction);
      snapshot(state, u);
      return { ok: true, pending: true, preview: p };
    }
    u.order = order;
    u.pendingOrder = null;
    leavePosition(state, u);
    log(state, `${u.name}: наказ «${nm} → ${g.label(target)}» (маршрут ${p.path.length} гекс., ${fmt(p.total)} ОР, ≈${p.hours} год).`, 'order', u.faction);
    const r = executeMove(state, u);
    return { ok: true, pending: false, preview: p, result: r };
  }

  function leavePosition(state, u) {
    if (u.fort > 0) log(state, `${u.name}: залишає обладнані позиції (рівень ${u.fort}).`, 'order', u.faction);
    u.fort = 0;
    u.stance = 'none';
  }

  // Оборона / розвідка — стани на місці
  function setStance(state, unitId, stance) {
    const u = unitById(state, unitId);
    const err = checkCommandable(state, u);
    if (err) return { ok: false, reason: err };
    if (u.embarked != null) return { ok: false, reason: 'Підрозділ їде в машині. Спершу висадіть його.' };
    if (u.stance === stance && !u.order) return { ok: false, reason: 'Підрозділ уже виконує цей наказ.' };
    const nm = ORDER_NAMES[stance];
    if (u.order && u.movedThisPhase) {
      u.pendingOrder = { type: stance, issued: { day: state.time.day, hour: state.time.hour } };
      log(state, `${u.name}: наказ «${nm}» прийнято. Підрозділ завершує рух цієї години, наказ почне діяти з наступної.`, 'order', u.faction);
      return { ok: true, pending: true };
    }
    if (u.order) { u.order = null; log(state, `${u.name}: рух припинено.`, 'order', u.faction); }
    if (u.stance !== stance && stance !== 'defend') u.fort = 0;
    if (stance !== 'defend' && u.fort) u.fort = 0;
    u.stance = stance;
    u.pendingOrder = null;
    const g = grid(state);
    if (stance === 'defend') log(state, `${u.name}: наказ «Оборона» у ${g.label(u.idx)}. Кожна повна година на місці додає рівень обладнаних позицій (макс. ${CONFIG.combat.fortMax}).`, 'order', u.faction);
    else log(state, `${u.name}: наказ «Розвідка» — спостереження з ${g.label(u.idx)}, дальність +${CONFIG.detection.observeBonus}, маскування +${CONFIG.detection.stanceConcealment}.`, 'order', u.faction);
    Intel.update(state);
    snapshot(state, u);
    return { ok: true, pending: false };
  }

  function cancelOrder(state, unitId) {
    const u = unitById(state, unitId);
    if (!u) return { ok: false, reason: 'Підрозділ не знайдено.' };
    const pf = phaseFaction(state);
    if (pf === null || u.faction !== pf) return { ok: false, reason: 'Накази можна змінювати лише у фазі своєї фракції.' };
    if (!u.order && !u.pendingOrder && u.stance === 'none') return { ok: false, reason: 'Активних наказів немає.' };
    const hadPending = !!u.pendingOrder;
    u.pendingOrder = null;
    if (u.order) {
      u.order = null;
      log(state, `${u.name}: наказ скасовано${u.movedThisPhase ? ' — рух цієї години вже завершено, підрозділ зупиняється в гексі ' + grid(state).label(u.idx) : ''}.`, 'order', u.faction);
    } else if (u.stance !== 'none') {
      log(state, `${u.name}: наказ «${ORDER_NAMES[u.stance]}» скасовано.${u.fort ? ' Обладнані позиції збережено, доки підрозділ не зрушить.' : ''}`, 'order', u.faction);
      u.stance = 'none';
    } else if (hadPending) {
      log(state, `${u.name}: відкладений наказ скасовано.`, 'order', u.faction);
    }
    snapshot(state, u);
    return { ok: true };
  }

  // ------------------------------------------------------------- виконання
  function executeMove(state, u) {
    const g = grid(state);
    const o = u.order;
    if (!o || (o.type !== 'move' && o.type !== 'retreat') || (o.status !== 'active' && o.status !== 'blocked' && o.status !== 'contact')) return { moved: 0 };
    if (!canAct(u)) return { moved: 0 };
    const cls = moveClass(u);
    let moved = 0, spent = 0;
    const startIdx = u.idx;
    let reason = '';
    let retried = false;
    const seenBefore = new Set(Intel.visibleIds(state, u.faction));
    let contact = [];
    while (o.path.length) {
      const next = o.path[0];
      const occ = occupancy(state);
      const dir = g.dirTo(u.idx, next);
      const foreignThere = hasForeign(occ, next, u.faction);
      let blocked = dir < 0 || foreignThere;
      let cost = blocked ? Infinity : stepCost(state, cls, u.idx, dir, next);
      if (!isFinite(cost)) blocked = true;
      if (blocked) {
        if (foreignThere) { Intel.update(state); }
        if (!retried) {
          retried = true;
          const re = findPath(state, u, u.idx, o.target, { avoidEnemy: o.type === 'retreat' });
          if (re && re.path[0] !== next) { o.path = re.path; log(state, `${u.name}: маршрут перекрито, прокладено обхід (${re.path.length} гекс.).`, 'move', u.faction); continue; }
        }
        o.status = 'blocked';
        reason = foreignThere ? 'попереду противник, обхідного шляху немає — підрозділ чекає' : 'маршрут перекрито, обхідного шляху немає — підрозділ чекає';
        break;
      }
      if (cost > u.mp + 1e-9) { reason = 'вичерпано очки руху цієї години'; break; }
      if (u.vehicle && !Transport.burnFuel(state, u, cost)) { o.status = 'blocked'; reason = `закінчилося пальне (залишок ${fmt(u.vehicle.fuel)} л) — машина зупинилася`; break; }
      u.mp -= cost; spent += cost;
      u.idx = next;
      if (u.carrying && u.carrying.length) Transport.syncPassengers(state, u);
      o.path.shift();
      o.status = 'active';
      moved++;
      u.movedThisPhase = true;
      u.movedTurn = state.time.turn;
      if (u.fort) u.fort = 0;
      if (CONFIG.rules.controlOnEnter && state.map.control[next] !== u.faction) state.map.control[next] = u.faction;
      // Розвідка після кожного кроку: новий контакт зупиняє рух
      const fresh = Intel.stepUpdate(state, u, seenBefore);
      if (fresh.length && o.path.length) {
        contact = fresh;
        o.status = 'contact';
        reason = `виявлено противника (${fresh.length}) — рух зупинено, підрозділ чекає рішення командира`;
        break;
      }
    }
    if (moved > 0) u.movedThisPhase = true;
    if (u.carrying && u.carrying.length) Transport.syncPassengers(state, u);
    Intel.update(state);
    const from = g.label(startIdx), to = g.label(u.idx);
    const nm = ORDER_NAMES[o.type];
    if (!o.path.length) {
      log(state, `${u.name}: прибув у ${to} (${nm.toLowerCase()}, пройдено ${moved} гекс., витрачено ${fmt(spent)} ОР${u.vehicle ? `, пальне ${fmt(u.vehicle.fuel)} л` : ''}${u.carrying && u.carrying.length ? `, пасажирів ${Transport.load(state, u)}` : ''}). Наказ виконано, підрозділ чекає наступного.`, 'move', u.faction);
      u.order = null;
    } else if (moved > 0) {
      log(state, `${u.name}: ${from} → ${to}, пройдено ${moved} гекс., витрачено ${fmt(spent)} ОР; ${reason}. Залишок маршруту: ${o.path.length} гекс.`, contact.length ? 'warn' : 'move', u.faction);
    } else {
      log(state, `${u.name}: рух неможливий — ${reason || 'немає очок руху'}.`, o.status === 'blocked' ? 'warn' : 'move', u.faction);
    }
    snapshot(state, u);
    return { moved, spent, reason, contact };
  }

  // Останній доклад командуванню (зв’язок поки завжди є)
  function snapshot(state, u) {
    if (!u.comm.connected) return;
    u.lastReport = {
      day: state.time.day, hour: state.time.hour, idx: u.idx,
      fit: u.personnel.fit, morale: u.morale,
      order: u.order ? `${u.order.type}:${u.order.target}` : null
    };
  }

  // -------------------------------------------------------------------- фази
  function startFactionPhase(state) {
    const f = phaseFaction(state);
    if (f === null) return;
    log(state, `Фаза: ${fname(f)}.`, 'phase', f, null);
    for (const u of state.units) {
      if (u.faction !== f) continue;
      u.mp = mpMax(u);
      u.movedThisPhase = false;
      if (u.pendingOrder) {
        const po = u.pendingOrder; u.pendingOrder = null;
        if (po.type === 'defend' || po.type === 'observe') {
          u.order = null; u.stance = po.type;
          log(state, `${u.name}: розпочато виконання відкладеного наказу «${ORDER_NAMES[po.type]}».`, 'order', f);
        } else {
          u.order = po; leavePosition(state, u);
          log(state, `${u.name}: розпочато виконання відкладеного наказу «${ORDER_NAMES[po.type]}».`, 'order', f);
        }
      }
    }
    for (const u of state.units) if (u.faction === f && u.carrying && u.carrying.length) Transport.syncPassengers(state, u);
    Intel.update(state);
    for (const u of state.units) {
      if (u.faction === f && u.order && (u.order.type === 'move' || u.order.type === 'retreat')) executeMove(state, u);
    }
    Intel.update(state);
  }

  function endPhase(state) {
    const f = phaseFaction(state);
    if (f === null) return { ok: false, reason: 'Невідома фаза.' };
    log(state, `Фазу «${fname(f)}» завершено.`, 'phase', f, null);
    state.phase++;
    let hourEnded = false;
    if (state.phase === 3) {
      endOfHour(state);
      hourEnded = true;
      state.phase = 0;
    }
    startFactionPhase(state);
    return { ok: true, hourEnded };
  }

  function isNight(hour) {
    const n = CONFIG.detection.night;
    return n.from > n.to ? (hour >= n.from || hour <= n.to) : (hour >= n.from && hour <= n.to);
  }

  function endOfHour(state) {
    const prev = timeLabel(state.time);
    const g = grid(state);
    const C = CONFIG.combat;
    const turn = state.time.turn;
    const occ = occupancy(state);

    // 1. Контроль: гекс утримано до кінця години лише однією фракцією
    if (CONFIG.rules.controlByHolding) {
      const changed = [0, 0, 0];
      for (const [idx, list] of occ) {
        const fs = new Set(list.filter(u => u.personnel.fit > 0).map(u => u.faction));
        if (fs.size !== 1) continue;
        const f = [...fs][0];
        if (state.map.control[idx] !== f) { state.map.control[idx] = f; changed[f]++; }
      }
      changed.forEach((n, f) => { if (n) log(state, `${fname(f)}: утримано й взято під контроль ${n} гекс.`, 'event', f); });
    }
    if (CONFIG.rules.settlementControlByCenter) {
      for (const s of state.map.settlements) {
        const c = state.map.control[s.center];
        if (c !== s.control) {
          const was = s.control >= 0 ? fname(s.control) : 'нікого';
          s.control = c;
          log(state, `${s.name}: контроль перейшов від «${was}» до «${c >= 0 ? fname(c) : 'нікого'}» (центральний гекс).`, 'event', c, null);
        }
      }
    }

    // 2. Стан підрозділів: укріплення, придушення, мораль, відсталі
    for (const u of state.units.slice()) {
      const enemyAdj = adjacentEnemies(state, u, occ).length > 0;
      const inCombat = u.combatTurn === turn;
      // обладнання позицій
      if (u.stance === 'defend' && u.movedTurn !== turn && u.fort < C.fortMax && canAct(u)) {
        u.fort++;
        log(state, `${u.name}: обладнано позиції, рівень оборони ${u.fort}.`, 'info', u.faction);
      }
      // придушення спадає
      if (u.suppression > 0) u.suppression = Math.max(0, u.suppression - C.suppressionDecayPerHour);
      // мораль відновлюється без бою та контакту
      if (!inCombat && !enemyAdj && u.morale < u.baseMorale) {
        const add = Math.min(C.moraleRecoverPerHour + (u.stance === 'defend' ? 1 : 0), u.baseMorale - u.morale);
        u.morale += add;
      }
      // відсталі бійці
      const p = u.personnel;
      if (p.straggling > 0) {
        if (enemyAdj) {
          const lost = Math.ceil(p.straggling * C.stragglerLostShare);
          p.straggling -= lost; p.missing += lost;
          log(state, `${u.name}: ${lost} відсталих бійців зникли безвісти — поруч противник.`, 'warn', u.faction);
        } else {
          const back = Math.max(1, Math.ceil(p.straggling * C.stragglerReturnShare));
          const n = Math.min(back, p.straggling);
          p.straggling -= n; p.fit += n;
          log(state, `${u.name}: повернулися ${n} відсталих бійців (відновлено зв’язок із підрозділом).`, 'info', u.faction);
          if (p.straggling === 0 && u.dispersal > 0) { u.dispersal = 0; log(state, `${u.name}: підрозділ знову зібраний.`, 'info', u.faction); }
          else if (u.dispersal === 3 && p.fit > 0) u.dispersal = 2;
        }
      }
      u.surrounded = false;
      snapshot(state, u);
    }
    Combat.cleanup(state);

    // Виробництво, лікування, переміщення запасів, умовні події — етапи 3–4
    state.time.hour++;
    state.time.turn++;
    if (state.time.hour >= CONFIG.hoursPerDay) {
      state.time.hour = 0;
      state.time.day++;
      log(state, `Розпочалася доба ${state.time.day}.`, 'day', null);
    }
    Intel.update(state);
    log(state, `Завершення години (${prev}). Настала ${timeLabel(state.time)}${isNight(state.time.hour) ? ' — ніч, видимість знижена' : ''}.`, 'hour', null);
  }

  function adjacentEnemies(state, u, occ) {
    const g = grid(state);
    const out = [];
    occ = occ || occupancy(state);
    for (let d = 0; d < 6; d++) {
      const n = g.neighbor(u.idx, d); if (n < 0) continue;
      const list = occ.get(n);
      if (list) for (const e of list) if (e.faction !== u.faction && e.personnel.fit > 0) out.push(e);
    }
    return out;
  }

  // Пропозиція для наказу «Відступ»: найкращий тиловий гекс у межах години руху
  function suggestRetreat(state, unitId) {
    const u = unitById(state, unitId);
    if (!u || u.embarked != null) return null;
    const g = grid(state);
    let threat = -1, best = Infinity;
    for (const m of Intel.knownList(state, u.faction)) { const d = g.dist(u.idx, m.idx); if (d < best) { best = d; threat = m.idx; } }
    const r = Combat.findRetreatHex(state, u, threat, 1);
    return r.idx >= 0 ? r.idx : null;
  }

  function newGame(seed) {
    const state = Scenario.build(seed);
    log(state, `Кампанію розпочато: ${state.meta.scenario}, карта ${state.map.w}×${state.map.h} гексів (seed ${seed}).`, 'event', null);
    Intel.update(state);
    startFactionPhase(state);
    return state;
  }

  function controlStats(state) {
    const s = [0, 0, 0, 0];
    for (let i = 0; i < state.map.control.length; i++) {
      const c = state.map.control[i];
      if (state.map.terrain[i] === TERRAIN_ID.sea) continue;
      if (c >= 0) s[c]++; else s[3]++;
    }
    return s;
  }

  function fmt(x) { return (Math.round(x * 100) / 100).toString().replace('.', ','); }

  return {
    PHASE_NAMES, ORDER_NAMES, grid, phaseFaction, unitType, moveClass, mpMax, unitById, timeLabel, fname, canAct, log,
    occupancy, unitsAt, terrainKey, roadBetween, stepCost, hexPassable, adjacentEnemies, knownForeignHexes,
    findPath, previewMove, issueMoveOrder, suggestRetreat, setStance, cancelOrder, executeMove, startFactionPhase, checkCommandable,
    endPhase, endOfHour, newGame, controlStats, addHours, fmt, isNight, snapshot, leavePosition
  };
})();

// ---- 06_intel.js
// ============================================================================
// МОДУЛЬ: РОЗВІДКА ТА ТУМАН ВІЙНИ
// Кожна фракція має власну картину: видимі зараз ворожі підрозділи та
// застарілі позначки з часом отримання й рівнем упевненості.
// Розвіддані поширюються на всю фракцію (зв’язок поки є завжди).
// ============================================================================
const Intel = (() => {
  const D = () => CONFIG.detection;
  const visCache = new WeakMap();   // state -> [Set, Set, Set] видимих зараз

  function ensure(state) {
    if (!state.intel) state.intel = [{}, {}, {}];
    return state.intel;
  }

  function isVehicle(u) { return !!CONFIG.unitTypes[u.type].vehicle; }

  // Дальність спостереження підрозділу (у гексах)
  function observeRange(state, u) {
    const det = D();
    let r = u.type === 'recon' ? det.baseRange.recon : isVehicle(u) ? det.baseRange.vehicle : det.baseRange.foot;
    if (u.stance === 'observe') r += det.observeBonus;
    if (Engine.terrainKey(state, u.idx) === 'mountains') r += det.mountainObserverBonus;
    if (Engine.isNight(state.time.hour)) r -= det.night.penalty;
    if (u.personnel.fit <= 0 || u.dispersal >= 3) r = 1;
    return Math.max(1, r);
  }

  // Маскування цілі
  function concealment(state, t) {
    const det = D();
    let c = det.concealment[Engine.terrainKey(state, t.idx)] || 0;
    if (isVehicle(t)) c += det.vehicleConcealment;
    if (t.stance === 'observe' || (t.stance === 'defend' && t.fort > 0)) c += det.stanceConcealment;
    if (t.firedTurn === state.time.turn) c += det.firedConcealment;
    return Math.max(0, c);
  }

  // Гекси на лінії між двома гексами (без кінцевих точок)
  function lineHexes(state, a, b) {
    const g = Engine.grid(state);
    const A = Hex.toAxial(g.col(a), g.row(a)), B = Hex.toAxial(g.col(b), g.row(b));
    const n = g.dist(a, b);
    const out = [];
    for (let k = 1; k < n; k++) {
      const t = k / n;
      // невеликий зсув, щоб уникнути неоднозначності на межі гексів
      const q = A.q + (B.q - A.q) * t + 1e-6, r = A.r + (B.r - A.r) * t + 2e-6;
      const s = -q - r;
      let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
      const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
      if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs;
      const o = Hex.toOffset(rq, rr);
      const i = g.idx(o.col, o.row);
      if (i >= 0) out.push(i);
    }
    return out;
  }

  function lineOfSight(state, from, to, observerInMountains) {
    const blocks = D().blocksLOS;
    for (const i of lineHexes(state, from, to)) {
      const k = Engine.terrainKey(state, i);
      if (!blocks.includes(k)) continue;
      if (observerInMountains && k !== 'mountains') continue;
      return { ok: false, blocker: i };
    }
    return { ok: true };
  }

  // Чи бачить спостерігач ціль
  function canSee(state, obs, target) {
    const g = Engine.grid(state);
    const dist = g.dist(obs.idx, target.idx);
    if (dist === 0) return true;
    if (dist === 1) return true;   // близький контакт — виявлення автоматичне
    const range = observeRange(state, obs) - concealment(state, target);
    if (dist > range) return false;
    return lineOfSight(state, obs.idx, target.idx, Engine.terrainKey(state, obs.idx) === 'mountains').ok;
  }

  // Чи спостерігає фракція гекс (для зняття застарілих позначок)
  function hexObserved(state, faction, idx) {
    const g = Engine.grid(state);
    const conc = D().concealment[Engine.terrainKey(state, idx)] || 0;
    for (const u of state.units) {
      if (u.faction !== faction || u.personnel.fit <= 0) continue;
      const d = g.dist(u.idx, idx);
      if (d <= 1) return true;
      if (d > observeRange(state, u) - conc) continue;
      if (lineOfSight(state, u.idx, idx, Engine.terrainKey(state, u.idx) === 'mountains').ok) return true;
    }
    return false;
  }

  function describe(state, faction, e, observers) {
    const g = Engine.grid(state);
    const det = D();
    let minD = Infinity, recon = false;
    for (const o of observers) { const d = g.dist(o.idx, e.idx); if (d < minD) minD = d; if (o.type === 'recon') recon = true; }
    const identified = minD <= det.identifyRange || (recon && minD <= det.identifyRange + 1);
    const strength = minD <= det.strengthRange;
    const ut = CONFIG.unitTypes[e.type];
    return {
      id: e.id, faction: e.faction, idx: e.idx,
      day: state.time.day, hour: state.time.hour, turn: state.time.turn,
      cls: isVehicle(e) ? 'vehicle' : 'foot',
      type: identified ? e.type : null,
      label: identified ? ut.name : (isVehicle(e) ? 'Невідома техніка' : 'Невідомий піхотний підрозділ'),
      fit: strength ? e.personnel.fit : null,
      approx: strength ? null : (identified ? approxSize(ut.personnel) : null),
      dist: minD
    };
  }
  function approxSize(n) { return n >= 15 ? 'взвод (~20)' : n >= 5 ? 'відділення (~5)' : 'група (2–4)'; }

  // Повне оновлення картини для всіх трьох фракцій
  function update(state) {
    const intel = ensure(state);
    const sets = [new Set(), new Set(), new Set()];
    const live = state.units.filter(u => (u.personnel.fit > 0 || u.personnel.straggling > 0) && u.embarked == null);  // пасажирів не видно ззовні
    for (let f = 0; f < 3; f++) {
      const observers = state.units.filter(u => u.faction === f && u.personnel.fit > 0);
      for (const e of live) {
        if (e.faction === f) continue;
        const seenBy = observers.filter(o => canSee(state, o, e));
        if (!seenBy.length) continue;
        sets[f].add(e.id);
        const prev = intel[f][e.id];
        const info = describe(state, f, e, seenBy);
        // вже ідентифікований тип не «забувається»
        if (prev && prev.type && !info.type) { info.type = prev.type; info.label = prev.label; }
        intel[f][e.id] = info;
      }
      // Зняття позначок: ціль знищена або гекс оглянуто, а підрозділу там немає
      for (const id of Object.keys(intel[f])) {
        const m = intel[f][id];
        if (sets[f].has(Number(id))) continue;
        const real = state.units.find(u => u.id === Number(id));
        if (!real || real.faction === f) { delete intel[f][id]; continue; }
        if (hexObserved(state, f, m.idx) && real.idx !== m.idx) delete intel[f][id];
      }
    }
    visCache.set(state, sets);
    if (typeof Loot !== 'undefined') Loot.updateKnowledge(state);
    return sets;
  }

  // Після кроку руху: нові вороги, яких побачив саме цей підрозділ
  function stepUpdate(state, mover, seenBefore) {
    const fresh = [];
    for (const e of state.units) {
      if (e.faction === mover.faction || e.personnel.fit <= 0 || e.embarked != null) continue;
      if (seenBefore.has(e.id)) continue;
      if (canSee(state, mover, e)) { fresh.push(e); seenBefore.add(e.id); }
    }
    // інші фракції помічають рухомий підрозділ на кожному кроці
    const intel = ensure(state);
    for (let f = 0; f < 3; f++) {
      if (f === mover.faction || mover.embarked != null) continue;
      const seenBy = state.units.filter(o => o.faction === f && o.personnel.fit > 0 && canSee(state, o, mover));
      if (seenBy.length) {
        const prev = intel[f][mover.id];
        const info = describe(state, f, mover, seenBy);
        if (prev && prev.type && !info.type) { info.type = prev.type; info.label = prev.label; }
        intel[f][mover.id] = info;
      }
    }
    if (fresh.length) update(state);
    return fresh;
  }

  function visibleIds(state, faction) {
    let sets = visCache.get(state);
    if (!sets) sets = update(state);
    return sets[faction];
  }
  function isVisible(state, faction, unitId) { return visibleIds(state, faction).has(unitId); }

  function confidence(state, m) {
    const age = state.time.turn - m.turn;
    return Math.max(10, 100 - age * D().confidenceLossPerHour);
  }

  // Список відомого противника для фракції
  function knownList(state, faction) {
    const intel = ensure(state)[faction];
    const vis = visibleIds(state, faction);
    return Object.values(intel).map(m => Object.assign({}, m, {
      visible: vis.has(m.id), age: state.time.turn - m.turn, confidence: vis.has(m.id) ? 100 : confidence(state, m)
    })).sort((a, b) => a.age - b.age || a.id - b.id);
  }

  function markerAt(state, faction, idx) { return knownList(state, faction).filter(m => m.idx === idx); }

  return { ensure, update, stepUpdate, canSee, hexObserved, observeRange, concealment, lineOfSight, lineHexes, visibleIds, isVisible, knownList, markerAt, confidence };
})();

// ---- 07_combat.js
// ============================================================================
// МОДУЛЬ: БІЙ, МОРАЛЬ, ВТРАТИ
// Детермінований розрахунок без прихованої випадковості: дробові втрати
// накопичуються в лічильниках підрозділу й переходять у цілі числа.
// Кожен бій формує звіт за 6 кроками специфікації (п.11).
// ============================================================================
const Combat = (() => {
  const C = () => CONFIG.combat;
  const g = s => Engine.grid(s);

  function armorOf(u) { const v = CONFIG.unitTypes[u.type].vehicle; return v ? v.armor : 'soft'; }
  function isVehicle(u) { return armorOf(u) !== 'soft'; }
  function fitRatio(u) { const a = u.personnel.assigned; return a ? Math.max(0, u.personnel.fit) / a : 0; }
  function round1(x) { return Math.round(x * 10) / 10; }
  const F = x => Engine.fmt(round1(x));

  function weaponsInRange(u, distHex, indirect) {
    const out = [];
    for (const [m, n] of Object.entries(u.weapons)) {
      const w = CONFIG.weapons[m];
      if (!w || n <= 0) continue;
      if (!!w.indirect !== !!indirect) continue;
      if (distHex * CONFIG.hexMeters > w.range) continue;
      out.push({ model: m, n, w });
    }
    return out;
  }
  function maxRange(u, indirect) {
    let r = 0;
    for (const [m, n] of Object.entries(u.weapons)) {
      const w = CONFIG.weapons[m];
      if (w && n > 0 && !!w.indirect === !!indirect) r = Math.max(r, w.range);
    }
    return r;
  }
  function hasIndirect(u) { return maxRange(u, true) > 0; }

  function terrainCover(state, idx) { return C().cover[Engine.terrainKey(state, idx)] || 0; }
  function coverOf(state, u, opts = {}) {
    let c = terrainCover(state, u.idx);
    if (opts.indirect) c *= C().indirectCoverFactor;
    if (isVehicle(u)) c *= 0.5;
    if (opts.advancing) c *= 0.5;
    const fort = opts.advancing ? 0 : u.fort;
    return Math.min(0.85, c + fort * C().fortCoverPerLevel * (opts.indirect ? C().indirectFortFactor : 1));
  }

  // Розрахунок вогню одного підрозділу
  function computeFire(state, shooter, distHex, intensityKey, opts = {}) {
    const cfg = C();
    const int = cfg.intensity[intensityKey] || cfg.intensity.normal;
    const disp = shooter.dispersal ? (1 - 0.25 * shooter.dispersal) : 1;
    const crewRatio = Math.min(1, fitRatio(shooter)) * disp;                         // групова зброя
    const h = Loot.holders(shooter);
    const holderRatio = (h > 0 ? Math.min(1, shooter.personnel.fit / h) : 0) * disp; // особиста зброя
    const list = weaponsInRange(shooter, distHex, opts.indirect);
    const need = {};
    for (const x of list) {
      const nEff = x.n * (Loot.isHolder(x.model) ? holderRatio : crewRatio);
      x.nEff = nEff;
      x.need = nEff * x.w.ammoPerHour * int.ammo;
      need[x.w.ammo] = (need[x.w.ammo] || 0) + x.need;
    }
    const use = {}, catRatio = {};
    for (const [cat, n] of Object.entries(need)) {
      const have = shooter.ammo[cat] || 0;
      const want = Math.ceil(n - 1e-9);
      use[cat] = Math.min(have, want);
      catRatio[cat] = want > 0 ? use[cat] / want : 0;
    }
