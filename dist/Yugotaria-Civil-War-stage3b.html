    const mult = int.effect * cfg.experienceFire[shooter.experience] * (0.5 + shooter.morale / 200) * (1 - shooter.suppression / 200) * (opts.mult || 1);
    let soft = 0, at = 0, sup = 0;
    const used = [];
    for (const x of list) {
      const rf = 1 - cfg.rangeFalloff * Math.min(1, distHex * CONFIG.hexMeters / x.w.range);
      const k = catRatio[x.w.ammo];
      const s = x.nEff * x.w.fp * x.w.accuracy / 100 * rf * k;
      const a = x.nEff * x.w.at * x.w.accuracy / 100 * rf * k;
      soft += s; at += a; sup += (s + a * 0.3) * (x.w.supp || 1);
      used.push({ model: x.model, n: x.n, eff: s * mult, at: a * mult, ammo: x.w.ammo, noAmmo: k === 0 });
    }
    return { soft: soft * mult, at: at * mult, sup: sup * mult, use, used, mult, intensity: int.name };
  }

  function spendAmmo(u, use) {
    for (const [cat, n] of Object.entries(use)) u.ammo[cat] = Math.max(0, (u.ammo[cat] || 0) - n);
  }
  function ammoText(use) {
    const parts = Object.entries(use).filter(([, n]) => n > 0).map(([c, n]) => `${CONFIG.ammo[c].name}: ${n}`);
    return parts.length ? parts.join(', ') : 'нічого';
  }

  // Застосування вогню до цілі. Повертає опис наслідків.
  function applyDamage(state, t, fire, cover) {
    const cfg = C();
    const armor = armorOf(t);
    const p = t.personnel;
    let casRaw = fire.soft * cfg.casualtyK * (1 - cover) * cfg.exposure[armor];
    let condDmg = 0;
    if (armor !== 'soft') {
      condDmg = fire.at * cfg.vehicleDamageAT * (1 - cover) + fire.soft * cfg.vehicleDamageSmall[armor];
      casRaw += (condDmg / 100) * p.assigned * 0.5;   // ураження екіпажу при пробитті
    }
    const fitBefore = p.fit;
    const { cas: n, killed: k, wounded: w } = inflict(state, t, casRaw);
    const supp = (fire.sup != null ? fire.sup : fire.soft + fire.at * 0.3) * cfg.suppressionK * (1 - cover * 0.5);
    t.suppression = Math.min(100, t.suppression + supp);
    let destroyed = false, cond = 0;
    if (t.vehicle && condDmg > 0) {
      t.acc.veh += condDmg;
      cond = Math.floor(t.acc.veh + 1e-9);
      t.acc.veh -= cond;
      t.vehicle.condition = Math.max(0, t.vehicle.condition - cond);
      if (t.vehicle.condition <= 0) destroyed = true;
    }
    return { cas: n, killed: k, wounded: w, supp: round1(supp), suppRaw: supp, casRaw, perPerson: casRaw / Math.max(1, p.assigned), fitBefore, cond, destroyed };
  }

  // Дробові втрати накопичуються, цілі — застосовуються
  function inflict(state, t, casRaw) {
    const cfg = C();
    const p = t.personnel;
    t.acc.cas += casRaw;
    let n = Math.floor(t.acc.cas + 1e-9);
    t.acc.cas -= n;
    n = Math.min(n, p.fit);
    // округлення з перенесенням залишку: у середньому частка загиблих = killedShare
    t.acc.kill += n * cfg.killedShare;
    let k = n > 0 ? Math.max(0, Math.min(n, Math.round(t.acc.kill - 1e-9))) : 0;
    t.acc.kill -= k;
    const w = n - k;
    const fitBefore = p.fit;
    p.fit -= n; p.killed += k; p.wounded += w;
    if (k > 0) Loot.onKilled(state, t, k, fitBefore);
    return { cas: n, killed: k, wounded: w };
  }

  // Удар по підрозділу з урахуванням пасажирів і знищення машини
  function hitUnit(state, t, fire, cover, extra) {
    const r = applyDamage(state, t, fire, cover);
    if (t.carrying && t.carrying.length) {
      if (r.destroyed) Transport.wreck(state, t, extra);
      else Transport.hitPassengers(state, t, r.perPerson, r.suppRaw, extra);
    } else if (r.destroyed) {
      Transport.wreck(state, t, extra);
    }
    return r;
  }

  // Вогонь «сторони»: машина разом із пасажирами або пасажир із машини
  function groupFire(state, lead, distHex, intensityKey, opts = {}) {
    const tr = CONFIG.transport;
    const members = [{ u: lead, mult: lead.embarked != null ? tr.passengerFireMult : 1 }];
    if (lead.carrying && lead.carrying.length) for (const p of Transport.passengers(state, lead)) members.push({ u: p, mult: tr.passengerFireMult });
    const out = { soft: 0, at: 0, sup: 0, use: {}, uses: [], used: [], intensity: null };
    for (const m of members) {
      if (m.u.personnel.fit <= 0) continue;
      const f = computeFire(state, m.u, distHex, intensityKey, Object.assign({}, opts, { mult: (opts.mult || 1) * m.mult }));
      out.soft += f.soft; out.at += f.at; out.sup += f.sup; out.intensity = f.intensity;
      out.uses.push({ u: m.u, use: f.use });
      for (const [c, n] of Object.entries(f.use)) out.use[c] = (out.use[c] || 0) + n;
      for (const x of f.used) out.used.push(Object.assign({}, x, { model: m.u === lead ? x.model : `${x.model} [${m.u.name}${m.mult < 1 ? ', з машини' : ''}]` }));
    }
    if (!out.intensity) out.intensity = (C().intensity[intensityKey] || C().intensity.normal).name;
    return out;
  }
  function spendGroup(fire) { for (const x of fire.uses) spendAmmo(x.u, x.use); }

  function moraleAfter(state, u, res, extra) {
    const cfg = C();
    const pct = res.fitBefore > 0 ? res.cas / res.fitBefore * 100 : 0;
    let loss = pct * cfg.moraleLossPerPct + res.supp / cfg.moraleSuppressionDiv + (extra.ambushed ? cfg.moraleAmbushed : 0);
    if (res.cond) loss += res.cond * 0.15;
    loss *= cfg.experienceMorale[u.experience];
    let gain = extra.win ? cfg.moraleWin : 0;
    const before = u.morale;
    u.morale = Math.max(0, Math.min(100, Math.round(u.morale - loss + gain)));
    const parts = [];
    if (pct > 0) parts.push(`втрати ${F(pct)}% складу (−${F(pct * cfg.moraleLossPerPct * cfg.experienceMorale[u.experience])})`);
    if (res.supp > 0) parts.push(`придушення (−${F(res.supp / cfg.moraleSuppressionDiv * cfg.experienceMorale[u.experience])})`);
    if (extra.ambushed) parts.push(`захоплено зненацька (−${F(cfg.moraleAmbushed * cfg.experienceMorale[u.experience])})`);
    if (res.cond) parts.push(`пошкодження техніки (−${F(res.cond * 0.15 * cfg.experienceMorale[u.experience])})`);
    if (gain) parts.push(`успіх у бою (+${gain})`);
    return { before, after: u.morale, text: parts.join(', ') || 'без змін' };
  }

  function gainXp(state, u, amount) {
    u.xp += amount;
    const t = C().xpForLevel;
    let lvl = u.experience;
    while (lvl + 1 < t.length && u.xp >= t[lvl + 1]) lvl++;
    if (lvl > u.experience) {
      u.experience = lvl;
      Engine.log(state, `${u.name}: бойовий досвід зріс — тепер «${CONFIG.experience[lvl]}».`, 'info', u.faction);
    }
  }

  // ------------------------------------------------- наслідки для моралі
  // Відступ: до 3 гексів від загрози, до найближчого безпечного гекса
  // Відступ у тил: у межах очок руху (дорогами — далі), подалі від відомого
  // противника, ближче до своїх підрозділів і своєї території.
  // budgetShare — частка години, яку триває відступ.
  function findRetreatHex(state, u, threatIdx, budgetShare) {
    const grid = g(state);
    const cfg = C();
    const cls = Engine.moveClass(u);
    const occ = Engine.occupancy(state);
    const budget = Engine.mpMax(u) * (budgetShare != null ? budgetShare : cfg.retreatMpShare);
    // загрози: усі відомі вороги (видимі й застарілі позначки) + атакуючий
    const threats = Intel.knownList(state, u.faction).map(m => m.idx);
    if (threatIdx != null && threatIdx >= 0 && threatIdx !== u.idx) threats.push(threatIdx);
    const knownNow = Engine.knownForeignHexes(state, u.faction);
    const danger = new Set();
    for (const h of knownNow) for (let d = 0; d < 6; d++) { const n = grid.neighbor(h, d); if (n >= 0) danger.add(n); }
    const friends = state.units.filter(x => x.faction === u.faction && x !== u && x.embarked == null && x.personnel.fit > 0 && !(u.carrying || []).includes(x.id)).map(x => x.idx);
    const dMin = (i, list, cap) => { let m = cap; for (const h of list) { const d = grid.dist(i, h); if (d < m) m = d; } return m; };
    const score = (n, cost) => {
      const dT = threats.length ? Math.min(cfg.retreatWeights.threatCap, dMin(n, threats, 30)) : 0;
      const dF = friends.length ? dMin(n, friends, 30) : 0;
      const ctl = state.map.control[n];
      return dT * cfg.retreatWeights.threat - dF * cfg.retreatWeights.friend
        + (ctl === u.faction ? cfg.retreatWeights.ownControl : ctl >= 0 ? -cfg.retreatWeights.ownControl : 0)
        + (state.map.road[n] ? cfg.retreatWeights.road : 0)
        - (danger.has(n) ? cfg.retreatWeights.danger : 0)
        - cost * 0.3 - n * 1e-7;
    };
    // Дейкстра в межах бюджету
    const dist = new Map([[u.idx, 0]]);
    const came = new Map();
    const heap = new MinHeap();
    heap.push(0, u.idx);
    const base = score(u.idx, 0);
    let best = -1, bestScore = -Infinity;
    while (heap.size) {
      const cur = heap.pop();
      const cd = dist.get(cur);
      if (cur !== u.idx) {
        const sc = score(cur, cd);
        if (sc > bestScore) { bestScore = sc; best = cur; }
      }
      for (let d = 0; d < 6; d++) {
        const n = grid.neighbor(cur, d);
        if (n < 0) continue;
        const c = Engine.stepCost(state, cls, cur, d, n);
        if (!isFinite(c)) continue;
        const nd = cd + c;
        if (nd > budget + 1e-9 && !(cur === u.idx && dist.size === 1 && c <= Engine.mpMax(u))) continue;  // хоча б один гекс
        const list = occ.get(n);
        if (list && list.some(e => e.faction !== u.faction)) continue;
        if (nd < (dist.has(n) ? dist.get(n) : Infinity) - 1e-9) { dist.set(n, nd); came.set(n, cur); heap.push(nd, n); }
      }
    }
    if (best < 0) return { idx: -1 };
    const path = [];
    for (let c = best; c !== u.idx; c = came.get(c)) path.push(c);
    path.reverse();
    return { idx: best, path, cost: dist.get(best), safe: !danger.has(best) && dMin(best, threats, 99) > 1, better: bestScore > base };
  }

  // Перевірка моралі після бою: відступ, розсіювання, капітуляція
  function moraleOutcome(state, u, opponent, lines) {
    const cfg = C();
    const grid = g(state);
    if (u.personnel.fit <= 0) return 'eliminated';
    // капітуляція
    const trySurrender = () => {
      if (isVehicle(u)) return false;
      if (u.morale > cfg.surrenderBelow) return false;
      const weak = u.personnel.fit <= u.personnel.assigned * 0.25;
      if (!u.surrounded && !weak) return false;
      const adj = Engine.adjacentEnemies(state, u);
      if (!adj.length) return false;
      const captor = adj.find(e => opponent && e.id === opponent.id) || adj[0];
      surrender(state, u, captor, lines);
      return true;
    };
    if (trySurrender()) return 'surrendered';
    const shaken = u.morale < cfg.retreatBelow && (u.lastLoss > 0 || u.morale < cfg.disperseBelow);
    if (!shaken) return 'held';
    const r = findRetreatHex(state, u, opponent ? opponent.idx : u.idx);
    if (r.idx < 0) {
      u.surrounded = true;
      u.morale = Math.max(0, u.morale - cfg.surroundedPenalty);
      lines.push(`${u.name}: шляху для відступу немає — підрозділ в оточенні (мораль −${cfg.surroundedPenalty}, тепер ${u.morale}).`);
      if (trySurrender()) return 'surrendered';
      if (u.morale < cfg.disperseBelow) { disperse(state, u, lines); return 'dispersed'; }
      return 'surrounded';
    }
    if (u.morale < cfg.disperseBelow) {
      disperse(state, u, lines);
      if (u.personnel.fit > 0) moveTo(state, u, r, lines, `рештки підрозділу відходять`);
      return 'dispersed';
    }
    moveTo(state, u, r, lines, `мораль ${u.morale} < ${cfg.retreatBelow} — відступ`);
    return 'retreated';
  }

  function disperse(state, u, lines) {
    const cfg = C();
    const lvl = Math.min(3, u.dispersal + (u.morale < cfg.disperseBelow / 2 ? 2 : 1));
    const share = cfg.disperseShare * (lvl >= 3 ? 2.5 : 1);
    const n = Math.min(u.personnel.fit, Math.ceil(u.personnel.fit * share));
    u.personnel.fit -= n; u.personnel.straggling += n;
    u.dispersal = u.personnel.fit <= 0 ? 3 : lvl;
    u.order = null; u.pendingOrder = null; u.stance = 'none'; u.fort = 0;
    lines.push(`${u.name}: мораль ${u.morale} < ${cfg.disperseBelow} — підрозділ розсіюється, ${n} бійців відстали (рівень розсіювання ${u.dispersal}/3). Вони можуть повернутися, якщо поруч не буде противника.`);
  }

  function moveTo(state, u, r, lines, why) {
    const grid = g(state);
    if (u.embarked != null) {
      const v = Engine.unitById(state, u.embarked);
      if (v) { v.carrying = v.carrying.filter(id => id !== u.id); lines.push(`${u.name}: покидає ${v.name}.`); }
      u.embarked = null;
    }
    const from = u.idx;
    u.idx = r.idx;
    u.order = null; u.pendingOrder = null; u.stance = 'none'; u.fort = 0; u.mp = 0;
    u.movedTurn = state.time.turn;
    if (u.carrying && u.carrying.length) Transport.syncPassengers(state, u);
    const viaRoad = r.path && r.path.filter(i => state.map.road[i]).length;
    lines.push(`${u.name}: ${why} ${grid.label(from)} → ${grid.label(r.idx)} (${r.path ? r.path.length : 1} гекс.${viaRoad ? `, з них ${viaRoad} дорогою` : ''}, у бік своїх)${r.safe ? '' : '; безпечного місця поблизу немає, контакт із противником зберігається'}.`);
  }


  function surrender(state, u, captor, lines) {
    const p = u.personnel;
    const prisoners = p.fit + p.wounded;
    const allW = Object.assign({}, u.weapons), allA = Object.assign({}, u.ammo);
    if (u.cargo) { for (const [m, n] of Object.entries(u.cargo.weapons)) allW[m] = (allW[m] || 0) + n; for (const [c, n] of Object.entries(u.cargo.ammo)) allA[c] = (allA[c] || 0) + n; u.cargo = { weapons: {}, ammo: {} }; }
    const given = Loot.give(state, captor, allW, allA);
    if (Loot.count(given.left.weapons)) { const c = Loot.cacheAt(state, u.idx, true); for (const [m, n] of Object.entries(given.left.weapons)) c.weapons[m] = (c.weapons[m] || 0) + n; }
    const tw = [Loot.describe(given)];
    const ta = [];
    p.captured += prisoners; p.fit = 0; p.wounded = 0;
    // відсталі бійці залишаються вільними — зниклі безвісти
    p.missing += p.straggling; p.straggling = 0;
    u.weapons = {}; u.ammo = {};
    state.prisoners.push({ holder: captor.faction, origin: u.faction, count: prisoners, unit: u.name, day: state.time.day, hour: state.time.hour });
    u.surrendered = { by: captor.faction, captor: captor.name };
    lines.push(`${u.name}: КАПІТУЛЯЦІЯ — мораль ${u.morale}, ${u.surrounded ? 'оточення' : 'залишилося ≤25% складу'}. У полон до «${Engine.fname(captor.faction)}» (${captor.name}) потрапили ${prisoners} осіб. Трофеї переходять до ${captor.name}: ${tw.join(', ')}.`);
  }

  // Видалення знищених / полонених підрозділів
  function cleanup(state) {
    const keep = [];
    for (const u of state.units) {
      const p = u.personnel;
      const gone = u.surrendered || u.destroyed || (p.fit <= 0 && p.straggling <= 0);
      if (!gone) { keep.push(u); continue; }
      if (u.carrying && u.carrying.length) Transport.forceUnloadAll(state, u, 'машина вибула');
      if (!u.surrendered) Loot.dropAll(state, u);
      if (u.embarked != null) { const v = Engine.unitById(state, u.embarked); if (v) v.carrying = v.carrying.filter(id => id !== u.id); u.embarked = null; }
      let fate = u.surrendered ? 'Капітулював' : u.destroyed ? 'Техніку знищено' : 'Знищено';
      if (!u.surrendered && p.wounded > 0) {
        // поранені без боєздатних товаришів
        const adj = Engine.adjacentEnemies(state, u);
        if (adj.length) {
          p.captured += p.wounded;
          state.prisoners.push({ holder: adj[0].faction, origin: u.faction, count: p.wounded, unit: u.name, day: state.time.day, hour: state.time.hour });
          Engine.log(state, `${u.name}: ${p.wounded} поранених залишилися без допомоги й потрапили в полон до «${Engine.fname(adj[0].faction)}».`, 'warn', u.faction, [u.faction, adj[0].faction]);
          p.wounded = 0;
        } else {
          p.missing += p.wounded;
          Engine.log(state, `${u.name}: ${p.wounded} поранених залишилися без допомоги — зниклі безвісти (евакуація — етап 3).`, 'warn', u.faction);
          p.wounded = 0;
        }
      }
      state.lost.push({ id: u.id, name: u.name, type: u.type, faction: u.faction, fate, day: state.time.day, hour: state.time.hour, personnel: Object.assign({}, p), idx: u.idx });
      Engine.log(state, `${u.name} (${Engine.fname(u.faction)}) вибуває з кампанії: ${fate.toLowerCase()}.`, 'warn', u.faction, null);
    }
    state.units = keep;
  }

  // ------------------------------------------------------------ перевірки
  function resolveTarget(state, u, target) {
    // target: { unitId } — пряма атака; { hex } — навісний вогонь
    const grid = g(state);
    if (target.unitId != null) {
      const t = Engine.unitById(state, target.unitId);
      if (!t || t.faction === u.faction) return { error: 'Ціль не знайдено.' };
      if (!Intel.isVisible(state, u.faction, t.id)) {
        const m = Intel.ensure(state)[u.faction][t.id];
        if (m && hasIndirect(u)) return { hex: m.idx, marker: m };
        return { error: 'Ціль зараз не спостерігається. Прямий вогонь можливий лише по виявленому противнику; міномети можуть бити по застарілих позначках.' };
      }
      return { unit: t, hex: t.idx };
    }
    if (target.hex != null) {
      const vis = Engine.unitsAt(state, target.hex).filter(e => e.faction !== u.faction && Intel.isVisible(state, u.faction, e.id));
      const marks = Intel.markerAt(state, u.faction, target.hex);
      if (!vis.length && !marks.length) return { error: 'У цьому гексі немає відомого противника.' };
      return { hex: target.hex, unit: vis[0] || null, marker: marks[0] || null };
    }
    return { error: 'Не вказано ціль.' };
  }

  function previewAttack(state, unitId, target, intensity = 'normal') {
    const u = Engine.unitById(state, unitId);
    const err = Engine.checkCommandable(state, u);
    if (err) return { ok: false, reason: err };
    const cfg = C();
    if (u.attackedTurn === state.time.turn) return { ok: false, reason: 'Підрозділ уже вів бій цієї години.' };
    const indirect = hasIndirect(u);
    if (indirect && u.movedThisPhase) return { ok: false, reason: 'Міномет розгортається на місці: після руху цієї години вогонь неможливий.' };
    if (!indirect && u.mp < Engine.mpMax(u) * cfg.attackMinMp - 1e-9) return { ok: false, reason: `Для атаки потрібно щонайменше ${cfg.attackMinMp * 100}% часу години (залишилось ${Engine.fmt(u.mp)} з ${Engine.mpMax(u)} ОР).` };
    const tr = resolveTarget(state, u, target);
    if (tr.error) return { ok: false, reason: tr.error };
    const grid = g(state);
    const dist = grid.dist(u.idx, tr.hex);
    const meters = dist * CONFIG.hexMeters;
    if (!indirect && !tr.unit) return { ok: false, reason: 'Прямий вогонь можливий лише по виявленому противнику.' };
    let los = { ok: true };
    if (!indirect && dist > 1) {
      los = Intel.lineOfSight(state, u.idx, tr.hex, Engine.terrainKey(state, u.idx) === 'mountains');
      if (!los.ok) return { ok: false, reason: `Немає лінії видимості: її перекриває гекс ${grid.label(los.blocker)} (${CONFIG.terrain[state.map.terrain[los.blocker]].name}).` };
    }
    const list = weaponsInRange(u, dist, indirect);
    if (!list.length) return { ok: false, reason: `Ціль поза дальністю зброї: до неї ${meters} м, найбільша дальність ${maxRange(u, indirect)} м.` };
    const fire = groupFire(state, u, dist, intensity, { indirect });
    const totalUse = Object.values(fire.use).reduce((a, b) => a + b, 0);
    if (totalUse <= 0) return { ok: false, reason: 'Немає боєприпасів для зброї, що дістає до цілі.' };
    let freshness = 1;
    if (indirect && !(tr.unit && Intel.isVisible(state, u.faction, tr.unit.id))) {
      const age = tr.marker ? state.time.turn - tr.marker.turn : 0;
      freshness = Math.max(0.25, 1 - cfg.indirectFreshnessPerHour * age);
    }
    const notes = [];
    if (indirect) notes.push(freshness < 1 ? `Навісний вогонь по застарілих даних: точність ${Math.round(freshness * 100)}%.` : 'Навісний вогонь по виявленій цілі.');
    if (!indirect && u.stance === 'defend' && u.fort > 0) notes.push(`Вогонь з обладнаних позицій (рівень ${u.fort}) — позиції зберігаються.`);
    else if (!indirect) notes.push('Атака з маневром: укриття атакуючого діє наполовину.');
    const short = fire.used.filter(x => x.noAmmo).map(x => x.model);
    if (short.length) notes.push(`Немає боєприпасів для: ${short.join(', ')}.`);
    return {
      ok: true, unitId, target, hex: tr.hex, targetUnit: tr.unit ? tr.unit.id : null, marker: tr.marker || null,
      dist, meters, indirect, intensity, freshness, weapons: list.map(x => ({ model: x.model, n: x.n, range: x.w.range })),
      ammo: fire.use, ammoText: ammoText(fire.use), notes
    };
  }

  // -------------------------------------------------------------- атака
  function attack(state, unitId, target, intensity = 'normal') {
    const pv = previewAttack(state, unitId, target, intensity);
    if (!pv.ok) return pv;
    return pv.indirect ? indirectFire(state, pv) : directAttack(state, pv);
  }

  function directAttack(state, pv) {
    const cfg = C();
    const grid = g(state);
    const turn = state.time.turn;
    const a = Engine.unitById(state, pv.unitId);
    const d = Engine.unitById(state, pv.targetUnit);
    const af = a.faction, df = d.faction;
    const R = { kind: 'direct', time: Engine.timeLabel(state.time), attacker: a.name, defender: d.name, af, df, steps: [], visibleTo: [af, df] };
    const step = (title, lines) => R.steps.push({ title, lines });

    // 1. Виявлення
    const ambush = !Intel.isVisible(state, df, a.id);
    const dIntel = Intel.ensure(state)[af][d.id];
    step('1. Виявлення цілі', [
      `${a.name} (${Engine.fname(af)}) атакує ${dIntel ? dIntel.label : 'противника'} — ${d.name} (${Engine.fname(df)}).`,
      ambush ? `Засідка: ${d.name} не виявив атакуючого заздалегідь.` : `${d.name} знав про присутність атакуючого.`
    ]);
    // 2. Дальність і видимість
    step('2. Дальність і лінія видимості', [
      `Відстань ${pv.dist} гекс. (${pv.meters} м), лінія видимості ${pv.dist === 1 ? 'є (близький контакт)' : 'відкрита'}.`,
      `Зброя в межах дальності: ${pv.weapons.map(w => `${w.model} ×${w.n} (${w.range} м)`).join(', ')}.`
    ]);
    // 3. Місцевість і чисельність
    const firingFromPositions = a.stance === 'defend' && a.fort > 0;
    const aCover = coverOf(state, a, { advancing: !firingFromPositions });
    const dCover = coverOf(state, d, {});
    step('3. Місцевість, укриття, чисельність', [
      `${d.name}: ${CONFIG.terrain[state.map.terrain[d.idx]].name}${d.fort ? `, обладнані позиції рівня ${d.fort}` : ''} — укриття ${Math.round(dCover * 100)}%. Боєздатних: ${d.personnel.fit}.`,
      `${a.name}: ${CONFIG.terrain[state.map.terrain[a.idx]].name}${firingFromPositions ? `, вогонь з позицій рівня ${a.fort}` : ', атака з маневром (укриття наполовину)'} — укриття ${Math.round(aCover * 100)}%. Боєздатних: ${a.personnel.fit}.`
    ]);

    // 4–5. Вогонь і втрати
    const dCanReply = (Engine.canAct(d) && weaponsInRange(d, pv.dist, false).length > 0) || Transport.passengers(state, d).some(p => p.personnel.fit > 0 && weaponsInRange(p, pv.dist, false).length > 0);
    const dIntensity = 'normal';
    const order = ambush ? 'attacker' : (d.stance === 'defend' && d.fort > 0 ? 'defender' : 'simultaneous');
    const fireLines = [];
    const extraLines = [];
    const aHit = a.embarked != null ? (Engine.unitById(state, a.embarked) || a) : a;
    const aHitCover = aHit === a ? aCover : coverOf(state, aHit, {});
    let resA = null, resD = null, fireA = null, fireD = null;
    const fireDesc = (u, f) => `${u.name} (${f.intensity.toLowerCase()} вогонь): ${f.used.filter(x => x.eff > 0 || x.at > 0).map(x => `${x.model} ×${x.n} → ${F(x.eff)}${x.at > 0 && isVehicle(d) ? ` / ПТ ${F(x.at)}` : ''}`).join('; ') || 'без ефекту'}. Сумарна ефективність ${F(f.soft)}${f.at > 0 ? `, протитанкова ${F(f.at)}` : ''}. Витрачено: ${ammoText(f.use)}.`;
    if (order === 'simultaneous') {
      fireA = groupFire(state, a, pv.dist, pv.intensity);
      fireD = dCanReply ? groupFire(state, d, pv.dist, dIntensity) : null;
      fireLines.push('Перший вогонь: обидві сторони відкривають вогонь одночасно.');
      resD = hitUnit(state, d, fireA, dCover, extraLines);
      if (fireD) resA = hitUnit(state, aHit, fireD, aHitCover, extraLines);
    } else if (order === 'attacker') {
      fireA = groupFire(state, a, pv.dist, pv.intensity, { mult: cfg.ambushAttacker });
      fireLines.push(`Перший вогонь за атакуючим (засідка, вогонь ×${cfg.ambushAttacker}).`);
      resD = hitUnit(state, d, fireA, dCover, extraLines);
      if (dCanReply && d.personnel.fit > 0) {
        fireD = groupFire(state, d, pv.dist, dIntensity, { mult: cfg.ambushDefender });
        fireLines.push(`${d.name} відповідає із запізненням (×${cfg.ambushDefender}).`);
        resA = hitUnit(state, aHit, fireD, aHitCover, extraLines);
      }
    } else {
      fireD = dCanReply ? groupFire(state, d, pv.dist, dIntensity) : null;
      fireLines.push(`Перший вогонь за обороною: ${d.name} з підготовлених позицій відкриває вогонь першим.`);
      if (fireD) resA = hitUnit(state, aHit, fireD, aHitCover, extraLines);
      if (a.personnel.fit > 0) {
        fireA = groupFire(state, a, pv.dist, pv.intensity);
        resD = hitUnit(state, d, fireA, dCover, extraLines);
      }
    }
    if (fireA) { spendGroup(fireA); fireLines.push(fireDesc(a, fireA)); }
    if (fireD) { spendGroup(fireD); fireLines.push(fireDesc(d, fireD)); }
    else if (!dCanReply) fireLines.push(`${d.name} не може відповісти: ${Engine.canAct(d) ? 'немає зброї, що дістає до атакуючого' : 'підрозділ розсіяний'}.`);
    step('4. Вогнева ефективність', fireLines);

    const lossLine = (u, r) => r ? `${u.name}: уражено ${r.cas} (загинули ${r.killed}, поранені ${r.wounded}); придушення +${F(r.supp)} → ${Math.round(u.suppression)}${r.cond ? `; техніка −${r.cond}% (стан ${u.vehicle.condition}%)` : ''}${r.destroyed ? ' — МАШИНУ ЗНИЩЕНО' : ''}. Боєздатних: ${u.personnel.fit}.` : `${u.name}: без втрат.`;
    step('5. Втрати, витрата боєприпасів, придушення', [lossLine(d, resD), lossLine(aHit, resA)].concat(extraLines));

    // 6. Мораль
    const empty = u => ({ cas: 0, killed: 0, wounded: 0, supp: 0, fitBefore: u.personnel.fit, cond: 0 });
    resA = resA || empty(a); resD = resD || empty(d);
    a.lastLoss = resA.cas; d.lastLoss = resD.cas;
    const aWin = resD.cas + resD.cond / 20 > resA.cas + resA.cond / 20;
    const dWin = resA.cas + resA.cond / 20 > resD.cas + resD.cond / 20;
    const mD = moraleAfter(state, d, resD, { ambushed: ambush, win: dWin && !ambush });
    const mA = moraleAfter(state, a, resA, { win: aWin });
    const mLines = [
      `${d.name}: мораль ${mD.before} → ${mD.after} (${moraleBand(mD.after)}): ${mD.text}.`,
      `${a.name}: мораль ${mA.before} → ${mA.after} (${moraleBand(mA.after)}): ${mA.text}.`
    ];
    // знищення техніки
    for (const [u, r] of [[d, resD], [a, resA]]) {
      if (r.destroyed) {
        u.destroyed = true;
        mLines.push(`${u.name}: машину знищено — підрозділ вибуває.`);
        u.personnel.missing += 0;
      }
    }
    const outD = d.destroyed ? 'destroyed' : moraleOutcome(state, d, a, mLines);
    const outA = a.destroyed ? 'destroyed' : moraleOutcome(state, a, d, mLines);
    if (outD === 'held' && outA === 'held') mLines.push('Обидві сторони утримують позиції, бій триває.');
    step('6. Мораль і результат', mLines);

    // Службові позначки
    a.mp = 0; a.attackedTurn = turn; a.firedTurn = turn; a.combatTurn = turn; a.order = null;
    if (a.embarked != null) { const v = Engine.unitById(state, a.embarked); if (v) { v.mp = 0; v.order = null; v.combatTurn = turn; v.firedTurn = turn; } }
    for (const p of Transport.passengers(state, a)) { p.attackedTurn = turn; p.firedTurn = turn; p.combatTurn = turn; p.mp = 0; }
    if (!firingFromPositions && a.stance === 'observe') a.stance = 'none';
    d.combatTurn = turn; if (fireD) d.firedTurn = turn;
    gainXp(state, a, aWin ? 2 : 1); gainXp(state, d, dWin ? 2 : 1);
    R.result = { attacker: outA, defender: outD, lossA: resA.cas, lossD: resD.cas };

    // Журнал (видно обом учасникам)
    Engine.log(state, `БІЙ: ${a.name} атакує ${d.name} (${pv.meters} м). Втрати: ${a.name} −${resA.cas}, ${d.name} −${resD.cas}. Мораль: ${mA.after} / ${mD.after}.`, 'combat', af, [af, df]);
    for (const s of R.steps) for (const l of s.lines) Engine.log(state, '· ' + l, 'combatd', af, [af, df]);
    state.lastCombat = R;
    cleanup(state);
    Intel.update(state);
    Engine.snapshot(state, a);
    return { ok: true, report: R };
  }

  function indirectFire(state, pv) {
    const cfg = C();
    const grid = g(state);
    const turn = state.time.turn;
    const a = Engine.unitById(state, pv.unitId);
    const af = a.faction;
    const targets = Engine.unitsAt(state, pv.hex).filter(e => e.faction !== af && e.embarked == null);
    const observed = Intel.hexObserved(state, af, pv.hex);
    const R = { kind: 'indirect', time: Engine.timeLabel(state.time), attacker: a.name, defender: grid.label(pv.hex), af, df: targets.length ? targets[0].faction : null, steps: [] };
    const step = (title, lines) => R.steps.push({ title, lines });
    step('1. Виявлення цілі', [
      pv.freshness < 1 ? `Вогонь по застарілій позначці (${pv.marker ? `${state.time.turn - pv.marker.turn} год тому` : ''}), точність ${Math.round(pv.freshness * 100)}%.` : 'Вогонь по цілі, що спостерігається зараз.',
      observed ? 'Гекс цілі під спостереженням — результат буде видно.' : 'Гекс цілі поза спостереженням — результат не буде відомий.'
    ]);
    step('2. Дальність і лінія видимості', [`Відстань ${pv.dist} гекс. (${pv.meters} м). Навісний вогонь — пряма видимість не потрібна.`]);
    const fire = groupFire(state, a, pv.dist, pv.intensity, { indirect: true, mult: pv.freshness });
    spendGroup(fire);
    const fLines = [`${a.name} (${fire.intensity.toLowerCase()} вогонь): ефективність ${F(fire.soft)}. Витрачено: ${ammoText(fire.use)}.`];
    const resLines = [], mLines = [];
    if (!targets.length) {
      fLines.push('У гексі цілі противника не виявилося — міни впали в порожнечу.');
    } else {
      const share = 1 / targets.length;
      step('3. Місцевість, укриття, чисельність', targets.map(t => `${t.name}: ${CONFIG.terrain[state.map.terrain[t.idx]].name}${t.fort ? `, позиції рівня ${t.fort}` : ''} — укриття від мін ${Math.round(coverOf(state, t, { indirect: true }) * 100)}%.`));
      for (const t of targets) {
        const part = { soft: fire.soft * share, at: fire.at * share, sup: fire.sup * share };
        const extra = [];
        const r = hitUnit(state, t, part, coverOf(state, t, { indirect: true }), extra);
        t.lastLoss = r.cas; t.combatTurn = turn;
        resLines.push(`${t.name}: уражено ${r.cas} (загинули ${r.killed}, поранені ${r.wounded}); придушення +${F(r.supp)}${r.cond ? `; техніка −${r.cond}%` : ''}${r.destroyed ? ' — МАШИНУ ЗНИЩЕНО' : ''}.`, ...extra);
        const m = moraleAfter(state, t, r, { ambushed: false });
        mLines.push(`${t.name}: мораль ${m.before} → ${m.after}: ${m.text}.`);
        if (r.destroyed) t.destroyed = true;
        else moraleOutcome(state, t, a, mLines);
        Engine.log(state, `${t.name}: під мінометним обстрілом у ${grid.label(t.idx)} — уражено ${r.cas}, мораль ${t.morale}.`, 'combat', t.faction, [t.faction]);
      }
    }
    step('4. Вогнева ефективність', fLines);
    step('5. Втрати', resLines.length ? resLines : ['Втрат не завдано.']);
    if (mLines.length) step('6. Мораль і результат', mLines);
    a.mp = 0; a.attackedTurn = turn; a.firedTurn = turn; a.order = null;
    gainXp(state, a, 1);

    // Що дізнається атакуючий
    if (observed) {
      R.visibleTo = [af].concat(targets.map(t => t.faction));
      Engine.log(state, `МІНОМЕТ: ${a.name} обстрілює ${grid.label(pv.hex)}. ${targets.length ? 'Спостерігачі бачать ураження противника.' : 'Противника в гексі немає.'}`, 'combat', af, [af]);
      for (const s of R.steps) for (const l of s.lines) Engine.log(state, '· ' + l, 'combatd', af, [af]);
    } else {
      // без спостереження атакуючий бачить лише власну частину звіту
      R.steps = R.steps.filter(s => /^(1|2|4)\./.test(s.title)).map(s => s.title.startsWith('4.') ? { title: s.title, lines: [s.lines[0]] } : s);
      R.steps.push({ title: '5–6. Результат', lines: ['Результат не спостерігався: гекс цілі поза полем зору ваших підрозділів.'] });
      R.visibleTo = [af];
      Engine.log(state, `МІНОМЕТ: ${a.name} обстрілює ${grid.label(pv.hex)}; витрачено ${ammoText(fire.use)}. Результат не спостерігався.`, 'combat', af, [af]);
    }
    state.lastCombat = R;
    cleanup(state);
    Intel.update(state);
    return { ok: true, report: R };
  }

  return { moraleAfter, previewAttack, attack, computeFire, groupFire, inflict, applyDamage, coverOf, weaponsInRange, maxRange, hasIndirect, cleanup, armorOf, findRetreatHex };
})();

// ---- 07b_transport.js
// ============================================================================
// МОДУЛЬ: ТРАНСПОРТ І ОРГАНІЗАЦІЯ ПІДРОЗДІЛІВ
// Посадка/висадка, пасажири, пальне, знищення машини з людьми.
// Виділення відділення зі взводу та об’єднання підрозділів.
// ============================================================================
const Transport = (() => {
  const T = () => CONFIG.transport;
  const O = () => CONFIG.organization;

  function vdef(u) { return CONFIG.unitTypes[u.type].vehicle || null; }
  function isVehicle(u) { return !!vdef(u); }
  function persons(u) { return u.personnel.fit + u.personnel.wounded; }
  function passengers(state, v) { return (v.carrying || []).map(id => Engine.unitById(state, id)).filter(Boolean); }
  function load(state, v) { return passengers(state, v).reduce((a, p) => a + persons(p), 0); }
  function capacity(v) { return v.vehicle ? v.vehicle.passengers : 0; }
  function carrierOf(state, u) { return u.embarked != null ? Engine.unitById(state, u.embarked) : null; }
  function fuelPerMp(v) { const d = vdef(v); return d ? d.fuelPerHour / CONFIG.unitTypes[v.type].mp : 0; }
  function r1(x) { return Math.round(x * 10) / 10; }

  // Пасажири рухаються разом із машиною; їхній час години = частка часу машини
  function syncPassengers(state, v) {
    for (const p of passengers(state, v)) {
      p.idx = v.idx;
      p.mp = Engine.mpMax(p) * (Engine.mpMax(v) ? v.mp / Engine.mpMax(v) : 0);
    }
  }

  function boardReason(state, u, v) {
    if (!v || !isVehicle(v)) return 'Це не транспортний засіб.';
    if (isVehicle(u)) return 'Техніку не можна завантажити в іншу техніку.';
    if (Engine.moveClass(u) !== 'foot') return 'Посадка можлива лише для пішого підрозділу.';
    if (u.embarked != null) return 'Підрозділ уже в машині.';
    if (v.faction !== u.faction) return 'Машина належить іншій фракції.';
    if (v.idx !== u.idx) return 'Машина має бути в тому самому гексі.';
    if (v.destroyed || v.personnel.fit <= 0) return 'У машини немає боєздатного екіпажу.';
    const free = capacity(v) - load(state, v);
    if (persons(u) > free) return `Не вистачає місць: потрібно ${persons(u)}, вільно ${free} з ${capacity(v)}.`;
    const cost = Engine.mpMax(u) * T().boardShare;
    if (u.mp < cost - 1e-9) return `Посадка займає ${T().boardShare * 100}% години, а в підрозділу залишилось ${Engine.fmt(u.mp)} з ${Engine.mpMax(u)} ОР.`;
    if (u.attackedTurn === state.time.turn) return 'Підрозділ уже вів бій цієї години.';
    return null;
  }

  function vehiclesFor(state, u) {
    return state.units.filter(v => isVehicle(v) && v.faction === u.faction && v.idx === u.idx && !v.destroyed)
      .map(v => ({ v, reason: boardReason(state, u, v), free: capacity(v) - load(state, v) }));
  }

  function board(state, unitId, vehicleId) {
    const u = Engine.unitById(state, unitId), v = Engine.unitById(state, vehicleId);
    const err = Engine.checkCommandable(state, u);
    if (err) return { ok: false, reason: err };
    const why = boardReason(state, u, v);
    if (why) return { ok: false, reason: why };
    const share = T().boardShare;
    if (u.order || u.pendingOrder) Engine.log(state, `${u.name}: попередній наказ скасовано через посадку.`, 'order', u.faction);
    u.order = null; u.pendingOrder = null; u.stance = 'none'; u.fort = 0;
    u.embarked = v.id;
    v.carrying = (v.carrying || []).concat(u.id);
    v.mp = Math.max(0, v.mp - Engine.mpMax(v) * share);
    if (v.fort) v.fort = 0;
    syncPassengers(state, v);
    u.movedThisPhase = true; u.movedTurn = state.time.turn;
    Engine.log(state, `${u.name}: посадка в ${v.name} (${load(state, v)}/${capacity(v)} місць). Посадка зайняла ${share * 100}% години; машина може рухатися далі в межах решти часу.`, 'order', u.faction);
    Intel.update(state);
    return { ok: true };
  }

  function unload(state, u, v, cost) {
    v.carrying = (v.carrying || []).filter(id => id !== u.id);
    u.embarked = null;
    u.idx = v.idx;
    const frac = Engine.mpMax(v) ? v.mp / Engine.mpMax(v) : 0;
    u.mp = Math.max(0, Engine.mpMax(u) * frac - (cost ? Engine.mpMax(u) * T().boardShare : 0));
  }

  function disembark(state, unitId) {
    const u = Engine.unitById(state, unitId);
    const err = Engine.checkCommandable(state, u);
    if (err && !(u && u.embarked != null && u.faction === Engine.phaseFaction(state))) return { ok: false, reason: err };
    if (!u || u.embarked == null) return { ok: false, reason: 'Підрозділ не перебуває в машині.' };
    const v = carrierOf(state, u);
    if (!v) { u.embarked = null; return { ok: true }; }
    v.mp = Math.max(0, v.mp - Engine.mpMax(v) * T().boardShare);
    unload(state, u, v, true);
    syncPassengers(state, v);
    Engine.log(state, `${u.name}: висадка з ${v.name} у ${Engine.grid(state).label(u.idx)}. Висадка зайняла ${T().boardShare * 100}% години.`, 'order', u.faction);
    Intel.update(state);
    return { ok: true };
  }

  function disembarkAll(state, vehicleId) {
    const v = Engine.unitById(state, vehicleId);
    if (!v) return { ok: false, reason: 'Машину не знайдено.' };
    if (v.faction !== Engine.phaseFaction(state)) return { ok: false, reason: 'Накази можна віддавати лише у фазі своєї фракції.' };
    const list = passengers(state, v);
    if (!list.length) return { ok: false, reason: 'У машині немає пасажирів.' };
    v.mp = Math.max(0, v.mp - Engine.mpMax(v) * T().boardShare);
    for (const p of list) unload(state, p, v, true);
    Engine.log(state, `${v.name}: висаджено ${list.map(p => p.name).join(', ')} у ${Engine.grid(state).label(v.idx)} (${T().boardShare * 100}% години).`, 'order', v.faction);
    Intel.update(state);
    return { ok: true, count: list.length };
  }

  // Примусова висадка (екіпаж вибув, машина зупинена)
  function forceUnloadAll(state, v, why) {
    const list = passengers(state, v);
    for (const p of list) unload(state, p, v, false);
    if (list.length) Engine.log(state, `${v.name}: ${why} — пасажири (${list.map(p => p.name).join(', ')}) залишили машину в ${Engine.grid(state).label(v.idx)}.`, 'warn', v.faction);
  }

  // Знищення машини: кожен, хто був усередині, — загиблий («200») або поранений («300»)
  function wreck(state, v, lines) {
    const share = T().destroyedKilledShare;
    const aboard = [v].concat(passengers(state, v));
    let k200 = 0, k300 = 0;
    for (const u of aboard) {
      const p = u.personnel;
      const n = p.fit;
      const killed = Math.round(n * share);
      const wounded = n - killed;
      p.fit = 0; p.killed += killed; p.wounded += wounded;
      if (killed > 0) Loot.onKilled(state, u, killed, n);
      k200 += killed; k300 += wounded;
      if (u !== v) {
        lines.push(`${u.name} (пасажири): «200» — ${killed}, «300» — ${wounded}.`);
        u.embarked = null;
      }
    }
    v.carrying = [];
    lines.push(`${v.name}: машину знищено разом з усіма, хто був усередині. Разом: загиблих ${k200}, поранених ${k300}.`);
  }

  // Вогонь по машині зачіпає пасажирів з тією ж інтенсивністю на людину
  function hitPassengers(state, v, perPersonRaw, suppGain, lines) {
    const out = [];
    for (const p of passengers(state, v)) {
      const raw = perPersonRaw * p.personnel.fit;
      const r = Combat.inflict(state, p, raw);
      p.suppression = Math.min(100, p.suppression + suppGain);
      p.lastLoss = r.cas; p.combatTurn = state.time.turn;
      const before = p.personnel.fit + r.cas;
      const m = Combat.moraleAfter(state, p, { cas: r.cas, fitBefore: before, supp: Math.round(suppGain * 10) / 10, cond: 0 }, {});
      lines.push(`${p.name} (пасажири ${v.name}): уражено ${r.cas} (загинули ${r.killed}, поранені ${r.wounded}), боєздатних ${p.personnel.fit}; мораль ${m.before} → ${m.after}.`);
      out.push({ p, r });
    }
    return out;
  }

  // Витрата пального на крок; повертає false, якщо пального не вистачає
  function burnFuel(state, v, cost) {
    if (!v.vehicle) return true;
    const need = cost * fuelPerMp(v);
    if (v.vehicle.fuel + 1e-9 < need) return false;
    v.vehicle.fuel = Math.max(0, r1(v.vehicle.fuel - need));
    return true;
  }

  // ------------------------------------------------- організація підрозділів
  const RIFLES = ['АК-74', 'АКМ', 'АКС-74У'];

  function nextNumber(state, typeId, faction) {
    let max = 0;
    const ut = CONFIG.unitTypes[typeId];
    const re = new RegExp('^' + ut.short.replace('.', '\\.') + ' №(\\d+)');
    for (const u of state.units.concat(state.lost || [])) {
      if (u.faction !== faction) continue;
      const m = re.exec(u.name);
      if (m) max = Math.max(max, Number(m[1]));
    }
    return max + 1;
  }

  function splitReason(state, u) {
    if (!u) return 'Підрозділ не знайдено.';
    if (!O().splittable.includes(u.type)) return 'Виділяти відділення можна лише з піхотного взводу.';
    if (u.embarked != null) return 'Спершу висадіть підрозділ із машини.';
    const n = O().squadSize;
    if (u.personnel.fit < n * 2) return `Для виділення відділення потрібно щонайменше ${n * 2} боєздатних (зараз ${u.personnel.fit}).`;
    const cost = Engine.mpMax(u) * O().actionShare;
    if (u.mp < cost - 1e-9) return `Реорганізація займає ${O().actionShare * 100}% години (залишилось ${Engine.fmt(u.mp)} ОР).`;
    if (u.attackedTurn === state.time.turn) return 'Підрозділ уже вів бій цієї години.';
    return null;
  }

  function splitSquad(state, unitId) {
    const u = Engine.unitById(state, unitId);
    const err = Engine.checkCommandable(state, u);
    if (err) return { ok: false, reason: err };
    const why = splitReason(state, u);
    if (why) return { ok: false, reason: why };
    const n = O().squadSize;
    // Зброя: 1 РПК (якщо є), автомати на решту, 1 одноразовий ПТГ (якщо є)
    const take = {};
    const grab = (m, k) => { const have = (u.weapons[m] || 0) - (take[m] || 0); const t = Math.min(have, k); if (t > 0) take[m] = (take[m] || 0) + t; return t; };
    let armed = grab('РПК', 1);
    for (const m of RIFLES) { if (armed >= n) break; armed += grab(m, n - armed); }
    for (const m of Object.keys(u.weapons)) { if (armed >= n) break; if (m === 'Одноразовий ПТГ') continue; armed += grab(m, n - armed); }
    grab('Одноразовий ПТГ', 1);
    // Боєприпаси — пропорційно до переданої зброї кожної категорії
    const ammo = {};
    const cats = {};
    for (const [m, k] of Object.entries(u.weapons)) { const w = CONFIG.weapons[m]; if (w) cats[w.ammo] = (cats[w.ammo] || 0) + k; }
    const moved = {};
    for (const [m, k] of Object.entries(take)) { const w = CONFIG.weapons[m]; if (w) moved[w.ammo] = (moved[w.ammo] || 0) + k; }
    for (const [c, k] of Object.entries(moved)) ammo[c] = Math.floor((u.ammo[c] || 0) * k / cats[c]);
    for (const [m, k] of Object.entries(take)) { u.weapons[m] -= k; if (u.weapons[m] <= 0) delete u.weapons[m]; }
    for (const [c, k] of Object.entries(ammo)) u.ammo[c] = (u.ammo[c] || 0) - k;
    const cost = Engine.mpMax(u) * O().actionShare;
    u.mp -= cost;
    u.personnel.fit -= n; u.personnel.assigned -= n;
    const s = Scenario.createUnit(state, 'inf_squad', u.faction, u.idx, nextNumber(state, 'inf_squad', u.faction));
    s.weapons = take; s.ammo = ammo;
    s.morale = u.morale; s.baseMorale = u.baseMorale; s.experience = u.experience; s.xp = u.xp;
    s.suppression = u.suppression; s.mp = u.mp; s.movedThisPhase = true; s.movedTurn = state.time.turn;
    s.fort = u.fort; s.stance = u.stance === 'defend' ? 'defend' : 'none';
    state.units.splice(state.units.indexOf(u) + 1, 0, s);
    Engine.log(state, `${u.name}: виділено ${s.name} (${n} осіб; ${Object.entries(take).map(([m, k]) => `${m} ×${k}`).join(', ')}). У взводі залишилось ${u.personnel.fit} боєздатних.`, 'order', u.faction);
    Engine.snapshot(state, u); Engine.snapshot(state, s);
    return { ok: true, newId: s.id };
  }

  function mergeReason(state, a, b) {
    if (!a || !b || a === b) return 'Оберіть два різні підрозділи.';
    if (a.faction !== b.faction) return 'Підрозділи належать різним фракціям.';
    if (a.idx !== b.idx) return 'Підрозділи мають бути в одному гексі.';
    if (!O().mergeable.includes(a.type) || !O().mergeable.includes(b.type)) return 'Об’єднувати можна піхотні підрозділи, кулеметні групи, гранатометників і розвідників.';
    if (a.embarked != null || b.embarked != null) return 'Спершу висадіть підрозділи з машини.';
    for (const u of [a, b]) {
      if (u.mp < Engine.mpMax(u) * O().actionShare - 1e-9) return `${u.name}: реорганізація займає ${O().actionShare * 100}% години (залишилось ${Engine.fmt(u.mp)} ОР).`;
      if (u.attackedTurn === state.time.turn) return `${u.name}: уже вів бій цієї години.`;
    }
    return null;
  }

  function merge(state, intoId, fromId) {
    const a = Engine.unitById(state, intoId), b = Engine.unitById(state, fromId);
    const err = Engine.checkCommandable(state, a);
    if (err) return { ok: false, reason: err };
    const why = mergeReason(state, a, b);
    if (why) return { ok: false, reason: why };
    const pa = a.personnel, pb = b.personnel;
    const wFit = pa.fit + pb.fit || 1;
    const wAs = pa.assigned + pb.assigned || 1;
    const morale = Math.round((a.morale * pa.fit + b.morale * pb.fit) / wFit);
    const base = Math.round((a.baseMorale * pa.assigned + b.baseMorale * pb.assigned) / wAs);
    const xp = Math.floor((a.xp * pa.assigned + b.xp * pb.assigned) / wAs);
    for (const k of Object.keys(pa)) pa[k] += pb[k] || 0;
    for (const [m, n] of Object.entries(b.weapons)) a.weapons[m] = (a.weapons[m] || 0) + n;
    for (const [c, n] of Object.entries(b.ammo)) a.ammo[c] = (a.ammo[c] || 0) + n;
    if (b.cargo) { const ca = Loot.ensureCargo(a); for (const [m, n] of Object.entries(b.cargo.weapons)) ca.weapons[m] = (ca.weapons[m] || 0) + n; for (const [c, n] of Object.entries(b.cargo.ammo)) ca.ammo[c] = (ca.ammo[c] || 0) + n; }
    a.morale = morale; a.baseMorale = base; a.xp = xp;
    const t = CONFIG.combat.xpForLevel;
    let lvl = 0; while (lvl + 1 < t.length && xp >= t[lvl + 1]) lvl++;
    const expBefore = a.experience;
    a.experience = lvl;
    a.suppression = Math.max(a.suppression, b.suppression);
    a.mp = Math.max(0, Math.min(a.mp, b.mp) - Engine.mpMax(a) * O().actionShare);
    a.fort = Math.min(a.fort, b.fort);
    a.order = null; a.pendingOrder = null;
    a.movedThisPhase = true; a.movedTurn = state.time.turn;
    // Тип: досить людей — взвод
    let renamed = '';
    if (a.type !== 'inf_platoon' && pa.assigned >= O().platoonMin && ['inf_squad', 'inf_platoon'].includes(a.type)) {
      const old = a.name;
      a.type = 'inf_platoon';
      a.name = `${CONFIG.unitTypes.inf_platoon.short} №${nextNumber(state, 'inf_platoon', a.faction)} ${['СВ', 'ДП', 'НП'][a.faction]}`;
      renamed = ` Підрозділ переформовано у взвод: ${old} → ${a.name}.`;
    }
    state.units = state.units.filter(u => u !== b);
    Engine.log(state, `${b.name} влито до ${a.name}: тепер ${pa.fit} боєздатних із ${pa.assigned} за штатом, мораль ${a.morale}, досвід «${CONFIG.experience[a.experience]}»${a.experience < expBefore ? ' (новобранці знизили загальний рівень)' : ''}.${renamed}`, 'order', a.faction);
    Engine.snapshot(state, a);
    Intel.update(state);
    return { ok: true };
  }

  function mergeCandidates(state, u) {
    return state.units.filter(x => x !== u && x.faction === u.faction && x.idx === u.idx && O().mergeable.includes(x.type) && x.embarked == null)
      .map(x => ({ u: x, reason: mergeReason(state, u, x) }));
  }

  return {
    isVehicle, passengers, load, capacity, carrierOf, persons, syncPassengers, vehiclesFor, boardReason, board,
    disembark, disembarkAll, forceUnloadAll, wreck, hitPassengers, burnFuel, fuelPerMp,
    splitReason, splitSquad, mergeReason, merge, mergeCandidates
  };
})();

// ---- 07c_loot.js
// ============================================================================
// МОДУЛЬ: МІСЦЯ БОЇВ І ТРОФЕЇ
// Загиблі («200») залишають у гексі свою зброю та частку боєприпасів.
// Знищені підрозділи й машини залишають усе майно. Будь-який підрозділ
// у гексі може забрати трофеї: спершу переозброїти бійців без зброї,
// решту — у вантаж (обмежений кількістю людей).
// ============================================================================
const Loot = (() => {
  const L = () => CONFIG.loot;

  function isHolder(model) { const w = CONFIG.weapons[model]; return !!w && w.holder !== false; }
  function holders(u) { let n = 0; for (const [m, k] of Object.entries(u.weapons)) if (isHolder(m)) n += k; return n; }
  function count(obj) { return Object.values(obj || {}).reduce((a, b) => a + b, 0); }
  function add(dst, src) { for (const [k, n] of Object.entries(src || {})) if (n > 0) dst[k] = (dst[k] || 0) + n; }
  function ensureCargo(u) { if (!u.cargo) u.cargo = { weapons: {}, ammo: {} }; return u.cargo; }

  function caches(state) { if (!state.caches) state.caches = {}; return state.caches; }
  function cacheAt(state, idx, create) {
    const c = caches(state);
    if (!c[idx] && create) c[idx] = { idx, weapons: {}, ammo: {}, dead: [0, 0, 0], wrecks: [], knownBy: [], seen: [null, null, null], created: { day: state.time.day, hour: state.time.hour } };
    return c[idx] || null;
  }
  function isEmpty(c) { return !c || (count(c.weapons) === 0 && count(c.ammo) === 0); }

  // Пропорційний вибір k одиниць зброї (найбільший залишок, детерміновано)
  function pickWeapons(weapons, k, onlyHolders) {
    const list = Object.entries(weapons).filter(([m, n]) => n > 0 && (!onlyHolders || isHolder(m)));
    const total = list.reduce((a, [, n]) => a + n, 0);
    const out = {};
    if (total <= 0 || k <= 0) return out;
    k = Math.min(k, total);
    const parts = list.map(([m, n]) => { const q = n * k / total; return { m, n, base: Math.floor(q), rem: q - Math.floor(q) }; });
    let left = k - parts.reduce((a, p) => a + p.base, 0);
    parts.sort((a, b) => b.rem - a.rem || b.n - a.n || (a.m < b.m ? -1 : 1));
    for (const p of parts) { let t = p.base; if (left > 0 && t < p.n) { t++; left--; } if (t > 0) out[p.m] = t; }
    return out;
  }

  // Загинули k бійців: їхня особиста зброя й частка набоїв лишаються в гексі
  function onKilled(state, u, k, fitBefore) {
    if (k <= 0) return;
    const c = cacheAt(state, u.idx, true);
    c.dead[u.faction] += k;
    const drop = pickWeapons(u.weapons, Math.min(k, holders(u)), true);
    for (const [m, n] of Object.entries(drop)) { u.weapons[m] -= n; if (u.weapons[m] <= 0) delete u.weapons[m]; }
    add(c.weapons, drop);
    const share = fitBefore > 0 ? k / fitBefore : 1;
    for (const [cat, n] of Object.entries(u.ammo)) {
      const d = Math.floor(n * share);
      if (d > 0) { u.ammo[cat] -= d; c.ammo[cat] = (c.ammo[cat] || 0) + d; }
    }
    // вантаж загиблих теж лишається
    if (u.cargo) {
      const cw = pickWeapons(u.cargo.weapons, Math.round(count(u.cargo.weapons) * share), false);
      for (const [m, n] of Object.entries(cw)) { u.cargo.weapons[m] -= n; if (u.cargo.weapons[m] <= 0) delete u.cargo.weapons[m]; }
      add(c.weapons, cw);
    }
  }

  // Підрозділ вибув: усе майно лишається в гексі
  function dropAll(state, u) {
    const c = cacheAt(state, u.idx, true);
    add(c.weapons, u.weapons); add(c.ammo, u.ammo);
    if (u.cargo) { add(c.weapons, u.cargo.weapons); add(c.ammo, u.cargo.ammo); }
    u.weapons = {}; u.ammo = {}; u.cargo = { weapons: {}, ammo: {} };
    if (u.vehicle && u.destroyed) c.wrecks.push(u.vehicle.model);
  }

  function cargoCap(u) {
    if (u.vehicle) return L().vehicleCargo[u.type] || 0;
    return Math.max(0, u.personnel.fit) * L().extraWeaponsPerPerson;
  }

  // Видати майно підрозділу: переозброєння → вантаж → решта в гекс
  function give(state, u, weapons, ammo) {
    const usedCats = new Set(Object.keys(u.weapons).map(m => CONFIG.weapons[m] && CONFIG.weapons[m].ammo).filter(Boolean));
    const cargo = ensureCargo(u);
    const res = { armed: {}, cargo: {}, ammo: {}, cargoAmmo: {}, left: { weapons: {}, ammo: {} } };
    const pool = Object.assign({}, weapons);
    // 1. переозброєння бійців без особистої зброї
    let deficit = Math.max(0, u.personnel.fit - holders(u));
    if (deficit > 0) {
      const own = Object.keys(u.weapons);
      const order = Object.keys(pool).filter(m => isHolder(m)).sort((a, b) => (own.includes(b) - own.includes(a)) || (a < b ? -1 : 1));
      for (const m of order) {
        if (deficit <= 0) break;
        const t = Math.min(pool[m], deficit);
        if (t > 0) { u.weapons[m] = (u.weapons[m] || 0) + t; pool[m] -= t; deficit -= t; res.armed[m] = t; usedCats.add(CONFIG.weapons[m].ammo); }
      }
    }
    // 2. вантаж
    let room = cargoCap(u) - count(cargo.weapons);
    for (const m of Object.keys(pool).sort()) {
      const t = Math.min(pool[m], Math.max(0, room));
      if (t > 0) { cargo.weapons[m] = (cargo.weapons[m] || 0) + t; pool[m] -= t; room -= t; res.cargo[m] = t; }
      if (pool[m] > 0) res.left.weapons[m] = pool[m];
    }
    // 3. набої: свої калібри — у боєкомплект, інші — у вантаж
    for (const [cat, n] of Object.entries(ammo || {})) {
      if (n <= 0) continue;
      if (usedCats.has(cat)) { u.ammo[cat] = (u.ammo[cat] || 0) + n; res.ammo[cat] = n; }
      else { cargo.ammo[cat] = (cargo.ammo[cat] || 0) + n; res.cargoAmmo[cat] = n; }
    }
    // боєприпаси з вантажу, які тепер підходять до нової зброї
    for (const cat of usedCats) if (cargo.ammo[cat]) { u.ammo[cat] = (u.ammo[cat] || 0) + cargo.ammo[cat]; res.ammo[cat] = (res.ammo[cat] || 0) + cargo.ammo[cat]; delete cargo.ammo[cat]; }
    return res;
  }

  function describe(res) {
    const w = o => Object.entries(o).map(([m, n]) => `${m} ×${n}`).join(', ');
    const a = o => Object.entries(o).map(([c, n]) => `${CONFIG.ammo[c] ? CONFIG.ammo[c].name : c} ${n}`).join(', ');
    const parts = [];
    if (count(res.armed)) parts.push(`переозброєно: ${w(res.armed)}`);
    if (count(res.ammo)) parts.push(`набої: ${a(res.ammo)}`);
    if (count(res.cargo)) parts.push(`у вантаж: ${w(res.cargo)}`);
    if (count(res.cargoAmmo)) parts.push(`набої у вантаж: ${a(res.cargoAmmo)}`);
    if (count(res.left.weapons)) parts.push(`не вмістилося й лишилося в гексі: ${w(res.left.weapons)}`);
    return parts.join('; ') || 'нічого';
  }

  function lootReason(state, u) {
    if (!u) return 'Підрозділ не знайдено.';
    const c = cacheAt(state, u.idx, false);
    if (isEmpty(c)) return 'У цьому гексі немає майна.';
    if (u.embarked != null) return 'Спершу висадіть підрозділ із машини.';
    if (u.personnel.fit <= 0) return 'Немає боєздатних бійців.';
    const cost = Engine.mpMax(u) * L().actionShare;
    if (u.mp < cost - 1e-9) return `Збір трофеїв займає ${L().actionShare * 100}% години (залишилось ${Engine.fmt(u.mp)} ОР).`;
    if (u.attackedTurn === state.time.turn) return 'Підрозділ уже вів бій цієї години.';
    return null;
  }

  function loot(state, unitId) {
    const u = Engine.unitById(state, unitId);
    const err = Engine.checkCommandable(state, u);
    if (err) return { ok: false, reason: err };
    const why = lootReason(state, u);
    if (why) return { ok: false, reason: why };
    const c = cacheAt(state, u.idx, false);
    const res = give(state, u, c.weapons, c.ammo);
    c.weapons = res.left.weapons; c.ammo = {};
    u.mp -= Engine.mpMax(u) * L().actionShare;
    u.movedThisPhase = true;
    const text = describe(res);
    Engine.log(state, `${u.name}: зібрано трофеї в ${Engine.grid(state).label(u.idx)} — ${text}.`, 'order', u.faction);
    remember(state, u.faction, c);
    return { ok: true, text };
  }

  function dropCargo(state, unitId) {
    const u = Engine.unitById(state, unitId);
    if (!u || u.faction !== Engine.phaseFaction(state)) return { ok: false, reason: 'Накази можна віддавати лише у фазі своєї фракції.' };
    const cargo = ensureCargo(u);
    if (!count(cargo.weapons) && !count(cargo.ammo)) return { ok: false, reason: 'Вантаж порожній.' };
    const c = cacheAt(state, u.idx, true);
    add(c.weapons, cargo.weapons); add(c.ammo, cargo.ammo);
    u.cargo = { weapons: {}, ammo: {} };
    Engine.log(state, `${u.name}: вантаж залишено в ${Engine.grid(state).label(u.idx)}.`, 'order', u.faction);
    remember(state, u.faction, c);
    return { ok: true };
  }

  // Що фракція знає про місце бою (оновлюється, коли гекс під спостереженням)
  function remember(state, f, c) {
    if (!c.knownBy.includes(f)) c.knownBy.push(f);
    c.seen[f] = { day: state.time.day, hour: state.time.hour, turn: state.time.turn, weapons: count(c.weapons), ammo: count(c.ammo), dead: c.dead.slice(), wrecks: c.wrecks.length };
  }
  function updateKnowledge(state) {
    const cs = caches(state);
    for (const key of Object.keys(cs)) {
      const c = cs[key];
      for (let f = 0; f < 3; f++) if (Intel.hexObserved(state, f, c.idx)) remember(state, f, c);
      if (isEmpty(c) && !c.dead.some(Boolean) && !c.wrecks.length) delete cs[key];
    }
  }
  function known(state, f) {
    return Object.values(caches(state)).filter(c => c.knownBy.includes(f)).map(c => ({ c, seen: c.seen[f], now: Intel.hexObserved(state, f, c.idx) }));
  }

  return { isHolder, holders, onKilled, dropAll, give, describe, loot, lootReason, dropCargo, cacheAt, caches, remember, updateKnowledge, known, cargoCap, ensureCargo, count, isEmpty };
})();

// ---- 08_save.js
// ============================================================================
// МОДУЛЬ: ЗБЕРЕЖЕННЯ — СЕРІАЛІЗАЦІЯ, ПЕРЕВІРКА, ВЕРСІЇ, СЛОТИ
// ============================================================================
const SaveSystem = (() => {
  const MAP_ARRAYS = {
    terrain: Uint8Array, river: Uint8Array, bridge: Uint8Array, road: Uint8Array,
    roadDirs: Uint8Array, control: Int8Array, settlement: Int16Array, region: Uint8Array
  };
  const SLOT_KEYS = ['auto', 'slot1', 'slot2', 'slot3'];
  const PREFIX = 'yugotaria.cw.';

  function serialize(state) {
    const map = {};
    for (const [k, v] of Object.entries(state.map)) {
      map[k] = (v && v.buffer instanceof ArrayBuffer) ? Array.from(v) : v;
    }
    const out = Object.assign({}, state, { map, savedAt: Date.now() });
    out.format = CONFIG.saveFormat;
    out.version = CONFIG.saveVersion;
    return JSON.stringify(out);
  }

  // Міграції між версіями формату: migrations[n] переводить версію n у n+1
  const migrations = {
    // v1 (етап 1) -> v2 (етап 2): бій, мораль, розвідка
    1(raw) {
      raw.intel = [{}, {}, {}];
      raw.prisoners = [];
      raw.lost = [];
      raw.lastCombat = null;
      for (const u of raw.units || []) if (u && typeof u === 'object') Scenario.addStage2Fields(u);
      for (const e of raw.log || []) if (e && e.vis === undefined) e.vis = null;
      raw.version = 2;
      return raw;
    },
    // v3 -> v4: місця боїв і трофеї
    3(raw) {
      raw.caches = raw.caches || {};
      for (const u of raw.units || []) if (u && typeof u === 'object' && !u.cargo) u.cargo = { weapons: {}, ammo: {} };
      raw.version = 4;
      return raw;
    },
    // v2 -> v3: транспорт і реорганізація
    2(raw) {
      for (const u of raw.units || []) if (u && typeof u === 'object') { if (u.embarked === undefined) u.embarked = null; if (!Array.isArray(u.carrying)) u.carrying = []; }
      raw.version = 3;
      return raw;
    }
  };

  function deserialize(text) {
    const errors = [];
    let raw;
    try { raw = typeof text === 'string' ? JSON.parse(text) : text; }
    catch (e) { return { ok: false, errors: ['Файл не є коректним JSON: ' + e.message] }; }
    if (!raw || typeof raw !== 'object') return { ok: false, errors: ['Порожній або пошкоджений файл.'] };
    if (raw.format !== CONFIG.saveFormat) return { ok: false, errors: ['Це не файл збереження Yugotaria: Civil War.'] };
    if (typeof raw.version !== 'number') return { ok: false, errors: ['Не вказано версію формату збереження.'] };
    if (raw.version > CONFIG.saveVersion) {
      return { ok: false, errors: [`Збереження створене новішою версією гри (формат ${raw.version}, підтримується до ${CONFIG.saveVersion}).`] };
    }
    const notes = [];
    while (raw.version < CONFIG.saveVersion) {
      const m = migrations[raw.version];
      if (!m) return { ok: false, errors: [`Немає перетворення для формату версії ${raw.version}.`] };
      raw = m(raw);
      notes.push(`Збереження оновлено до формату ${raw.version}.`);
    }

    // --- перевірка структури
    const m = raw.map;
    if (!m || !Number.isInteger(m.w) || !Number.isInteger(m.h) || m.w < 4 || m.h < 4 || m.w * m.h > 4000000) {
      return { ok: false, errors: ['Пошкоджені розміри карти.'] };
    }
    const N = m.w * m.h;
    for (const k of Object.keys(MAP_ARRAYS)) {
      if (!Array.isArray(m[k]) || m[k].length !== N) errors.push(`Шар карти «${k}» відсутній або має неправильну довжину.`);
    }
    if (Array.isArray(m.terrain) && m.terrain.some(t => !Number.isInteger(t) || t < 0 || t >= CONFIG.terrain.length)) errors.push('Невідомий тип місцевості в карті.');
    if (!Array.isArray(m.settlements)) errors.push('Відсутній список населених пунктів.');
    if (!raw.time || !Number.isInteger(raw.time.day) || !Number.isInteger(raw.time.hour) || raw.time.hour < 0 || raw.time.hour > 23) errors.push('Пошкоджений ігровий час.');
    if (!Number.isInteger(raw.phase) || raw.phase < 0 || raw.phase > 2) errors.push('Пошкоджена поточна фаза.');
    if (!Array.isArray(raw.units)) errors.push('Відсутній список підрозділів.');
    else {
      const ids = new Set();
      raw.units.forEach((u, n) => {
        const where = `Підрозділ №${n + 1}`;
        if (!u || typeof u !== 'object') { errors.push(`${where}: пошкоджений запис.`); return; }
        if (!CONFIG.unitTypes[u.type]) errors.push(`${where}: невідомий тип «${u.type}».`);
        if (!Number.isInteger(u.faction) || u.faction < 0 || u.faction > 2) errors.push(`${where}: невідома фракція.`);
        if (!Number.isInteger(u.idx) || u.idx < 0 || u.idx >= N) errors.push(`${where}: позиція поза картою.`);
        if (!u.personnel || typeof u.personnel.fit !== 'number') errors.push(`${where}: немає даних про особовий склад.`);
        if (ids.has(u.id)) errors.push(`${where}: повторний ідентифікатор ${u.id}.`);
        ids.add(u.id);
        if (u.embarked != null && !raw.units.some(v => v && v.id === u.embarked && Array.isArray(v.carrying) && v.carrying.includes(u.id))) errors.push(`${where}: пошкоджені дані посадки.`);
        if (u.order && (!Array.isArray(u.order.path) || u.order.path.some(i => !Number.isInteger(i) || i < 0 || i >= N))) errors.push(`${where}: пошкоджений маршрут наказу.`);
      });
    }
    if (!Array.isArray(raw.log)) errors.push('Відсутній журнал.');
    if (!Array.isArray(raw.intel) || raw.intel.length !== 3) errors.push('Пошкоджені дані розвідки.');
    if (!Array.isArray(raw.prisoners) || !Array.isArray(raw.lost)) errors.push('Пошкоджені дані про полонених або втрати.');
    if (!raw.caches || typeof raw.caches !== 'object' || Object.values(raw.caches).some(c => !c || !Number.isInteger(c.idx) || c.idx < 0 || c.idx >= N || !Array.isArray(c.dead))) errors.push('Пошкоджені дані про місця боїв.');
    if (Array.isArray(raw.units)) raw.units.forEach((u, n) => {
      if (u && (typeof u.morale !== 'number' || u.morale < 0 || u.morale > 100)) errors.push(`Підрозділ №${n + 1}: некоректна мораль.`);
      if (u && (!u.acc || typeof u.suppression !== 'number')) errors.push(`Підрозділ №${n + 1}: відсутні бойові дані.`);
    });
    if (errors.length) return { ok: false, errors };

    // --- відновлення
    const map = Object.assign({}, m);
    for (const [k, T] of Object.entries(MAP_ARRAYS)) map[k] = T.from(m[k]);
    const state = Object.assign({}, raw, { map });
    delete state.savedAt;
    return { ok: true, state, notes, savedAt: raw.savedAt || null };
  }

  // ----------------------------------------------------- локальне сховище
  function storage() {
    try {
      const s = window.localStorage;
      const t = PREFIX + '__test';
      s.setItem(t, '1'); s.removeItem(t);
      return s;
    } catch (e) { return null; }
  }

  function slotName(key) { return key === 'auto' ? 'Автозбереження' : 'Слот ' + key.slice(4); }

  function listSlots() {
    const s = storage();
    return SLOT_KEYS.map(key => {
      const entry = { key, name: slotName(key), empty: true };
      if (!s) return entry;
      try {
        const metaText = s.getItem(PREFIX + key + '.meta');
        if (metaText) Object.assign(entry, JSON.parse(metaText), { empty: false });
      } catch (e) { entry.broken = true; }
      return entry;
    });
  }

  function saveToSlot(key, state) {
    const s = storage();
    if (!s) return { ok: false, reason: 'Сховище браузера недоступне. Скористайтеся експортом у файл.' };
    try {
      const data = serialize(state);
      s.setItem(PREFIX + key, data);
      s.setItem(PREFIX + key + '.meta', JSON.stringify({
        savedAt: Date.now(), day: state.time.day, hour: state.time.hour, phase: state.phase,
        scenario: state.meta.scenario, units: state.units.length, bytes: data.length
      }));
      return { ok: true };
    } catch (e) {
      return { ok: false, reason: 'Не вдалося записати збереження (можливо, сховище переповнене): ' + e.message };
    }
  }

  function loadFromSlot(key) {
    const s = storage();
    if (!s) return { ok: false, errors: ['Сховище браузера недоступне.'] };
    let text;
    try { text = s.getItem(PREFIX + key); } catch (e) { return { ok: false, errors: ['Помилка читання сховища: ' + e.message] }; }
    if (!text) return { ok: false, errors: ['Слот порожній.'] };
    return deserialize(text);
  }

  function deleteSlot(key) {
    const s = storage();
    if (!s) return { ok: false };
    try { s.removeItem(PREFIX + key); s.removeItem(PREFIX + key + '.meta'); } catch (e) { return { ok: false }; }
    return { ok: true };
  }

  return { serialize, deserialize, listSlots, saveToSlot, loadFromSlot, deleteSlot, slotName, storageAvailable: () => !!storage() };
})();

// ---- 90_ui.js
// ============================================================================
// МОДУЛЬ: ІНТЕРФЕЙС — РЕНДЕРИНГ КАРТИ, ПАНЕЛІ, ВВЕДЕННЯ
// Інтерфейс лише читає стан і викликає Engine / Combat / Intel / SaveSystem.
// Показує тільки те, що знає фракція поточної фази (туман війни).
// ============================================================================
const UI = (() => {
  let state = null;
  const view = { cx: 0, cy: 0, s: 24, showControl: true, showGrid: true };
  let selectedId = null, selectedHex = -1, hoverHex = -1;
  let selectedEnemy = null;          // id ворожого підрозділу (видимого або позначки)
  let mode = null;                   // null | 'move' | 'retreat' | 'attack'
  let preview = null;                // попередній перегляд руху або атаки
  let intensity = 'normal';
  let report = null;                 // звіт бою для показу
  let leftTab = 'own';               // own | intel
  let handover = true;               // екран передачі ходу
  let canvas, ctx, cw = 0, ch = 0, dpr = 1, dirty = true;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fcolor = f => getComputedStyle(document.documentElement).getPropertyValue('--f-' + CONFIG.factions[f].key).trim() || CONFIG.factions[f].color;
  let FC = CONFIG.factions.map(f => f.color);
  const MAPFC = CONFIG.factions.map(f => f.color);   // кольори на паперовій карті
  const ABBR = ['СВ', 'ДП', 'НП'];
  const pf = () => Engine.phaseFaction(state);

  // ------------------------------------------------------------ ініціалізація
  function init() {
    canvas = $('map');
    ctx = canvas.getContext('2d');
    FC = [0, 1, 2].map(fcolor);
    const ro = new ResizeObserver(resize);
    ro.observe($('mapwrap'));
    bindInput();
    bindButtons();
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', () => { FC = [0, 1, 2].map(fcolor); renderAll(); });
    requestAnimationFrame(loop);
  }

  function resetSelection() {
    selectedId = null; selectedHex = -1; selectedEnemy = null; mode = null; preview = null; report = null;
  }

  function setState(s, opts = {}) {
    state = s;
    resetSelection();
    leftTab = 'own';
    focusFaction();
    handover = opts.handover !== false;
    renderAll();
  }

  function focusFaction() {
    const f = pf();
    const first = state.units.find(u => u.faction === f);
    if (first) centerOn(first.idx); else centerOn(Math.floor(state.map.w * state.map.h / 2));
  }

  function resize() {
    const r = $('mapwrap').getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    cw = Math.max(1, r.width); ch = Math.max(1, r.height);
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    dirty = true;
  }

  function loop() {
    if (dirty && state) { draw(); dirty = false; }
    requestAnimationFrame(loop);
  }
  const redraw = () => { dirty = true; };

  // ------------------------------------------------------------- координати
  function toScreen(x, y) { return [(x - view.cx) * view.s + cw / 2, (y - view.cy) * view.s + ch / 2]; }
  function toWorld(sx, sy) { return [(sx - cw / 2) / view.s + view.cx, (sy - ch / 2) / view.s + view.cy]; }
  function hexAtScreen(sx, sy) {
    const [x, y] = toWorld(sx, sy);
    const o = Hex.fromPoint(x, y);
    return Engine.grid(state).idx(o.col, o.row);
  }
  function centerOn(idx) {
    const c = Engine.grid(state).center(idx);
    view.cx = c.x; view.cy = c.y; redraw();
  }
  function clampView() {
    const maxX = 1.5 * (state.map.w - 1), maxY = SQRT3 * (state.map.h - 0.5);
    view.cx = Math.min(maxX, Math.max(0, view.cx));
    view.cy = Math.min(maxY, Math.max(0, view.cy));
  }
  function zoomAt(factor, sx = cw / 2, sy = ch / 2) {
    const [wx, wy] = toWorld(sx, sy);
    view.s = Math.min(70, Math.max(5, view.s * factor));
    const [wx2, wy2] = toWorld(sx, sy);
    view.cx += wx - wx2; view.cy += wy - wy2;
    clampView(); redraw();
  }

  // -------------------------------------------- що бачить поточна фракція
  function visibleEnemies() {
    const f = pf();
    return [...Intel.visibleIds(state, f)].map(id => Engine.unitById(state, id)).filter(Boolean);
  }
  function staleMarkers() { return Intel.knownList(state, pf()).filter(m => !m.visible); }
  function knownRecord(id) { return Intel.knownList(state, pf()).find(m => m.id === id) || null; }

  // ---------------------------------------------------------------- малювання
  function hexPath(x, y, r) {
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = Math.PI / 3 * k;
      const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }

  function draw() {
    const g = Engine.grid(state), m = state.map, s = view.s;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--mapbg').trim() || '#cfcbbb';
    ctx.fillRect(0, 0, cw, ch);
    if (handover) return;

    const [wl, wt] = toWorld(0, 0), [wr, wb] = toWorld(cw, ch);
    const c0 = Math.max(0, Math.floor(wl / 1.5) - 1), c1 = Math.min(m.w - 1, Math.ceil(wr / 1.5) + 1);
    const r0 = Math.max(0, Math.floor(wt / SQRT3) - 1), r1 = Math.min(m.h - 1, Math.ceil(wb / SQRT3) + 1);
    const vis = [];
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) vis.push(r * m.w + c);

    for (const i of vis) {
      const cc = g.center(i); const [x, y] = toScreen(cc.x, cc.y);
      hexPath(x, y, s + 0.5);
      ctx.fillStyle = CONFIG.terrain[m.terrain[i]].color;
      ctx.fill();
      if (s >= 13) drawTerrainMarks(i, x, y, s);
    }
    if (view.showControl) {
      ctx.globalAlpha = 0.15;
      for (const i of vis) {
        const c = m.control[i]; if (c < 0) continue;
        const cc = g.center(i); const [x, y] = toScreen(cc.x, cc.y);
        hexPath(x, y, s); ctx.fillStyle = MAPFC[c]; ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (view.showGrid && s >= 9) {
      ctx.strokeStyle = 'rgba(40,40,30,0.16)'; ctx.lineWidth = 1;
      for (const i of vis) { const cc = g.center(i); const [x, y] = toScreen(cc.x, cc.y); hexPath(x, y, s); ctx.stroke(); }
    }
    if (view.showControl) {
      ctx.lineWidth = Math.max(1.5, s * 0.1); ctx.strokeStyle = 'rgba(35,30,25,0.75)'; ctx.setLineDash([s * 0.3, s * 0.18]);
      ctx.beginPath();
      for (const i of vis) {
        const a = m.control[i]; if (a < 0) continue;
        const cc = g.center(i); const [x, y] = toScreen(cc.x, cc.y);
        for (let d = 0; d < 3; d++) {
          const n = g.neighbor(i, d); if (n < 0) continue;
          const b = m.control[n]; if (b < 0 || b === a) continue;
          const ang = Hex.DIR_ANGLE[d] * Math.PI / 180;
          const a1 = ang - Math.PI / 6, a2 = ang + Math.PI / 6;
          ctx.moveTo(x + s * Math.cos(a1), y + s * Math.sin(a1));
          ctx.lineTo(x + s * Math.cos(a2), y + s * Math.sin(a2));
        }
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
    // річки
    ctx.strokeStyle = '#4f7f9c'; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(2, s * 0.22);
    ctx.beginPath();
    for (const i of vis) {
      if (!m.river[i]) continue;
      const cc = g.center(i); const [x, y] = toScreen(cc.x, cc.y);
      let links = 0;
      for (let d = 0; d < 6; d++) {
        const n = g.neighbor(i, d); if (n < 0) continue;
        if (m.river[n] || (m.terrain[n] === TERRAIN_ID.sea && links < 1)) {
          const ang = Hex.DIR_ANGLE[d] * Math.PI / 180;
          ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang) * s * 0.87, y + Math.sin(ang) * s * 0.87); links++;
        }
      }
    }
    ctx.stroke();
    // дороги
    for (const level of [1, 2]) {
      ctx.beginPath();
      for (const i of vis) {
        if (m.road[i] < level || !m.roadDirs[i]) continue;
        const cc = g.center(i); const [x, y] = toScreen(cc.x, cc.y);
        for (let d = 0; d < 6; d++) {
          if (!(m.roadDirs[i] & (1 << d))) continue;
          const n = g.neighbor(i, d);
          if (n < 0) continue;
          if (Math.min(m.road[i], m.road[n]) !== level) continue;
          const ang = Hex.DIR_ANGLE[d] * Math.PI / 180;
          ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang) * s * 0.87, y + Math.sin(ang) * s * 0.87);
        }
      }
      if (level === 2) {
        ctx.lineWidth = Math.max(2.5, s * 0.24); ctx.strokeStyle = '#3e332c'; ctx.setLineDash([]); ctx.stroke();
        ctx.lineWidth = Math.max(1, s * 0.1); ctx.strokeStyle = '#d9b36a'; ctx.stroke();
      } else {
        ctx.lineWidth = Math.max(1.2, s * 0.1); ctx.strokeStyle = '#7a5a3a'; ctx.setLineDash([s * 0.25, s * 0.15]); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    for (const i of vis) {
      if (!m.bridge[i]) continue;
      const cc = g.center(i); const [x, y] = toScreen(cc.x, cc.y);
      ctx.strokeStyle = '#1d1d1a'; ctx.lineWidth = Math.max(1.5, s * 0.08);
      const w = s * 0.42;
      ctx.beginPath();
      ctx.moveTo(x - w, y - w * 0.55); ctx.lineTo(x + w, y - w * 0.55);
      ctx.moveTo(x - w, y + w * 0.55); ctx.lineTo(x + w, y + w * 0.55);
      ctx.stroke();
    }
    if (s >= 7) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const st of m.settlements) {
        const cc = g.center(st.center); const [x, y] = toScreen(cc.x, cc.y - (st.kind === 'city' ? 4.3 : 1.8));
        if (x < -100 || x > cw + 100 || y < -40 || y > ch + 40) continue;
        const fs = st.kind === 'city' ? Math.max(12, s * 0.75) : Math.max(10, s * 0.55);
        ctx.font = `${st.kind === 'city' ? 700 : 600} ${fs}px 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif`;
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(245,240,225,0.9)'; ctx.strokeText(st.name.toUpperCase(), x, y);
        ctx.fillStyle = '#25231e'; ctx.fillText(st.name.toUpperCase(), x, y);
      }
    }
    // ніч
    if (Engine.isNight(state.time.hour)) { ctx.fillStyle = 'rgba(15,20,40,0.22)'; ctx.fillRect(0, 0, cw, ch); }

    if (preview && preview.ok && preview.path) drawPreview(g);
    drawTargets(g);
    drawMarkers(g, new Set(vis));
    drawUnits(g, vis);
    drawCaches(g, new Set(vis));
    if (preview && preview.ok && preview.hex != null && !preview.path) drawFireLine(g);
    if (hoverHex >= 0) { const cc = g.center(hoverHex); const [x, y] = toScreen(cc.x, cc.y); hexPath(x, y, s - 1); ctx.strokeStyle = 'rgba(20,20,15,0.6)'; ctx.lineWidth = 1.5; ctx.stroke(); }
    if (selectedHex >= 0) { const cc = g.center(selectedHex); const [x, y] = toScreen(cc.x, cc.y); hexPath(x, y, s - 1.5); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5; ctx.stroke(); }
  }

  function drawTerrainMarks(i, x, y, s) {
    const t = CONFIG.terrain[state.map.terrain[i]].key;
    const h = (k) => hash2(i, k, 7);
    ctx.save();
    switch (t) {
      case 'forest': case 'denseForest': {
        const n = t === 'forest' ? 3 : 6;
        ctx.fillStyle = t === 'forest' ? '#6f845f' : '#4f6a4a';
        for (let k = 0; k < n; k++) {
          const px = x + (h(k) - 0.5) * s * 1.1, py = y + (h(k + 9) - 0.5) * s * 1.0;
          ctx.beginPath(); ctx.arc(px, py, s * 0.13, 0, Math.PI * 2); ctx.fill();
        }
        break;
      }
      case 'mountains': {
        ctx.strokeStyle = '#7d6a50'; ctx.lineWidth = Math.max(1, s * 0.07);
        ctx.beginPath();
        for (let k = 0; k < 2; k++) {
          const px = x + (k ? 0.3 : -0.3) * s, py = y + (k ? 0.15 : -0.05) * s, w = s * 0.32;
          ctx.moveTo(px - w, py + w * 0.6); ctx.lineTo(px, py - w * 0.6); ctx.lineTo(px + w, py + w * 0.6);
        }
        ctx.stroke(); break;
      }
      case 'swamp': {
        ctx.strokeStyle = '#5f7f78'; ctx.lineWidth = Math.max(1, s * 0.06); ctx.beginPath();
        for (let k = -1; k <= 1; k++) { ctx.moveTo(x - s * 0.4, y + k * s * 0.3); ctx.lineTo(x + s * 0.4, y + k * s * 0.3); }
        ctx.stroke(); break;
      }
      case 'farmland': {
        ctx.strokeStyle = 'rgba(150,130,70,0.45)'; ctx.lineWidth = 1; ctx.beginPath();
        for (let k = -2; k <= 2; k++) { ctx.moveTo(x - s * 0.6 + k * s * 0.25, y + s * 0.5); ctx.lineTo(x - s * 0.1 + k * s * 0.25, y - s * 0.5); }
        ctx.stroke(); break;
      }
      case 'city': case 'village': case 'industrial': {
        ctx.fillStyle = t === 'industrial' ? '#6f6a64' : t === 'city' ? '#7c6b5d' : '#8c7558';
        const n = t === 'village' ? 3 : 5;
        for (let k = 0; k < n; k++) {
          const px = x + (h(k) - 0.5) * s * 1.0, py = y + (h(k + 5) - 0.5) * s * 0.9;
          const w = s * (t === 'industrial' ? 0.32 : 0.2);
          ctx.fillRect(px - w / 2, py - w / 2, w, w * (t === 'industrial' ? 0.6 : 1));
        }
        break;
      }
    }
    ctx.restore();
  }

  function drawPreview(g) {
    const s = view.s;
    const u = Engine.unitById(state, preview.unitId);
    const pts = [u.idx].concat(preview.path).map(i => { const c = g.center(i); return toScreen(c.x, c.y); });
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const col = preview.kind === 'retreat' ? '#7a3a14' : '#111';
    for (let k = 1; k < pts.length; k++) {
      const hour = preview.hourOf[k - 1];
      const now = hour === 0 && !preview.pending;
      ctx.strokeStyle = now ? col : 'rgba(17,17,17,0.45)';
      ctx.lineWidth = Math.max(2.5, s * 0.16);
