<title>Yugotaria: Civil War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Макет: штабний планшет — карта в центрі, ліворуч сили фракції, праворуч картка й накази, знизу журнал. */
:root {
  --bg: #e4e2d8;
  --panel: #f1efe6;
  --panel-2: #e9e6da;
  --line: #c6c2b0;
  --fg: #22241f;
  --muted: #66685c;
  --accent: #4b5a36;
  --accent-fg: #f3f1e8;
  --warn: #9a5b12;
  --bad: #9b2f25;
  --mapbg: #cfcbbb;
  --font-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
  --f-soc: #a4433a; --f-dem: #3b5f8f; --f-nat: #a87d22;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171914; --panel: #20231d; --panel-2: #282b24; --line: #3b3f35; --fg: #e2e0d4; --muted: #9b9c8c;
    --accent: #a8b886; --accent-fg: #161812; --warn: #d89a4a; --bad: #e0766a; --mapbg: #2a2d26;
    --f-soc: #c9675d; --f-dem: #6f93c4; --f-nat: #cfa448;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171914; --panel: #20231d; --panel-2: #282b24; --line: #3b3f35; --fg: #e2e0d4; --muted: #9b9c8c;
  --accent: #a8b886; --accent-fg: #161812; --warn: #d89a4a; --bad: #e0766a; --mapbg: #2a2d26;
  --f-soc: #c9675d; --f-dem: #6f93c4; --f-nat: #cfa448;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px; cursor: pointer;
  letter-spacing: 0.02em;
}
button:hover:not(:disabled) { border-color: var(--muted); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.toggle[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
.num, .data { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

#app {
  height: 100%; display: grid;
  grid-template-columns: 270px minmax(0, 1fr) 330px;
  grid-template-rows: auto minmax(0, 1fr) 170px;
  grid-template-areas: "top top top" "left map right" "left log right";
}
#top {
  grid-area: top; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 7px max(12px, env(safe-area-inset-right, 0px)) 7px max(12px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 15px; white-space: nowrap; }
.brand small { font-weight: 500; color: var(--muted); letter-spacing: 0.04em; margin-left: 6px; text-transform: none; }
.clock { font-family: var(--font-data); font-size: 15px; font-weight: 500; white-space: nowrap; }
.phases { display: flex; gap: 2px; flex-wrap: wrap; }
.phase-chip {
  font-size: 12px; padding: 4px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.phase-chip.active { color: #fff; font-weight: 600; border-color: transparent; }
.spacer { flex: 1; }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }

aside, #log { background: var(--panel); min-height: 0; min-width: 0; }
#left { grid-area: left; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#right { grid-area: right; border-left: 1px solid var(--line); overflow-y: auto; }
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; background: var(--mapbg); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#log { grid-area: log; border-top: 1px solid var(--line); display: flex; flex-direction: column; }

.sec { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sec h3 {
  margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600;
}
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 7px 4px; font-size: 12px; border-bottom: 3px solid transparent; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); font-weight: 600; }
#unitlist { overflow-y: auto; flex: 1; min-height: 0; }
.urow {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; width: 100%;
  padding: 6px 12px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; text-align: left;
}
.urow:hover { background: var(--panel-2); }
.urow.sel { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
.urow .ic { height: 20px; border: 1.5px solid; font-size: 10px; display: grid; place-items: center; font-weight: 700; color: #fff; }
.urow .nm { font-weight: 600; font-size: 13px; }
.urow .st { font-size: 12px; color: var(--muted); }
.urow .mp { font-family: var(--font-data); font-size: 12px; color: var(--muted); }

.ctlbar { display: flex; height: 8px; margin: 4px 0 6px; overflow: hidden; border-radius: 1px; }
.ctlbar i { display: block; height: 100%; }
.ctlrow { display: flex; justify-content: space-between; font-size: 12.5px; gap: 6px; white-space: nowrap; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }
.settl { font-size: 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-top: 6px; }

.card-head { display: flex; gap: 10px; align-items: center; }
.card-head .flag { width: 6px; align-self: stretch; }
.card-head h2 { margin: 0; font-size: 18px; line-height: 1.1; text-wrap: balance; }
.card-head .sub { font-size: 12px; color: var(--muted); }
.moralebar { height: 6px; background: var(--panel-2); border: 1px solid var(--line); margin-top: 4px; }
.moralebar > i { display: block; height: 100%; background: var(--accent); }
.list { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.list li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.list li span:last-child { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.orders { display: flex; gap: 6px; flex-wrap: wrap; }
.notice { font-size: 12px; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
.notice.warn { color: var(--warn); }
.notice.bad { color: var(--bad); }
.route { background: var(--panel-2); border: 1px solid var(--line); padding: 10px; margin-top: 8px; }
.route ul { margin: 6px 0; padding-left: 18px; font-size: 12px; line-height: 1.45; }
.chip { font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 2px; white-space: nowrap; }
.chip.warn { color: var(--warn); border-color: currentColor; }
.chip.ok { color: var(--accent); border-color: currentColor; }
.unitsinhex button { display: block; width: 100%; text-align: left; margin-top: 4px; font-size: 13px; }

.loghead { display: flex; align-items: center; gap: 10px; padding: 5px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
.loghead h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
#logbody { overflow-y: auto; flex: 1; min-height: 0; padding: 4px 12px; font-size: 12.5px; }
.le { display: grid; grid-template-columns: 82px 12px 1fr; gap: 6px; padding: 2px 0; line-height: 1.35; }
.le .t { font-family: var(--font-data); color: var(--muted); font-size: 11.5px; }
.le.phase .x, .le.hour .x, .le.day .x { font-weight: 600; }
.le.warn .x { color: var(--warn); }
.le .x { min-width: 0; overflow-wrap: anywhere; }

.mapctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
.mapctl button { background: var(--panel); min-width: 34px; font-size: 13px; padding: 5px 8px; }
#hexinfo {
  position: absolute; left: 10px; bottom: 10px; z-index: 2; background: var(--panel); border: 1px solid var(--line);
  padding: 5px 9px; font-size: 12px; font-family: var(--font-data); max-width: calc(100% - 20px); pointer-events: none;
}
#modehint {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 2; background: var(--fg); color: var(--panel);
  padding: 5px 12px; font-size: 13px; border-radius: 2px; max-width: calc(100% - 120px); text-align: center;
}
#banner {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 3;
}
#banner div {
  background: var(--panel); border: 1px solid var(--line); border-left-width: 8px; padding: 14px 26px; text-align: center;
  font-size: 22px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; animation: bannerOut 1.8s ease forwards;
}
#banner div small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 4px; }
@keyframes bannerOut { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #banner div { animation-duration: 0.01s; animation-delay: 1.4s; } }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
#toast div { background: var(--fg); color: var(--panel); padding: 7px 14px; font-size: 13px; border-radius: 2px; max-width: 90vw; }
#toast div.bad { background: var(--bad); color: #fff; }

.modal-back { position: fixed; inset: 0; background: rgba(10, 12, 8, 0.55); z-index: 30; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); width: min(640px, 100%); max-height: 100%; overflow-y: auto; }
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal header h2 { margin: 0; font-size: 16px; text-transform: uppercase; letter-spacing: 0.08em; }
.modal .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.slot { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel-2); }
.slot .meta { font-size: 12px; color: var(--muted); font-family: var(--font-data); }
.slot .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.modal textarea { width: 100%; min-height: 120px; font-family: var(--font-data); font-size: 11px; background: var(--bg); border: 1px solid var(--line); padding: 6px; }
.modal table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.modal th, .modal td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; }
.modal td.n { text-align: right; font-family: var(--font-data); }
.tablewrap { overflow-x: auto; }
.modal ol, .modal ul { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row input[type="number"] { width: 120px; padding: 5px 8px; background: var(--bg); border: 1px solid var(--line); }
.errlist { color: var(--bad); font-size: 13px; }


#handover {
  grid-row: 2 / -1; grid-column: 1 / -1; z-index: 5; background: var(--bg);
  display: grid; place-items: center; padding: 16px;
  background-image: repeating-linear-gradient(135deg, transparent 0 22px, color-mix(in srgb, var(--line) 35%, transparent) 22px 23px);
}
#handover[hidden] { display: none; }
/* Панель ходу ботів / режиму глядача у верхньому рядку */
#botbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
#botbar[hidden] { display: none; }
#botbar .who { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
#botbar select { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 4px; margin-left: 4px; }
#botbar button { padding: 3px 9px; }
/* Рішення (фокуси) у «Політиці» */
.dec-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.dec { border: 1px solid var(--line); border-left: 4px solid var(--line); background: var(--panel-2); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.dec.available { border-left-color: var(--accent); }
.dec.active { border-left-color: var(--warn); }
.dec.done { opacity: 0.75; border-left-color: var(--muted); }
.dec.excluded { opacity: 0.55; }
.dec p { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--fg); }
.dec-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.dec-st { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.dec-req { margin: 0; padding: 0; list-style: none; font-size: 12px; }
.dec-req .ok { color: var(--accent); } .dec-req .no { color: var(--bad); }
.dec-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: auto; }
/* Онлайн: лобі й чат */
#netlobby { position: fixed; inset: 0; z-index: 26; background: var(--bg); overflow-y: auto; display: grid; place-items: center; padding: 24px 16px; }
#netlobby[hidden] { display: none; }
.nl-card { background: var(--panel); border: 1px solid var(--line); border-top: 8px solid var(--accent); width: min(640px, 100%); padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.nl-card h1 { margin: 0; font-size: 26px; letter-spacing: 0.1em; text-transform: uppercase; }
.nl-card h1 small { display: block; font-size: 12px; letter-spacing: 0.14em; color: var(--muted); font-weight: 500; margin-top: 3px; }
.nl-card h2 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
.nl-card input { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; }
.nl-card select { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; }
.nl-card .notice { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.nl-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.nl-status { font-size: 12px; white-space: nowrap; } .nl-status.online { color: #2f8a3a; } .nl-status.offline { color: var(--bad); } .nl-status.connecting { color: var(--muted); }
.nl-host { font-size: 12px; color: var(--accent); font-weight: 600; }
.nl-slots { display: flex; flex-direction: column; gap: 6px; }
.nl-slot { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); }
.nl-slot.me { border-color: var(--accent); }
.nl-slot .nl-act { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.nl-free { color: var(--muted); font-style: italic; } .nl-bot { color: var(--muted); } .nl-pl.off { color: var(--muted); }
.nl-players { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; font-size: 13px; } .nl-players .off { color: var(--muted); }
.nl-chat .chat-list { max-height: 180px; }
.nl-rooms { display: flex; flex-direction: column; gap: 6px; }
.nl-room { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); }
.nl-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.mm-net { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.mm-net .notice { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
#chatPanel { position: fixed; right: 12px; bottom: 12px; z-index: 24; width: min(380px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,0.25); display: flex; flex-direction: column; }
#chatPanel[hidden] { display: none; }
.chat-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.chat-head button { padding: 2px 8px; }
#chatBody { padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.chat-list { max-height: 260px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.cm { line-height: 1.35; } .cm.sys { color: var(--muted); font-style: italic; } .cm.priv { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.cm-t { color: var(--muted); font-family: var(--font-data); font-size: 11px; margin-right: 4px; }
.chat-in { display: flex; gap: 6px; } .chat-in input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; }
.chat-in select { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 4px; max-width: 110px; }
@media (max-width: 520px) { .nl-slot { grid-template-columns: auto 1fr; } .nl-slot .nl-act { grid-column: 1 / -1; justify-content: flex-start; } }
/* Головне меню */
#mainmenu { position: fixed; inset: 0; z-index: 25; background: var(--bg); overflow-y: auto; display: grid; place-items: center; padding: 24px 16px;
  background-image: repeating-linear-gradient(135deg, transparent 0 22px, color-mix(in srgb, var(--line) 35%, transparent) 22px 23px); }
#mainmenu[hidden] { display: none; }
.mm-card { background: var(--panel); border: 1px solid var(--line); border-top: 8px solid var(--accent); width: min(560px, 100%); padding: 26px 28px; display: flex; flex-direction: column; gap: 18px; }
.mm-card h1 { margin: 0; font-size: 30px; letter-spacing: 0.1em; text-transform: uppercase; }
.mm-card h1 small { display: block; font-size: 13px; letter-spacing: 0.14em; color: var(--muted); font-weight: 500; margin-top: 4px; }
.mm-card h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; }
.mm-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.mm-new { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.mm-new .notice { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.mm-new .notice.warn { color: var(--warn); }
.mm-sides { display: flex; flex-direction: column; gap: 6px; }
.mm-side { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); }
.mm-side .nm { font-weight: 600; }
.mm-side select { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 5px 6px; min-width: 150px; }
@media (max-width: 520px) { .mm-card { padding: 20px 16px; } .mm-side { grid-template-columns: auto 1fr; } .mm-side select { grid-column: 1 / -1; width: 100%; } }
.ho-card { background: var(--panel); border: 1px solid var(--line); border-top: 8px solid; padding: 26px 30px; max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.ho-card h2 { margin: 0; font-size: 26px; text-transform: uppercase; letter-spacing: 0.06em; text-wrap: balance; }
.ho-card p { margin: 0; color: var(--muted); line-height: 1.45; }
.ho-time { font-family: var(--font-data); font-size: 13px; color: var(--muted); }
.ho-card button { font-size: 15px; padding: 9px 22px; }
.intens { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
.intens button { font-size: 12px; padding: 3px 8px; }
.report { background: var(--panel-2); }
.rep-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rep-head h3 { margin: 0; }
.rep-title { font-weight: 700; margin: 6px 0 4px; font-size: 14px; }
.rep-step h4 { margin: 8px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.rep-step p { margin: 2px 0; font-size: 12.5px; line-height: 1.4; }
.muted { color: var(--muted); font-weight: 400; }
.subsec { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
.subsec h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.pickrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
