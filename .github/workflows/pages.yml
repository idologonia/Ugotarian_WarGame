# Збирає гру, проганяє тести правил і публікує її на GitHub Pages
# (https://idologonia.github.io/Ugotarian_WarGame/). Запускається на кожен пуш у main
# або вручну (Actions → «Збірка й публікація гри» → Run workflow).
# Потрібно один раз увімкнути: Settings → Pages → Source: GitHub Actions.
name: Збірка й публікація гри

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Збірка
        run: node build.js
      - name: Тести правил
        run: node test/run.js
      - name: Підготовка сайту
        run: |
          mkdir -p _site
          cp dist/Yugotaria-Civil-War.html _site/index.html
          cp dist/hgs.js _site/hgs.js
          cp -r releases _site/releases
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
